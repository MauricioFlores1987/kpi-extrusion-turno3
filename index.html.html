<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>KPIs Extrusión · Turno 3 | Hoffens (Visor)</title>
<style>

  :root{
    --navy:#2A2670;
    --navy-dark:#1B1850;
    --navy-tint:#EEEDF8;
    --yellow:#F5E202;
    --ink:#1A1745;
    --muted:#6B6E85;
    --bg:#F5F5FA;
    --card:#FFFFFF;
    --ok:#178A4C;
    --ok-bg:#E8F7EE;
    --warn:#B8860B;
    --warn-bg:#FDF6DE;
    --bad:#C0392B;
    --bad-bg:#FBEAE8;
    --line:#E4E3F0;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  #hoffens-app{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    padding-bottom:48px;
    font-variant-numeric:tabular-nums;
  }
  #hoffens-app .header{
    background:var(--navy);
    background-image:linear-gradient(135deg,var(--navy) 0%,var(--navy-dark) 100%);
    padding:18px 18px 16px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 4px 16px rgba(27,24,80,0.25);
  }
  #hoffens-app .header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  #hoffens-app .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  #hoffens-app .brand img{
    height:30px;
    width:auto;
    background:#fff;
    border-radius:6px;
    padding:3px 5px;
  }
  #hoffens-app .brand-text{
    color:#fff;
  }
  #hoffens-app .brand-text .t1{
    font-size:10.5px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--yellow);
    font-weight:700;
    line-height:1.2;
  }
  #hoffens-app .brand-text .t2{
    font-size:14px;
    font-weight:700;
    line-height:1.25;
  }
  #hoffens-app .edit-toggle{
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    border-radius:20px;
    padding:6px 12px;
    font-size:12px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:5px;
    cursor:pointer;
  }
  #hoffens-app .edit-toggle.active{
    background:var(--yellow);
    color:var(--navy-dark);
    border-color:var(--yellow);
  }
  #hoffens-app .week-picker{
    display:flex;
    align-items:center;
    gap:8px;
  }
  #hoffens-app .week-select{
    flex:1;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    border-radius:10px;
    padding:9px 10px;
    font-size:13px;
    font-weight:600;
  }
  #hoffens-app .week-select option{ color:#111; }
  #hoffens-app .icon-btn{
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    border-radius:10px;
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  #hoffens-app .content{ padding:16px; }
  #hoffens-app .section{ margin-bottom:26px; }
  #hoffens-app .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    gap:10px;
  }
  #hoffens-app .section-icon{
    width:34px;height:34px;
    border-radius:10px;
    background:var(--navy-tint);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    flex-shrink:0;
  }
  #hoffens-app .section-head-text{ flex:1; min-width:0; }
  #hoffens-app .section-eyebrow{
    font-size:10.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
  }
  #hoffens-app .section-title{
    font-size:17px;
    font-weight:800;
    color:var(--navy);
    margin-top:2px;
  }
  #hoffens-app .badge-focus{
    background:var(--navy);
    color:var(--yellow);
    font-size:10px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:4px 9px;
    border-radius:20px;
  }

  /* KPI grande cards (plant-wide) */
  #hoffens-app .kpi-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  #hoffens-app .kpi-card{
    background:var(--card);
    border-radius:var(--radius);
    padding:14px;
    border:1px solid var(--line);
  }
  #hoffens-app .kpi-card .kpi-label{
    font-size:10.5px;
    font-weight:700;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin-bottom:6px;
    min-height:26px;
  }
  #hoffens-app .kpi-card .kpi-value{
    font-size:24px;
    font-weight:800;
    color:var(--navy);
    line-height:1.1;
  }
  #hoffens-app .kpi-card .kpi-sub{
    font-size:11px;
    color:var(--muted);
    margin-top:4px;
  }
  #hoffens-app .status-dot{
    display:inline-block;
    width:8px;height:8px;
    border-radius:50%;
    margin-right:5px;
  }
  #hoffens-app .status-ok .status-dot{ background:var(--ok); }
  #hoffens-app .status-warn .status-dot{ background:var(--warn); }
  #hoffens-app .status-bad .status-dot{ background:var(--bad); }
  #hoffens-app .nave-metric.status-ok{ background:var(--ok-bg); }
  #hoffens-app .nave-metric.status-warn{ background:var(--warn-bg); }
  #hoffens-app .nave-metric.status-bad{ background:var(--bad-bg); }
  #hoffens-app .nave-metric.status-ok .nm-value{ color:var(--ok); }
  #hoffens-app .nave-metric.status-warn .nm-value{ color:var(--warn); }
  #hoffens-app .nave-metric.status-bad .nm-value{ color:var(--bad); }

  /* Turno comparativo */
  #hoffens-app .turno-scroll{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:4px;
    margin:0 -16px;
    padding-left:16px;
    padding-right:16px;
  }
  #hoffens-app .turno-card{
    flex:0 0 78%;
    background:var(--card);
    border-radius:var(--radius);
    padding:14px;
    border:1px solid var(--line);
    scroll-snap-align:start;
  }
  #hoffens-app .turno-scroll{ scroll-snap-type:x mandatory; }
  #hoffens-app .turno-card.is-focus{
    border:2px solid var(--navy);
    background:linear-gradient(180deg,var(--navy-tint) 0%,#fff 60%);
  }
  #hoffens-app .turno-name{ font-size:14px; font-weight:800; color:var(--navy); }
  #hoffens-app .turno-role{
    font-size:10.5px;
    font-weight:700;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:10px;
  }
  #hoffens-app .turno-metric-row{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border-top:1px solid var(--line);
    font-size:13px;
  }
  #hoffens-app .turno-metric-row:first-of-type{ border-top:none; }
  #hoffens-app .turno-metric-row .m-label{ color:var(--muted); }
  #hoffens-app .turno-metric-row .m-value{ font-weight:700; }
  #hoffens-app .focus-pill{
    display:inline-block;
    background:var(--yellow);
    color:var(--navy-dark);
    font-size:9.5px;
    font-weight:800;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:20px;
    margin-bottom:8px;
  }

  /* Naves */
  #hoffens-app .nave-card{
    background:var(--card);
    border-radius:var(--radius);
    padding:14px;
    border:1px solid var(--line);
    margin-bottom:10px;
  }
  #hoffens-app .nave-top{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  #hoffens-app .nave-avatar{
    width:42px;height:42px;
    border-radius:50%;
    background:var(--navy);
    color:var(--yellow);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;
    font-size:14px;
    flex-shrink:0;
  }
  #hoffens-app .nave-title{ font-size:14px; font-weight:800; color:var(--navy); }
  #hoffens-app .nave-lider{ font-size:12px; color:var(--muted); font-weight:600; }
  #hoffens-app .nave-metrics{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  #hoffens-app .nave-metric{
    background:var(--bg);
    border-radius:10px;
    padding:8px 6px;
    text-align:center;
  }
  #hoffens-app .nave-metric .nm-label{
    font-size:9.5px;
    color:var(--muted);
    font-weight:700;
    text-transform:uppercase;
    margin-bottom:3px;
  }
  #hoffens-app .nave-metric .nm-value{
    font-size:14px;
    font-weight:800;
    color:var(--ink);
  }
  #hoffens-app .expand-btn{
    width:100%;
    background:none;
    border:none;
    border-top:1px solid var(--line);
    margin-top:10px;
    padding-top:10px;
    color:var(--navy);
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
  }
  #hoffens-app .machine-table{
    margin-top:10px;
    border-top:1px solid var(--line);
    padding-top:10px;
  }
  #hoffens-app .machine-row{
    display:grid;
    grid-template-columns:1.1fr 0.9fr 0.9fr 0.9fr;
    gap:4px;
    font-size:11.5px;
    padding:6px 0;
    align-items:center;
  }
  #hoffens-app .machine-row.head{
    color:var(--muted);
    font-weight:700;
    font-size:9.5px;
    text-transform:uppercase;
  }
  #hoffens-app .machine-row .mv{ font-weight:700; text-align:right; }
  #hoffens-app .machine-row .mname{ font-weight:700; color:var(--ink); }

  /* Rankings */
  #hoffens-app .rank-tabs{
    display:flex;
    gap:6px;
    margin-bottom:10px;
  }
  #hoffens-app .rank-tab{
    flex:1;
    text-align:center;
    padding:8px 4px;
    font-size:11px;
    font-weight:700;
    border-radius:10px;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--muted);
    cursor:pointer;
  }
  #hoffens-app .rank-tab.active{
    background:var(--navy);
    color:#fff;
    border-color:var(--navy);
  }
  #hoffens-app .rank-list{
    background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--line);
    overflow:hidden;
  }
  #hoffens-app .rank-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 14px;
    border-bottom:1px solid var(--line);
  }
  #hoffens-app .rank-item:last-child{ border-bottom:none; }
  #hoffens-app .rank-num{
    width:22px;height:22px;
    border-radius:50%;
    background:var(--navy-tint);
    color:var(--navy);
    font-size:11px;
    font-weight:800;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  #hoffens-app .rank-info{ flex:1; }
  #hoffens-app .rank-mname{ font-size:13px; font-weight:700; }
  #hoffens-app .rank-nave{ font-size:10.5px; color:var(--muted); }
  #hoffens-app .rank-val{ font-size:15px; font-weight:800; }

  /* Empty state */
  #hoffens-app .empty{
    background:var(--card);
    border-radius:var(--radius);
    border:1px dashed var(--line);
    padding:28px 18px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
  }
  #hoffens-app .empty b{ display:block; color:var(--navy); font-size:15px; margin-bottom:6px; }
  #hoffens-app .btn-primary{
    background:var(--navy);
    color:#fff;
    border:none;
    padding:12px 18px;
    border-radius:12px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    margin-top:14px;
  }

  /* Footer note */
  #hoffens-app .footer-note{
    text-align:center;
    font-size:10.5px;
    color:var(--muted);
    padding:10px 24px 0;
  }

  /* ---- Edit form ---- */
  #hoffens-app .edit-panel{
    background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--line);
    padding:16px;
    margin-bottom:16px;
  }
  #hoffens-app .field-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:8px;
  }
  #hoffens-app .field{ margin-bottom:8px; }
  #hoffens-app .field label{
    display:block;
    font-size:10.5px;
    font-weight:700;
    color:var(--muted);
    text-transform:uppercase;
    margin-bottom:4px;
  }
  #hoffens-app .field input, #hoffens-app .field select{
    width:100%;
    border:1px solid var(--line);
    border-radius:9px;
    padding:9px 10px;
    font-size:13px;
    background:#fbfbfd;
    color:var(--ink);
    font-family:inherit;
  }
  #hoffens-app .field input:focus, #hoffens-app .field select:focus{
    outline:2px solid var(--navy);
    outline-offset:1px;
    background:#fff;
  }
  #hoffens-app .subblock-title{
    font-size:12.5px;
    font-weight:800;
    color:var(--navy);
    margin:14px 0 8px;
    padding-top:10px;
    border-top:1px solid var(--line);
  }
  #hoffens-app .machine-edit-row{
    display:grid;
    grid-template-columns:0.7fr 1fr 1fr 1fr;
    gap:6px;
    align-items:center;
    margin-bottom:6px;
  }
  #hoffens-app .machine-edit-row .mid{
    font-size:12px;
    font-weight:800;
    color:var(--navy);
    text-align:center;
  }
  #hoffens-app .machine-edit-row input{
    width:100%;
    border:1px solid var(--line);
    border-radius:7px;
    padding:6px 5px;
    font-size:11.5px;
    text-align:center;
  }
  #hoffens-app .mini-head{
    display:grid;
    grid-template-columns:0.7fr 1fr 1fr 1fr;
    gap:6px;
    font-size:9px;
    color:var(--muted);
    font-weight:700;
    text-transform:uppercase;
    margin-bottom:4px;
    text-align:center;
  }
  #hoffens-app .save-bar{
    position:sticky;
    bottom:0;
    background:linear-gradient(180deg,rgba(245,245,250,0),var(--bg) 30%);
    padding:14px 0 4px;
    display:flex;
    gap:10px;
  }
  #hoffens-app .save-bar button{
    flex:1;
    border:none;
    padding:13px;
    border-radius:12px;
    font-weight:800;
    font-size:13.5px;
    cursor:pointer;
  }
  #hoffens-app .btn-save{ background:var(--navy); color:#fff; }
  #hoffens-app .btn-cancel{ background:#fff; color:var(--navy); border:1px solid var(--line) !important; }
  #hoffens-app .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--navy-dark);
    color:#fff;
    padding:10px 18px;
    border-radius:24px;
    font-size:12.5px;
    font-weight:600;
    z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }
  #hoffens-app .loading-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    color:var(--navy);
    font-size:13px;
    font-weight:600;
  }
  html, body{
    margin:0;
    padding:0;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }

</style>
</head>

  const root = document.getElementById('hoffens-app');
  let state = { weekData: weekData, activeRankTab: 'eficiencia', expandedNave: null };

  function fmtInt(n){
    if (n === '' || n === null || n === undefined || isNaN(n)) return '—';
    return Math.round(n).toLocaleString('es-CL');
  }

  function fmtPct(n, decimals){
    if (n === '' || n === null || n === undefined || isNaN(n)) return '—';
    decimals = decimals === undefined ? 2 : decimals;
    return n.toFixed(decimals).replace('.', ',') + '%';
  }

  function num(v){
    const n = parseFloat(v);
    return isNaN(n) ? null : n;
  }

  function eficiencia(produccion, std){
    const p = num(produccion), s = num(std);
    if (p===null || s===null || s===0) return null;
    return (p/s)*100;
  }

  function scrapPct(scrap, produccion){
    const sc = num(scrap), p = num(produccion);
    if (sc===null || p===null || p===0) return null;
    return (sc/p)*100;
  }

  function statusClass(kind, value){
    if (value === null || value === undefined) return '';
    if (kind === 'eficiencia'){
      if (value >= 85) return 'status-ok';
      if (value >= 75) return 'status-warn';
      return 'status-bad';
    }
    if (kind === 'scrap'){
      if (value <= 8) return 'status-ok';
      if (value <= 12) return 'status-warn';
      return 'status-bad';
    }
    if (kind === 'sobrepeso'){
      if (value <= 0) return 'status-ok';
      if (value <= 1.5) return 'status-warn';
      return 'status-bad';
    }
    return '';
  }

  function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }

  function barColorFor(statusCls){
    if (statusCls === 'status-ok') return 'var(--ok)';
    if (statusCls === 'status-warn') return 'var(--warn)';
    if (statusCls === 'status-bad') return 'var(--bad)';
    return 'var(--navy)';
  }

  function kpiCard(label, value, sub, statusCls, barPct){
    const bar = (barPct===undefined || barPct===null) ? '' : `
      <div style="height:4px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden;">
        <div style="height:100%;width:${clamp(barPct,0,100)}%;background:${barColorFor(statusCls)};border-radius:3px;"></div>
      </div>`;
    return `
      <div class="kpi-card ${statusCls}">
        <div class="kpi-label">${label}</div>
        <div class="kpi-value">${statusCls?'<span class="status-dot"></span>':''}${value}</div>
        <div class="kpi-sub">${sub}</div>
        ${bar}
      </div>
    `;
  }

  function turnoCard(name, t, isFocus){
    const ef = eficiencia(t.produccion, t.std);
    const sc = scrapPct(t.scrap, t.produccion);
    const sob = num(t.sobrepeso);
    const efCls = statusClass('eficiencia', ef);
    const scCls = statusClass('scrap', sc);
    const sobCls = statusClass('sobrepeso', sob);
    const dot = (cls) => cls ? `<span class="status-dot ${cls}" style="display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:${cls==='status-ok'?'var(--ok)':cls==='status-warn'?'var(--warn)':'var(--bad)'};"></span>` : '';
    return `
      <div class="turno-card ${isFocus?'is-focus':''}">
        ${isFocus ? '<div class="focus-pill">Foco de hoy</div>' : ''}
        <div class="turno-name">${t.responsable || '—'}</div>
        <div class="turno-role">${name}</div>
        <div class="turno-metric-row"><span class="m-label">Eficiencia</span><span class="m-value">${dot(efCls)}${fmtPct(ef,1)}</span></div>
        <div class="turno-metric-row"><span class="m-label">Scrap</span><span class="m-value">${dot(scCls)}${fmtPct(sc,1)}</span></div>
        <div class="turno-metric-row"><span class="m-label">Sobrepeso</span><span class="m-value">${dot(sobCls)}${fmtPct(sob,2)}</span></div>
      </div>
    `;
  }

  function naveCard(naveKey, nave){
    const cfg = NAVE_CONFIG[naveKey];
    const ef = eficiencia(nave.produccion, nave.std);
    const sc = scrapPct(nave.scrap, nave.produccion);
    const sob = num(nave.sobrepeso);
    const efCls = statusClass('eficiencia', ef);
    const scCls = statusClass('scrap', sc);
    const sobCls = statusClass('sobrepeso', sob);
    const isExpanded = state.expandedNave === naveKey;
    const avatarInner = cfg.photo ? `<img src="data:image/png;base64,${cfg.photo}" alt="${cfg.label}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />` : (cfg.lider||'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
    return `

        <div class="nave-top">
          <div class="nave-avatar" style="overflow:hidden;padding:0;">${avatarInner}</div>
          <div>

            <div class="nave-lider">${cfg.lider}</div>
          </div>
        </div>
        <div class="nave-metrics">
          <div class="nave-metric ${efCls}"><div class="nm-label">Eficiencia</div><div class="nm-value">${fmtPct(ef,1)}</div></div>
          <div class="nave-metric ${scCls}"><div class="nm-label">Scrap</div><div class="nm-value">${fmtPct(sc,1)}</div></div>

  function renderMachineTable(nave){
    let rows = `<div class="machine-row head"><div>Máquina</div><div class="mv">Efic.</div><div class="mv">Scrap</div><div class="mv">Sobrep.</div></div>`;
    nave.machines.forEach(m=>{
      const ef = eficiencia(m.produccion, m.std);
      const sc = scrapPct(m.scrap, m.produccion);
      const sob = num(m.sobrepeso);
      rows += `<div class="machine-row">
        <div class="mname">E ${m.id}</div>
        <div class="mv">${fmtPct(ef,0)}</div>
        <div class="mv">${fmtPct(sc,1)}</div>
        <div class="mv">${fmtPct(sob,2)}</div>
      </div>`;
    });
    return `<div class="machine-table">${rows}</div>`;
  }

  function renderRankList(machines){
    let sorted, valueFmt, unit;
    if (state.activeRankTab === 'eficiencia'){
      sorted = machines.filter(m=>m.eficiencia!==null).sort((a,b)=>a.eficiencia-b.eficiencia).slice(0,5);
      valueFmt = m => fmtPct(m.eficiencia,1);
    } else if (state.activeRankTab === 'scrap'){
      sorted = machines.filter(m=>m.scrapPct!==null).sort((a,b)=>b.scrapPct-a.scrapPct).slice(0,5);
      valueFmt = m => fmtPct(m.scrapPct,1);
    } else {
      sorted = machines.filter(m=>m.sobrepeso!==null && m.sobrepeso>0).sort((a,b)=>b.sobrepeso-a.sobrepeso).slice(0,5);
      valueFmt = m => '+'+fmtPct(m.sobrepeso,2);
    }
    if (!sorted.length){
      return `<div class="empty">Sin datos suficientes para este ranking todavía.</div>`;
    }
    let items = sorted.map((m,i)=>`
      <div class="rank-item">
        <div class="rank-num">${i+1}</div>
        <div class="rank-info">
          <div class="rank-mname">Máquina ${m.id}</div>
          <div class="rank-nave">${m.naveLabel}</div>
        </div>
        <div class="rank-val">${valueFmt(m)}</div>
      </div>
    `).join('');
    return `<div class="rank-list">${items}</div>`;
  }

  function plantAgg(wd){
    const t1 = wd.turno1, t2 = wd.turno2, t3 = wd.turno3;
    const turnos = [t1,t2,t3];
    let sumProd = 0, sumScrap = 0, sumStd = 0, sumSobPondNum = 0;
    let efSum = 0, efCount = 0;
    turnos.forEach(t=>{
      const p = num(t.produccion) || 0;
      const sc = num(t.scrap) || 0;
      const st = num(t.std) || 0;
      const sob = num(t.sobrepeso);
      sumProd += p; sumScrap += sc; sumStd += st;
      if (sob !== null) { sumSobPondNum += sob * p; }
      const ef = eficiencia(t.produccion, t.std);
      if (ef !== null){ efSum += ef; efCount++; }
    });
    return {
      produccion: sumProd,
      scrap: sumScrap,
      std: sumStd,
      // Promedio simple de la eficiencia de los 3 turnos (mismo método que usa el PPT semanal)
      eficienciaPromedio: efCount>0 ? (efSum/efCount) : null,
      scrapPct: sumProd>0 ? (sumScrap/sumProd*100) : null,
      sobrepesoPonderado: sumProd>0 ? (sumSobPondNum/sumProd) : null,
    };
  }

  function allMachinesTurno3(wd){
    const out = [];
    ['nave1','nave2','nave3'].forEach(nk=>{
      const nave = wd.turno3[nk];
      if (!nave || !nave.machines) return;
      nave.machines.forEach(m=>{
        out.push({
          id: m.id,
          naveLabel: NAVE_CONFIG[nk].label,
          produccion: num(m.produccion),
          scrap: num(m.scrap),
          std: num(m.std),
          sobrepeso: num(m.sobrepeso),
          eficiencia: eficiencia(m.produccion, m.std),
          scrapPct: scrapPct(m.scrap, m.produccion),
        });
      });
    });
    return out;
  }

  function attachHandlers(){
    document.querySelectorAll('[data-expand]').forEach(el=>{
      el.onclick = () => {
        const key = el.getAttribute('data-expand');
        state.expandedNave = state.expandedNave === key ? null : key;
        render();
      };
    });
    document.querySelectorAll('[data-rank]').forEach(el=>{
      el.onclick = () => {
        state.activeRankTab = el.getAttribute('data-rank');
        render();
      };
    });
  }

  render();
})();
</script>
