e, cerca de las 04:00 hrs se logró estabilizar la producción con parámetros aceptados por Calidad.\n\nCausa raíz: sobre plastificación y exceso de flujo interior."}, {"fecha": "2026-05-11", "turno": "Turno 2", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se recibe tubería con defecto en su interior, jaspeado interno. Control de calidad retiene rack anterior, se realizan mejoras sin mayores resultados, se solicita bajar hembra para descartar material pegado y se encuentra ok. Posterior se parte aumentando cera y mejorando el aspecto de la tubería."}, {"fecha": "2026-05-11", "turno": "Turno 1", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se corta línea en una oportunidad por torque alto, se reestablece línea con perfiles bajos y se comienza a subir rendimiento gradualmente."}, {"fecha": "2026-05-11", "turno": "Turno 3", "maquina": "E 100", "nave": "Nave 2", "observacion": "La máquina se recibió en proceso de estabilización, presentando pérdida intermitente de línea azul. A las 00:00 hrs se solicitó asistencia a mantención para revisión de calefacción de coextrusora, descartándose falla eléctrica. Se realizaron modificaciones de temperatura en el cabezal, logrando corregir el problema.\nPosteriormente, a las 03:00 hrs la línea se detuvo por atascamiento en la sierra. La partida se retomó a las 04:00 hrs, quedando estable.\n\nCausa raíz:\n\nVariación en la lectura de la T° de coextrusora, bajo rendimiento por consumo de scrap 100%\nAtascamiento de tubería en sierra."}, {"fecha": "2026-05-11", "turno": "Turno 2", "maquina": "E 100", "nave": "Nave 2", "observacion": "Bajo rendimiento por consumo de scrap 100%"}, {"fecha": "2026-05-11", "turno": "Turno 1", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se detiene por limpieza de cabezal con raya, se mantiene estable a 240 kg/hr (69% eficiencia)"}, {"fecha": "2026-05-11", "turno": "Turno 3", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se descartó tubería por campana mal conformada. Durante uedamos a la espera de que llegue el material, se solicita en varias oportunidades y a las 19:05 hrs nos indican que no se realizará la prueba y que debemos dar partida con blanco norma (F7 y F11), al iniciar purga de AQ continúan rayas externas e internas visibles en el AQ y además muestras de material quemado en acople del restrictor, de igual manera las placas se ven muy rayadas, por este motivo se solicita desarme completo del cabezal y en acople, encontrando material quemado en acople  tornillos y restrictor, realizan limpieza y pulido de placas, matricería entrega a las 21:45 hrs, pendiente montaje y revisión de calefacción y luego del calentamiento el reapriete."}, {"fecha": "2026-05-11", "turno": "Turno 3", "maquina": "E 150", "nave": "Nave 1", "observacion": "La máquina se recibió detenida, iniciando operación a las 20:17 hrs y normalizando a las 20:26 hrs.\nPosteriormente se descartaron tubos por bajo espesor a las 21:10 hrs, corrigiéndose mediante ajustes de proceso.\nA las 22:00 hrs la línea se detuvo por falta de material debido a saturación del filtro del cargador; se realizó limpieza y se retomó operación a las 22:20 hrs, estabilizando a las 22:37 hrs.\nMás tarde, a las 01:40 hrs se descartaron tubos por tonalidad oscura y rayas superficiales. La máquina trabajó con 100% scrap y rendimiento reducido al 70%.\n\nCausa raíz:\n\nSaturación de filtro del sistema de carga.\nInestabilidad de proceso asociada al uso de material scrap."}, {"fecha": "2026-05-11", "turno": "Turno 2", "maquina": "E 150", "nave": "Nave 1", "observacion": "Al inicio de turno tolva queda sin material. Se da inicio  a producción nuevamente a las 10 .00 dejando estable 10.20 a las 10.30 se detiene ya que tiene raya interna en lado B se llama a matricería para limpiar herramental  entregando 10.45 se da inicio nuevamente y se deja estable a las 11.10Bajo Rendimiento consumo 100% scrap. Maquina queda sin material en 2 ocasiones por falla en carga de material."}, {"fecha": "2026-05-11", ina": "E 120", "std": 0, "prod": 0, "scrap": 0, "sobrepeso": 0, "causas": {"PR": 0, "MP": 0, "MT": 0, "MN": 0, "C": 0, "PROY": 0, "P": 0}}, {"maquina": "E 130", "std": 5400, "prod": 5098.035, "scrap": 480, "sobrepeso": 0.07835666094877732, "causas": {"PR": 0, "MP": 0, "MT": 30, "MN": 0, "C": 0, "PROY": 0, "P": 0}}, {"maquina": "E 140", "std": 2160, "prod": 1600, "scrap": 242, "sobrepeso": -0.06, "causas": {"PR": 0, "MP": 0, "MT": 10, "MN": 60, "C": 0, "PROY": 0, "P": 0}}], "std": 13086.0, "prod": 13370.3023, "scrap": 2684, "sobrepeso": 0.03167300862000704, "eficiencia": 1.021725683937032}}}}, "bitacora": [{"fecha": "2026-05-12", "turno": "Turno 3", "maquina": "E 30", "nave": "Nave 1", "observacion": "La línea se recibió detenida debido a retención de material en el herramental del cabezal. Matricería intervino y entregó el equipo a las 22:40 hrs, realizando posteriormente conexión de calefactores y configuración de temperaturas de trabajo.\nA las 23:40 hrs se inició partida, detectándose antes de producción una obstrucción de PVC en el sistema de vacío y falla en el dosificador, condiciones que fueron corregidas. La línea partió a las 00:10 hrs, pero se detuvo a las 01:00 hrs con AQ por falla en la mesa de traspaso de la zona de abocardado.\nMantención entregó el equipo a las 01:35 hrs y se trabajó en recuperación de tubería antes de reiniciar. A las 02:30 hrs se retomó operación, deteniéndose nuevamente a las 03:00 hrs por atasco en sierra N°2. Finalmente, la línea retomó operación a las 03:47 hrs y se normalizó a las 04:00 hrs.\n\nCausa raíz:\n\nRetención de material en herramental del cabezal.\nObstrucción de PVC en sistema de vacío.\nFalla en dosificador.\nFalla mecánica en mesa de traspaso y atasco en sierra N°2."}, {"fecha": "2026-05-12", "turno": "Turno 2", "maquina": "E 30", "nave": "Nave 1", "observacion": "Ajuste en abocardadora por perdida de ciclo"}, {"fecha": "2026-05-12", "turno": "Turno 1", "maquina": "E 30", "nave": "Nave 1", "observacion": "Se realiza cambio dimensional"}, {"fecha": "2026-05-12", "turno": "Turno 2", "maquina": "E 40", "nave": "Nave 1", "observacion": "Se baja rendimiento a las 08:25, se llama a mantención para revisar alarma por baja temperatura en horno, se verifica que plato en difusor de calor dentro del horno esta faltando el cual hace que pierda temperatura el mismo. Se llama a matricería asistiendo e intervienen colocando el plato. Maquina queda con rendimiento normal a la hora."}, {"fecha": "2026-05-12", "turno": "Turno 2", "maquina": "E 40", "nave": "Nave 1", "observacion": "Se detiene para cambio dimensional  a las 13:00 hrs se llama a mantenimiento y matricería para realizar cambio, entregando a las 14:50 hrs, queda pendiente conformación de campana."}, {"fecha": "2026-05-12", "turno": "Turno 1", "maquina": "E 40", "nave": "Nave 1", "observacion": "Se recibe detenida por cambio de producto, se solicita tubería para realizar pruebas y ajustes en abocardadora, luego a las 16:45 hrs se termina de ajustar abocardadora, se pone en temperatura de trabajo y a las 16:50 hrs, a las 17:00 hrs se solicita a matricería cambiar calibrador por no corresponder, luego se realiza partida a las 17:30 hrs logrando estabilizar línea, luego se debe realizar ajustes hasta las 19:20 hrs., mantención interviene y no logra mejorar ajustes"}, {"fecha": "2026-05-12", "turno": "Turno 3", "maquina": "E 51", "nave": "Nave 2", "observacion": "Se recibe detenida y apagada por problemas en la abocardadora. Mantenimiento interviene y entrega el equipo a las 22:30 hrs. Posteriormente se configuran temperaturas y se reinicia operación a las 23:30 hrs.\n\nDurante el proceso de estabilización se presenta falla en la sierra, por lo que mantenimiento realiza ajustes, dejando el equipo operativo y estable a las 00:30 hrs.\n\nMás tarde se descarta tubería por campana mal conformada, detectándose desplazamiento de la brida hacia atrás, condición que generaba nicho sobredimensionado. Se solicita apoyo de matricería a las 02:00 hrs y la máquina se detiene a las 03:00 hrs para intervención. Luego de varios intentos de ajuste y cambio de brida sin resultados definitivos, se instala una abrazadera para inmovilizar la brida, logrando estabilizar la condición. Matricería entrega el equipo a las 04:20 hrs.\n\nSe realiza recuperación de tubería y la línea reinicia operación a las 05:30 hrs, quedando estable a las 06:00 hrs.\n\nCausa raíz identificada:\n\nFalla inicial en abocardadora.\nDesplazamiento de brida en sistema de campana, generando nicho grande y mala conformación."}, {"fecha": "2026-05-12", "turno": "Turno 2", "maquina": "E 51", "nave": "Nave 2", "observacion": "Problemas en sierra lado A se llama a mantenimiento ya que al realizar corte se queda trancado y no realiza corte completo como si se quedara atascado, se detiene a las 10:15  a 10:30 interviene mantención en sierra lado A. Se reanuda producción a las 10:55, Mantención interviene a las 11:30 a 12:00 por problemas en la mesa de traslado, interviniendo en el proceso.  Se descartan tubos por campanas mal conformadas y fallo en corte lado A."}, {"fecha": "2026-05-12", "turno": "Turno 1", "maquina": "E 51", "nave": "Nave 2", "observacion": "Raya en 2 oportunidades."}, {"fecha": "2026-05-12", "turno": "Turno 2", "maquina": "E 60", "nave": "Nave 2", "observacion": "A las 11:40 hrs se detiene maquina por raya de impureza, Matricería entrega maquina desde las 11:50 hasta las 12:30 se pone calefactor y se empieza a calentar para iniciar partida, Se inicia partida a las  a las 12:50 igualmente material sale amarillento  se decide detener y se lleva una muestra a laboratorio  saliendo torque  alto y degradado a la vez ya matricería ya interviene nuevamente para desarme de cabezal , Se purga y sale material quemado y con partículas de metal, matricería procede a desarmar hasta el cuello, se informa a mtto para revisión de tornillos."}, {"fecha": "2026-05-12", "turno": "Turno 1", "maquina": "E 60", "nave": "Nave 2", "observacion": "Se recibe detenida por mantención en revisión de tornillos, luego pulen tornillos con desprendimiento, posteriormente montan a cámara y entregan a las 18:30 hrs, luego se pone en calentamiento y a las 20:30 hrs se da partida con AQ, posteriormente al momento de partir con material de aspecto chicloso, se decide detener con AQ a las 21:40 hrs. Pendiente revisión de cabezal por posible retención. Se informa al turno entrante"}, {"fecha": "2026-05-12", "turno": "Turno 3", "maquina": "E 70", "nave": "Nave 3", "observacion": "La M70 se recibe operativa y trabaja normalmente hasta las 04:38 hrs, momento en que se produce falla en la sierra. Se detecta que las correas del planetario se encontraban fuera de posición, por lo que se solicita intervención de mantenimiento.\n\nLuego de la reparación correspondiente, la máquina se normaliza a las 05:20 hrs y continúa operativa.\n\nCausa raíz identificada:\n\nDesalineamiento de correas del planetario de la sierra."}, {"fecha": "2026-05-12", "turno": "Turno 2", "maquina": "E 70", "nave": "Nave 3", "observacion": "Sn novedad"}, {"fecha": "2026-05-12", "turno": "Turno 2", "maquina": "E 80", "nave": "Nave 3", "observacion": "Se detiene maquina para hacer cambio programado"}, {"fecha": "2026-05-12", "turno": "Turno 2", "maquina": "E 80", "nave": "Nave 3", "observacion": "Matricería realiza cambio de postizo, se espera tiempo de calentamiento y se da partida, ajustes de espesores y conformación de campana."}, {"fecha": "2026-05-12", "turno": "Turno 3", "maquina": "E 90", "nave": "Nave 1", "observacion": "La M90 se recibe en producción presentando vacío fuera de parámetros (-0,2 bar). Se interviene destapando la cámara inferior del sistema de vacío, logrando recuperar condición operativa y estabilizando el vacío en -0,8 bar.\n\nCausa raíz identificada:\n\nObstrucción en cámara inferior del sistema de vacío."}, {"fecha": "2026-05-12", "turno": "Turno 2", "maquina": "E 90", "nave": "Nave 1", "observacion": "Mntto cambia manguera de vacío, ya que personal de mtto esta trabajando en tablero de maquina 150, se retoma nuevamente, descarte de tuberias por campanas mal conformadas, se realiza ajuste en tiempos de conformacion de campana."}, {"fecha": "2026-05-12", "turno": "Turno 1", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se mantiene estable a 91%"}, {"fecha": "2026-05-12", "turno": "Turno 3", "maquina": "E 100", "nave": "Nave 2", "observacion": "Durante la entrega de turno se detecta variación de espesores de hasta 8 mm asociada al trabajo con material scrap. Se realizan ajustes operacionales, logrando estabilizar la condición y mantener tubería dentro de parámetros aceptables.\n\nPosteriormente, a las 03:00 hrs, la línea se corta por atasco en la sierra. Se solicita intervención de mantenimiento a las 03:10 hrs, entregando el equipo a las 03:20 hrs. La máquina reinicia operación a las 03:35 hrs.\n\nCausa raíz identificada:\n\nVariación de proceso asociada al uso de scrap. Bajo rendimiento por la misma causa.\nAtascos de tubería en la sierra (Operacional)"}, {"fecha": "2026-05-12", "turno": "Turno 2", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se trabaja con 100% scrap, 64%"}, {"fecha": "2026-05-12", "turno": "Turno 1", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se mantiene estable a 240 kg/hr con 100% scrap."}, {"fecha": "2026-05-12", "turno": "Turno 2", "maquina": "E 110", "nave": "Nave 2", "observacion": "se descartan tubos por campanas mal conformadas."}, {"fecha": "2026-05-12", "turno": "Turno 1", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se trabaja al 92% por estabilidad de abocardadora  y se descarta una hora por falla de impacto."}, {"fecha": "2026-05-12", "turno": "Turno 3", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-12", "turno": "Turno 2", "maquina": "E 120", "nave": "Nave 3", "observacion": "Sin planificación."}, {"fecha": "2026-05-12", "turno": "Turno 1", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-12", "turno": "Turno 3", "maquina": "E 130", "nave": "Nave 3", "observacion": "La M130 se recibe operativa, aunque trabajando con sobrepeso. A las 02:53 hrs se realiza detención programada para cambio de postizo, reemplazando postizo saliente 107.9 por postizo entrante 108.4.\n\nTras el ajuste, los espesores quedan dentro de parámetros y el sobrepeso disminuye desde 15% a 0,04%, normalizando la condición operacional.\n\nCausa raíz identificada:\n\nDesajuste dimensional asociado al postizo instalado."}, {"fecha": "2026-05-12", "turno": "Turno 2", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se recibe con compuesto, se realiza cambio a pulverizado bco pigmentado, se inicia con 70% virgen y 30% pul, se va incrementando cantidad de pul, se corta linea por flujo intermitente, se filtra por la hembra, se llama a matricería para desarme y limpieza, Matricería entrega maquina  a las 12:23, al iniciar partida quedan rastros de pigmento pegado, Se trabaja 80/20 pero se adhiere material generando rayas internas, se detiene para desarme. Además maquina vuelve a filtrar sin levantar demasiada presión, se realizó reapreté de hembra, se solicita a matricería limpieza de herramental."}, {"fecha": "2026-05-12", "turno": "Turno 1", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se recibe detenida por matricería, quien desarma herramenta, realiza limpieza y pulido, luego entrega a las 17:20 hrs, mantención conecta y revisa calefacción y entrega en proceso de calentamiento a las 17:45 hrs, paralelamente otro equipo de mantención trabaja en cambio de ciindros hidráulicos en abocardadora (entregan a las 19.00 hrs). Posteriormente a las 19:40 hrs se solicita reapriete de cabezal, luego se inicia partida con AQ a las 20:00 hrs y al dar partida con material se produce filtración en hembra, se observa doble  golilla en anillo las cuales podrían ser el origen de la filtración, se solicita a matricería realizar desarme y limpieza, luego entregan a las 21:30 hrs, luego mantención conecta y revisa calefacción, encontrando calefactor de la zona ADZ en corte, queda pendiente cambio de calefactor."}, {"fecha": "2026-05-12", "turno": "Turno 3", "maquina": "E 140", "nave": "Nave 3", "observacion": "La M140 se recibe detenida. Se solicita inicialmente a mantenimiento la conexión de calefactores a las 22:30 hrs. Posteriormente, a las 23:50 hrs, matricería realiza reapriete de cabezal.\n\nDurante la purga con AQ se detectan temperaturas desbalanceadas, con zonas excesivamente altas y otras bajas, por lo que se solicita nuevamente intervención de mantenimiento a las 00:10 hrs para revisión del sistema térmico. La máquina queda temporalmente en temperatura de purga mientras se realizan ajustes.\n\nMantenimiento entrega el equipo a las 01:50 hrs. Posteriormente se inicia partida a las 02:45 hrs, logrando normalización operacional a las 03:19 hrs.\n\nCausa raíz identificada:\n\nFalla en sistema de calefacción del cabezal."}, {"fecha": "2026-05-12", "turno": "Turno 2", "maquina": "E 140", "nave": "Nave 3", "observacion": "Calidad solicita mejora por brillo y acabado de parte externa de canaleta, posterior sin novedad."}, {"fecha": "2026-05-12", "turno": "Turno 1", "maquina": "E 140", "nave": "Nave 3", "observacion": "Canaleta autorizada por calidad por aspecto poroso en F7"}, {"fecha": "2026-05-12", "turno": "Turno 3", "maquina": "E 150", "nave": "Nave 1", "observacion": "La M150 se recibe detenida mientras mantenimiento interviene el gabinete del extrusor debido a falla en el VDF (variador de frecuencia).\n\nCausa raíz identificada:\n\nFalla eléctrica en VDF del extrusor."}, {"fecha": "2026-05-12", "turno": "Turno 2", "maquina": "E 150", "nave": "Nave 1", "observacion": "Detenida por falla en VDF, queda pendiente entrega de mtto"}, {"fecha": "2026-05-12", "turno": "Turno 1", "maquina": "E 150", "nave": "Nave 1", "observacion": "Pendiente entrega de mantención del VDF del extrusor principal."}, {"fecha": antención quien revisa complamente encontrando contactor quemado, cambia base de rele (15:20 a 18:40 hrs), posteriormente se da partida y se produce filtración, matricería interviene desarmando primera olla y estrella (21:00 a 21:27 hrs). Pendiente conexión de calefacción."}, {"fecha": "2026-05-13", "turno": "Turno 3", "maquina": "E 40", "nave": "Nave 1", "observacion": "Se recibe detenida por problemas en la sierra, específicamente corte disparejo y demora en el retorno del brazo de corte. Se realizan ajustes iniciales y alineamiento con láser por parte de mantención con máquina detenida y pruebas posteriores con línea operativa, sin lograr estabilizar el bisel.\n\nA las 00:44 se produce atasco de tubería durante pruebas, obligando a una nueva partida. Posteriormente se ajustan mordazas, palpador y presión del brazo de sierra, pero la condición persiste. La línea se detiene nuevamente a las 01:27, quedando en temperatura de purga para continuar pruebas sin generar scrap adicional.\n\nA las 03:40 interviene mantenimiento, entregando la sierra a las 04:55. Se realizan nuevas pruebas luego de purga a las 05:16, sin embargo el bisel continúa saliendo disparejo. Se vuelve a solicitar asistencia a mantenimiento y la máquina queda en temperatura de purga para revisión del turno entrante.\n\nCausa raíz identificada:\n\nFalla mecánica y desajuste en sistema de sierra y brazo de corte."}, {"fecha": "2026-05-13", "turno": "Turno 2", "maquina": "E 40", "nave": "Nave 1", "observacion": "Se recibe detenida por falla en sierra, específicamente en conformación de campana, se hacen pruebas de corte con maquina detenida ok , al probar con equipo en funcionamiento la sierra se atasca, se hace detención para que mtto revise planetario, mtto nuevamente revisa equipo, realiza trabajos en palpador de sierra, entregando a las 13:00 hrs se espera calentamiento y se da partida, quedando"}, {"fecha": "2026-05-13", "turno": "Turno 1", "maquina": "E 40", "nave": "Nave 1", "observacion": "se re e posicionados de mesa se mueven muy lentos, mtto realiza ajustes neumáticos en mesa abocardadora, posteriormente se sube rendimiento nuevamente."}, {"fecha": "2026-05-13", "turno": "Turno 3", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se detiene a las 03:30 hrs debido a que el producto comienza a salir húmedo desde el cabezal. Durante la revisión se detecta disminución de temperatura en el silo causada por lectura errónea de termocupla.\n\nLuego de corregir la condición y recuperar temperatura de secado, la línea reinicia operación a las 05:00 hrs.\n\nCausa raíz identificada:\n\nMala lectura de termocupla del silo, provocando baja temperatura y humedad en material."}, {"fecha": "2026-05-13", "turno": "Turno 2", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se detiene  a las 09:00 para cambio de malla, se trabaja al 68% con 100% scrap."}, {"fecha": "2026-05-13", "turno": "Turno 1", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se detiene a las 17 hrs por estiramiento de línea, luego en proceso de partida y ajuste, se descartan 2 tiras."}, {"fecha": "2026-05-13", "turno": "Turno 3", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se descarta tubería por defectos en campana durante el turno.\n\nCausa raíz identificada:\n\nMala conformación en proceso de abocardado."}, {"fecha": "2026-05-13", "turno": "Turno 2", "maquina": "E 110", "nave": "Nave 2", "observacion": "Corte de línea en 1 ocasión por tubería atascada en sierra, se retoma nuevamente, descarte de campanas con rechupe, se corrige."}, {"fecha": "2026-05-13", "turno": "Turno 3", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-13", "turno": "Turno 2", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-13", "turno": "Turno 1", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-13", "turno": "Turno 3", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se recibe detenida. Matricería trabaja en la línea hasta las 00:10 hrs, posteriormente mantenimiento realiza conexión de calefactores y entrega el equipo a las 00:50 hrs mientras se configuran temperaturas de trabajo.\n\nLa línea parte a las 01:50 hrs y normaliza a las 02:20 hrs. Más tarde, a las 04:00 hrs, se realizan pruebas con pulverizado blanco pigmentado al 0,8% de premix, sin resultados satisfactorios, por lo que la línea se detiene a las 04:30 hrs.\n\nSe solicita nuevamente a matricería para cambio de postizo y configuración para tubería de presión. La máquina reinicia operación a las 05:40 hrs trabajando con producto hidráulico.\n\nCausa raíz identificada:\n\nResultados fuera de estándar en pruebas de pigmentación/premix."}, {"fecha": "2026-05-13", "turno": "Turno 3", "maquina": "E 130", "nave": "Nave 3", "observacion": "Cambio de producto por falta de material."}, {"fecha": "2026-05-13", "turno": "Turno 2", "maquina": "E 130", "nave": "Nave 3", "observacion": "Al de turno calidad separa producción por campanas mal conformadas, campanas contraídas, se revisa sistema de refrigeración, se corrige, se sube rendimiento, corte de línea en 1 ocasión se retoma nuevamente."}, {"fecha": "2026-05-13", "turno": "Turno 1", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se detiene por cambio de producto, matricería entrega cambio de postizo a las 18:00 hrs, luego mantención conecta y revisa calefacción (18:00 a 18:35 hrs), además matricería realiza cambio en abocardadora y gomas de las tinas entregando a las 19:15 hrs, luego se monta guía mientras está en calentamiento, se realizan pruebas de abocardado. A las 21:45 hrs se realiza cambio de AQ."}, {"fecha": "2026-05-13", "turno": "Turno 2", "maquina": "E 140", "nave": "Nave 3", "observacion": "Prueba de Material de Inyección, se hace detención a las 9:45 para limpieza de calibrador limpieza de filtros, vacío y limpieza de tolvas para hacer prueba de material, color café de inyección, matricería realiza limpieza de boquilla y placas de calibrador, queda pendiente entrega de maquina por parte de matricería."}, {"fecha": "2026-05-13", "turno": "Turno 1", "maquina": "E 140", "nave": "Nave 3", "observacion": "Se recibe detenida en proceso de armado de placas y conexión de calefacción, posteriormente se llama mantención por zona FL3 bajo el SP, al revisar encuentran que termocupla no está posicionada en la perforación, desarman y además deben cambiar calefactor ya que se encuentra con cables cortados, mantención no encuentra repuesto y debe reparar el calefactor, luego montan, calentamos y damos partida con material blanco normal, saliendo rodón fuera de especificación y con raya de quemado, se solicita desarme de placas y cambio de rodón, sin poder realizar cambio por falta de repuesto, además se encuentra boquilla quemada. Se deja muestra de canaleta lograda con línea de quemado."}, {"fecha": "2026-05-13", "turno": "Turno 2", "maquina": "E 150", "nave": "Nave 1", "observacion": "A las 14:00 horas se da inicio a pruebas en la máquina 150 junto a extrusora, con el objetivo de realizar ajustes en las RPM y modificar parámetros de operación para evaluar el comportamiento de la máquina durante el proceso, Durante las pruebas se detecta que los parámetros del sistema gravimétrico no coinciden con los valores establecidos en la ficha técnica del producto. Además, se observa que los kilos por hora indicados en pantalla no reflejan el rendimiento real de trabajo de la máquina, evidenciando diferencias entre los valores mostrados y la producción efectiva, Se continuará monitoreando y ajustando parámetros para lograr una operación más estable y acorde a las condiciones requeridas de producción, cabe señalar que actualmente se está trabajando solamente con parámetros de referencia y no bajo las condiciones habituales de operación de la máquina, debido a las variaciones detectadas durante el proceso."}, {"fecha": "2026-05-13", "turno": "Turno 1", "maquina": "E 150", "nave": "Nave 1", tura de trabajo. Se realiza reapriete y se inicia partida a las 11:40 a las 12:10 se visualiza material quemado en manga del lado 1. Se procede a detener maquina y llamar a matricería. Asistiendo para su intervención desmontando las 2 hembras y limpiando hasta la estrella se pulga maquina quedando ok entregan a la13:00 mantención conecta calefactores a las 13:20 maquina se coloca temperatura de trabajo y se inicia partida a las 13:55 quedando maquina estable a las 14:15."}, {"fecha": "2026-05-14", "turno": "Turno 1", "maquina": "E 30", "nave": "Nave 1", "observacion": "Descarte de tubería por raya de impureza"}, {"fecha": "2026-05-14", "turno": "Turno 3", "maquina": "E 40", "nave": "Nave 1", "observacion": "Se recibe detenida en temperatura de purga. Durante las pruebas iniciales el bisel continúa saliendo disparejo, por lo que se solicita intervención de mantenimiento, quienes realizan ajustes y entregan el equipo a las 23:30 has.\n\nPosteriormente se configuran temperaturas de trabajo a las 00:07 has, se purga la máquina a las 00:50 has y se realiza partida a las 01:20 has, logrando normalizar manga a las 01:40 has.\n\nMás tarde se descartan tubos debido a campanas mal conformadas a las 04:20 has, realizando ajustes de proceso y normalizando nuevamente a las 04:40 has.\n\nCausa raíz identificada:\n\nDesajuste en sistema de corte/biselado y desviaciones en abocardado."}, {"fecha": "2026-05-14", "turno": "Turno 2", "maquina": "E 40", "nave": "Nave 1", "observacion": "Se recibe detenida turno anterior, se realiza ajustes en bisel, asimismo en conformación de campana, se da partida a las 9:30 has, posterior a ello aparece flujo en manga, se adiciona cera, estabilizando maquina, a las 10:30 has."}, {"fecha": "2026-05-14", "turno": "Turno 1", "maquina": "E 40", "nave": "Nave 1", "observacion": "Descarte de tubería por campanas ajustadas."}, {"fecha": "2026-05-14", "turno": "Turno 3", "maquina": "E 51", "nave": "Nave 2", "observacion": "Se descarta tubería por campana ma : "Se informa a mantenimiento sobre desprendimiento de una pieza de la sierra para revisión preventiva, quedando la condición notificada."}, {"fecha": "2026-05-14", "turno": "Turno 1", "maquina": "E 80", "nave": "Nave 3", "observacion": "Presenta problemas de corte, se llama a mantención por encontrar planetario trancado, se hace limpieza de polines de sujeción de planetario y pistas con material aglomerado y plastificado (20:10 a 20:35 hrs) queda trabajando con normalidad, luego descarte de tubería en cambio de buffer tank a saca, sin novedad y sin cera."}, {"fecha": "2026-05-14", "turno": "Turno 3", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se recibe operativa. Durante el turno se detecta saturación de material debido a desgasificador tapado, por lo que se decide detener la línea a las 01:20 has.\n\nLuego de liberar el material acumulado y normalizar flujo del sistema, la máquina reinicia operación y logra estabilizarse a las 01:45 has.\n\nCausa raíz identificada:\n\nObstrucción del desgasificador."}, {"fecha": "2026-05-14", "turno": "Turno 2", "maquina": "E 90", "nave": "Nave 1", "observacion": "Prueba de Material, Planta de compuesto solicita prueba de formulación, se mantiene estable durante turno, se le adiciona cera para mejorar aspecto interno en tuberías."}, {"fecha": "2026-05-14", "turno": "Turno 1", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se recibe con saca de prueba, se ajustan perfiles, se trabaja sin cera, presenta rugosidad interna, la cual es aceptada por calidad como máximo aceptado. Se realizan pruebas en laboratorio y todas cumplen."}, {"fecha": "2026-05-14", "turno": "Turno 3", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se detiene a las 02:20 has para realizar cambio de producto. Durante la detención se ejecutan tareas preventivas y de acondicionamiento operacional, incluyendo limpieza de aspersores de batea 1 y corona, limpieza de filtros, ajuste de oruga, sierra, gravimétrico e impresión.\n\nAdicionalmente, se deja la extrusora completamente limpia para facilitar la partida del turno siguiente.\n\nCausa raíz identificada:\n\nCambio programado de producto."}, {"fecha": "2026-05-14", "turno": "Turno 2", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se hace validación de herramental  para que matricería intervenga en el cambio de 110 x 50 metros interviene Matricería para cambio a la vez se llama a mantención para que desconecte calefactor  y pueda trabajar matricería interviene a la hora .entregando a las 09:10 mantención se pone temperatura de trabajo aproximadamente dos horas mientras se instala guía completo, Se inicia partida a las 11:50.  Y las 12:20  pierde vacío se observa cabezal saliendo raya desde cabezal se  hace limpieza con una virutilla roja de matricería y se inicia partida nuevamente  a las 12:50  quedando normalizada a las 13:40 100% scrap, pendiente subir rendimiento."}, {"fecha": "2026-05-14", "turno": "Turno 1", "maquina": "E 100", "nave": "Nave 2", "observacion": "A las 15:53 hrs se detiene sola por sobre calentamiento del VDF del extrusor principal., se comienza a pasar guía, una vez terminada, se da nueva partida (15:53 a 17:00 hrs), Se trabaja a menor rendimiento por scrap 100%"}, {"fecha": "2026-05-14", "turno": "Turno 3", "maquina": "E 110", "nave": "Nave 2", "observacion": "Corte de línea en 1 ocasión, de retoma nuevamente."}, {"fecha": "2026-05-14", "turno": "Turno 2", "maquina": "E 110", "nave": "Nave 2", "observacion": "Descarte de tuberías por vibrado."}, {"fecha": "2026-05-14", "turno": "Turno 1", "maquina": "E 110", "nave": "Nave 2", "observacion": "se detiene extrusora completa , se llama a mantencion para revisión, se le pasa antiquemante a maquina y queda detenida a espera de solucion"}, {"fecha": "2026-05-14", "turno": "Turno 1", "maquina": "E 110", "nave": "Nave 2", "observacion": "alcanza temperaturas de trabajo, se purga con antiquemante para reanudar producción, durante reanudación falla zona 2 de extrusora , temperaturas bajan 20 grados provocando detención de máquina , se pasa antiquemante y llama a mantencion, mantención encuentra calefactor cortado internamente en zona bz2 de extrusora , realiza cambio de calefactor y entrega máquina , se pone maquina a calentar para reanudar producción"}, {"fecha": "2026-05-14", "turno": "Turno 3", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-14", "turno": "Turno 2", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-14", "turno": "Turno 1", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-14", "turno": "Turno 3", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se recibe detenida. La línea parte a las 23:44 hrs, pero a las 00:00 hrs se baja rendimiento debido a problemas en el abocardado.\n\nA las 00:37 hrs se solicita asistencia de mantenimiento, detectándose necesidad de reemplazo del sensor detector de tubo del abocardado. Debido a la magnitud de la intervención se decide detener la máquina. Mantenimiento entrega el equipo a las 01:10 hrs.\n\nSe aprovecha la detención para recuperación de tubería antes de reiniciar operación. La máquina parte nuevamente a las 02:30 hrs y normaliza a las 02:50 hrs.\n\nCausa raíz identificada:\n\nFalla en sensor detector de tubo del abocardado."}, {"fecha": "2026-05-14", "turno": "Turno 1", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se recibe sistema de vacío desconectado de almacenamiento nuevo y conectado por defecto al de la máquina, se hace mención a que se recibe con exceso de agua saliendo por desagüe de pasillo"}, {"fecha": "2026-05-14", "turno": "Turno 3", "maquina": "E 140", "nave": "Nave 3", "observacion": "inicia partida a las 23:15 hrs; sin embargo, no logra estabilizar espesores debido a problemas asociados al rodón. Finalmente se decide detener la línea con AQ y dejar muestra en oficina de jefatura para análisis, ya que matricería no contaba con  reflejan en pantalla, permaneciendo en “0”, y el sincronismo de extrusora no responde correctamente al bajar rendimiento, provocando comportamiento descoordinado de la extrusora.\n\nCausa raíz identificada:\n\nSaturación/restricción en sistema de alimentación de material.\nFalla de lectura o sincronización de RPM de extrusora."}, {"fecha": "2026-05-14", "turno": "Turno 2", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se recibe maquina con Virgen , se realiza cambio a 100% scrap, posterior a ello se detiene se queda sin Material debido a problemas con la succión qué alimenta la tolva. Scrap da problemas en la entrada de la Manguera, se limpian filtros de alimentación de tolva, anterior a esto se hizo cambio de material de virgen a scrap. Se inicia partida a las 13:10, nuevamente falla alimentación en 3 oportunidades de limpian filtros sin poder estabilizar carga maquina tiende a quedarse sin material, se detiene a las 14:00 se informa a mantención para ver problema."}, {"fecha": "2026-05-14", "turno": "Turno 1", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se recibe maquina detenida, el turno anterior informa que tuvieron problemas de succión del secador a la tolva superior. Se da inicio a la producción a las 15:30pm normalizando a a las 15:50pm, dejando la eficiencia en un 83% a 120 t/h, el problema de succión persiste, dejando la tolva superior al nivel mínimo, por eso la baja eficiencia, se mantiene en observación en caso de que la tolva quede sin material. Se detiene maquina por falta de material en la tolva superior a las 17:00pm. Al revisar batifiltro de la tolva superior, se nota que el vástago qué sujeta el filtro está roto y el filtro está todo sucio y tapado, se llama a mantención para que intervenga y se da limpieza al batifiltro. Filtro de succión para el secador se encuentra con el depósito lleno de polvillo. Pistón interno que realiza ciclo de limpieza en sistema de batifiltro se encuentra roto nuevamente a pesar de reparación que ya se había realizado por parte de mantenimiento, al observar y verificar correcto funcionamiento del mismo fuera del tambor se detecta que no logra hacer su función, por ende no se limpia continuamente el filtro por los ciclos de limpieza automáticos ocasionando saturación de filtros por exceso de polución."}, {"fecha": "2026-05-14", "turno": "Turno 3", "maquina": "E 160", "nave": "Nave 1", "observacion": "Se recibe operativa. Durante el turno se descarta tubería debido a atascamientos recurrentes en el sistema de abocardado.\n\nCausa raíz identificada:\n\nAtascamiento de tubería en abocardado."}, {"fecha": "2026-05-14", "turno": "Turno 2", "maquina": "E 160", "nave": "Nave 1", "observacion": "Se descartan tubos por atascamiento en mesa de traslado, en oportunidades sensor de línea 1 y 3 pierden lectura, haciendo que los mismos pasen de largo y queden atascados en la mesa."}, {"fecha": "2026-05-14", "turno": "Turno 1", "maquina": "E 160", "nave": "Nave 1", "observacion": "sierra lado 3 presenta problemas en el retroceso. Se revisa y se encuentra filtración en el sistema de lubricación. Se da aviso a mantencion. Se retira impureza en el lado 4, se mantiene estable a 370 kg/hr (81%)"}, {"fecha": "2026-05-14", "turno": "Turno 1", "maquina": "E 180", "nave": "Nave 1", "observacion": "se corta la línea por exceso de flujo, se reinicia y se descartan tubos por ajustes quedando ok"}], "demo": false, "real": true}, {"id": "2026-05-15_2026-05-15", "desde": "2026-05-15", "hasta": "2026-05-15", "importedAt": "2026-05-15T00:00:00.000Z", "turnos": {"Turno 1": {"jefePlanta": "Ivan Jerez", "kilos": 26155.308960000002, "sobrepeso": 0.010225344323365247, "scrap": 2712, "std": 32615.841267, "eficiencia": 0.8019204148648889, "causas": {"PR": 109, "MP": 479, "MT": 0, "MN": 456, "C": 0, "PROY": 0, "P": 0}, "naves": {"Nave 1": {"encargado": "Por definir", "maquinas": [{"maquina": "E 30", "std": 1750, "prod": 1568.3612, "scrap": 17, "sobrepeso": -0.024873861964960647, "causas": {"PR": 44, " por flujo en la manga (consumiendo Hidráulico). Durante el turno se produce un corte de línea por atascamiento de tubería en la sierra. Se realizan ajustes operacionales y la línea logra normalizarse posteriormente.\nCausa raíz: Atasco de tubería en sierra, Materia prima irregular."}, {"fecha": "2026-05-15", "turno": "Turno 2", "maquina": "E 30", "nave": "Nave 1", "observacion": "Al inicio de turno descarte de tuberías por falla de impacto, se realiza limpieza de vacío, posterior bien."}, {"fecha": "2026-05-15", "turno": "Turno 1", "maquina": "E 30", "nave": "Nave 1", "observacion": "Se recibe bajo rendimiento,  se sube gradualmente a 238 kg/hr, se mantiene diámetro al límite, nos piden 25,2 y tenemos 25 mm."}, {"fecha": "2026-05-15", "turno": "Turno 3", "maquina": "E 40", "nave": "Nave 1", "observacion": "Se recibe operativa presentando doble campana y mordaza del molde pegada, situación que afectaba la conformación de campanas. Se realiza cambio de consumo de material (silo/saca) en 2 ocasiones, generando inestabilidad y descarte de tubería. Se solicita apoyo a Mantención, logrando normalizar la condición a las 22:46. Durante el proceso se descartan tubos por campana mal conformada, también se deja tubería para recuperar por falla en abocardado (terminal neumático del sistema de levante 1 dañado).\nCausa raíz: Mordaza del molde atascada en sistema de abocardado, falta e inestabilidad de la materia prima."}, {"fecha": "2026-05-15", "turno": "Turno 2", "maquina": "E 40", "nave": "Nave 1", "observacion": "calidad separa producción por falla de impacto, se realiza ajustes de temperatura y limpieza de bomba de vacío."}, {"fecha": "2026-05-15", "turno": "Turno 1", "maquina": "E 40", "nave": "Nave 1", "observacion": "A las 20:05 hrs debemos detener por baja temperatura en horno, se da aviso a mantención quien revisa y encuentra calefacción quemada. Se entrega detenida a espera de enfriamiento del horno para proceder a retirar calefacción."}, {"fecha": "2026-05-15", "turno": "Turno 3", "maquina": "E 51", "nave": "Nave 2", "observacion": "Se descarta tubería por campana mal conformada durante el turno. Se realizan ajustes operacionales para mantener estabilidad de proceso.\nCausa raíz: Desviación en conformación de campana."}, {"fecha": "2026-05-15", "turno": "Turno 2", "maquina": "E 51", "nave": "Nave 2", "observacion": "Se hacen limpieza de bomba de vacío se descartan tubos por porosidad ambas líneas, ajustes en abocardadora por campanas mal conformadas."}, {"fecha": "2026-05-15", "turno": "Turno 3", "maquina": "E 60", "nave": "Nave 2", "observacion": "A las 11:30 se detiene la línea por aparición de raya de quemado en tubería. Matricería interviene entre las 11:50 y 13:15 realizando revisión y trabajos en el herramental. Posteriormente Mantención conecta calefactores y entrega el equipo a las 13:25. Se configuran temperaturas de trabajo y la línea parte nuevamente a las 14:00, estabilizándose a las 14:35.\nCausa raíz: Retención o degradación de material asociada al herramental/cabezal."}, {"fecha": "2026-05-15", "turno": "Turno 2", "maquina": "E 60", "nave": "Nave 2", "observacion": "se detiene con AQ.08:50 por cambio de producto. Matricería interviene 09:00 hacer el cambio de postizo"}, {"fecha": "2026-05-15", "turno": "Turno 2", "maquina": "E 60", "nave": "Nave 2", "observacion": "Matricería entrega 09:40.mantencion interviene a conectar calefactores 09:45,tambien se instala MOVACOLOR.se espera tiempo de calentamiento se inicia 10:30 , ajustes en sierra por variación de largo, se corrige, posterior bien."}, {"fecha": "2026-05-15", "turno": "Turno 3", "maquina": "E 80", "nave": "Nave 3", "observacion": "Se recibe operativa. Se descartan 8 tubos curvos producto de filtros de agua tapados que afectaban la estabilidad del enfriamiento. Se realiza limpieza de filtros y la condición queda estabilizada entre las 04:40 y 05:30, sin necesidad de detención de línea.\nCausa raíz: Filtros de agua obstruidos."}, {"fecha": "2026-05-15", "turno": "Turno 1", "maquina": "E 80", "nave": "Nave 3", "observacion": "Raya de impureza en una oportunidad"}, {"fecha": "2026-05-15", "turno": "Turno 3", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se recibe bajo rendimiento  y se mantiene en esa condición para no aumentar el flujo interno."}, {"fecha": "2026-05-15", "turno": "Turno 2", "maquina": "E 90", "nave": "Nave 1", "observacion": "Prueba Pendiente de Material ( 14/05) A las 11:00 hrs a solicitud de Jefaturas se se detiene para revisión completa de cabezal se dejan temperatura en purga, matricería desarma cabezal completo, lleva porta y postizo a taller para mecanizado por diámetros encontrados en lo antes mencionado."}, {"fecha": "2026-05-15", "turno": "Turno 1", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se recibe detenida por matricería en proceso de rebaje de empalme de postizo y porta postizo, luego mantención conecta calefacción al cuello ya que se encuentra material adherido, paralelamente se realiza limpieza de toernillos con scrap molido, saliendo incrustaciones metálicas (60 min), luego matricería informa que herramental se encuentra listo con la mejora, pero al revisar se observan rayas superficiales y rugosidad, se solicita pulir espejo, a las 19:00 hrs entregan y se autoriza, matricería realiza instalación de cabezal y posteriormente mantención conecta y revisa calefacción entregando a las 20:30 hrs, se pone en calentamiento de purga, máquina permanece con horas de prueba indicado por O. Montero."}, {"fecha": "2026-05-15", "turno": "Turno 3", "maquina": "E 100", "nave": "Nave 2", "observacion": "A las 05:40 se realiza cambio de alimentación desde 100% scrap a 100% material virgen debido a falta de disponibilidad de scrap para producción.\nCausa raíz: bajo rendimiento por consumo de scrap/Falta de disponibilidad de materia prima scrap."}, {"fecha": "2026-05-15", "turno": "Turno 2", "maquina": "E 100", "nave": "Nave 2", "observacion": "Al inicio de turno se cambia material de virgen a scrap, se descartan 2 rollos por incrustaciones grandes, se trabaja con 100% scrap, 65% de rendimiento."}, {"fecha": "2026-05-15", "turno": "Turno 1", "maquina": "E 100", "nave": "Nave 2", "observacion": "Al inicio calidad retiene 3 rollos por incrustaciones excesivas, se detiene y se realiza cambio de malla en 2 oportunidades, luego se detiene por limpieza de punta por rayas exteriores, descartándose 2 rollos por estas detenciones."}, {"fecha": "2026-05-15", "turno": "Turno 3", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se recibe con problemas de vacío, generando descarte de tubería por burbujas y bajo rendimiento. Se realizan limpiezas de vacío en ocho oportunidades durante el turno, además de ajustes de temperatura hasta estabilizar la condición. También se presentan descartes por vibrado, rayas superficiales y problemas en sierra, efectuándose un corte de línea para limpieza de aspersores.\nCausa raíz: Inestabilidad del sistema de vacío y deficiencias de enfriamiento/aspersión."}, {"fecha": "2026-05-15", "turno": "Turno 1", "maquina": "E 110", "nave": "Nave 2", "observacion": "Descarte por rayas de impurezas"}, {"fecha": "2026-05-15", "turno": "Turno 3", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-15", "turno": "Turno 2", "maquina": "E 120", "nave": "Nave 3", "observacion": "Sin planificación."}, {"fecha": "2026-05-15", "turno": "Turno 1", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-15", "turno": "Turno 2", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se inicia consumo de material encontrado en tolva (pulverizado blanco), posterior a ello se debe consumir material compuesto rechazado al 10%."}, {"fecha": "2026-05-15", "turno": "Turno 3", "maquina": "E 140", "nave": "Nave 3", "observacion": "Se recibe detenida por falla eléctrica en sierra. Mantención entrega el equipo a las 01:20 y se inicia calentamiento inmediato. La línea parte a las 01:50, pero a las 02:05 se detiene con AQ por presencia de rayas superficiales. Se intenta estabilizar utilizando bronce sin resultados positivos, por lo que se solicita intervención de Matricería para limpieza. Durante la revisión se detectan partículas metálicas y placas filtradas en el sistema. Mantención entrega nuevamente el equipo a las 03:50 y la línea parte a las 04:11, normalizando a las 04:20.\n\nPosteriormente se recibe detenida nuevamente, con alarma de material y temperaturas apagadas. Durante la revisión se detecta ausencia de protección en el batyfiltro, provocando adherencia de la bolsa al sistema de succión. Se detiene a las 23:53 y se instala tapa proveniente de la línea 100. La línea vuelve a partir a las 03:40, pero no logra estabilizar espesores debido a mezcla de material beta con genérico, generando alta inestabilidad de proceso. Para evitar mayor generación de scrap se detiene a las 04:58. Mantención revisa sistema de silo, detectando falla en bomba de succión, la cual es reemplazada, entregando el equipo a las 05:35.\nCausa raíz:\n\nContaminación metálica y placas filtradas en sistema de extrusión.\nFalta de protección en batyfiltro.\nMezcla de materiales incompatibles (beta/genérico).\nFalla en bomba del silo."}, {"fecha": "2026-05-15", "turno": "Turno 2", "maquina": "E 140", "nave": "Nave 3", "observacion": "Se detiene a las 10:50 por material degradado se purga con AQ se limpia vacío y se hace limpieza de tolvas y se cambia material f11-f7 se inicia partida a las 11:25 quedando estable a las 11:35, se retoma nuevamente, posterior sin novedad."}, {"fecha": "2026-05-15", "turno": "Turno 1", "maquina": "E 140", "nave": "Nave 3", "observacion": "Se recibe con falla en el corte de sierra, algunas canaletas buenas y otras picadas en la punta, mantención interviene a las 17:40 hrs porque persistente problema en corte, asiste quitando presión a oruga de carro de arrastre, se da nueva partida y se espera  nueva asistencia de mantenedor ya que necesita maquina funcionando para regulacion, mantención intenta sacar disco de corte, pero sistema se encuentra totalmente agripado, al ejercer presión se rompe golilla de sujeción, pendiente solución de mantención."}, {"fecha": "2026-05-15", "turno": "Turno 3", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se recibe detenida con alarma de material y temperaturas apagadas. Tras alcanzar temperaturas de operación se da partida a las 23:00, pero no logra estabilizar espesores debido a problemas en batyfiltro, detectándose ausencia de protección interna que evitaba adherencia de la bolsa al punto de succión. Se detiene a las 23:53 y se instala tapa de reemplazo proveniente de línea 100. Posteriormente parte nuevamente a las 03:40, pero persiste inestabilidad de espesores debido a mezcla de material beta con genérico y oscilación en las RPM del tornillo extrusor. Para evitar incremento de scrap se decide detener a las 04:58. Mantención interviene sistema de silo, detectando falla en bomba de succión, realizando reemplazo y entregando el equipo a las 05:35.\nCausa raíz:\nVariación en las RPM del tornillo extrusor\nFalta de protección en batyfiltro.\nMezcla de materiales incompatibles.\nFalla en bomba de silo/succión."}, {"fecha": "2026-05-15", "turno": "Turno 2", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se recibe detenida por falla en sistema de carga hacia el silo secador, mntto entrega maquina, se inicia cambio de producto a Beta 20mm. Matricería interviene en cambio de herramental, se realiza vaciado de silo para cambio de material, mntto entrega calefacción, se inicia calentamiento, se inicia alimentación de material virgen a silo, sistema presenta falla nuevamente, mntto realiza revisión, a las 14:00 hrs se inicia actividades , pero se apaga extrusora sola saliendo solo alarma de sobre temperatura y alarma en VDF M1, Se llama a mantenimiento para ver alarma, queda pendiente entrega de equipo. se deja guías y equipo en condiciones de partida."}, {"fecha": "2026-05-15", "turno": "Turno 1", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se recibe maquina detenida por sobrecalentamiento en aceite del variador del extrusor. Se da inicio a las 15:30 hrs luego de regular cortes, largo útil, espesores y diámetro queda normalizada a las 16:50 hrs., posteriormente descarte  por marca de agua."}, {"fecha": "2026-05-15", "turno": "Turno 3", "maquina": "E 160", "nave": "Nave 1", "observacion": "Se recibe operativa. Durante el turno se descartan tubos sin campana debido a atascamientos en el sistema de abocardado, afectando la continuidad del proceso.\nCausa raíz: Atascamiento en abocardadora/bajo rendimiento por movimientos irregulares en abocardado"}, {"fecha": "2026-05-15", "turno": "Turno 2", "maquina": "E 160", "nave": "Nave 1", "observacion": "A las 9:00 hrs arroja alarma en abocardado se llama a mantenimiento para revisión ya que no realiza proceso de abocardado, corte de línea lado 1 y 3, descarte de tubos por rayas de impurezas, se realiza limpieza con bronce, posterior bien."}, {"fecha": "2026-05-15", "turno": "Turno 1", "maquina": "E 160", "nave": "Nave 1", "observacion": "Se realiza cambio a pack. Se mantiene a menor rendimiento por campanas blancas y a espera de repuesto del horno"}, {"fecha": "2026-05-15", "turno": "Turno 2", "maquina": "E 180", "nave": "Nave 1", "observacion": "Se inicia consumo de pulverizado blanco pigmentado."}, {"fecha": "2026-05-15", "turno": "Turno 1", "maquina": "E 180", "nave": "Nave 1", "observacion": "Se detiene por retención en cambio de saca, se pasa AQ y luego se da nueva partida, se mantiene con pulverizado hasta las 20:55 hrs por falla en equipo Movacolor, pendiente revisión de mantención para retomar uso de pulverizado."}], "demo": false, "real": true}, {"id": "2026-05-16_2026-05-16", "desde": "2026-05-16", "hasta": "2026-05-16", "importedAt": "2026-05-16T00:00:00.000Z", "turnos": {"Turno 1": {"jefePlanta": "Ivan Jerez", "kilos": 4790.957539999999, "sobrepeso": -0.009295 so (se seca chorro de agua de lubricación)"}, {"fecha": "2026-05-16", "turno": "Turno 2", "maquina": "E 30", "nave": "Nave 1", "observacion": "Descarte por campanas aplastadas."}, {"fecha": "2026-05-16", "turno": "Turno 3", "maquina": "E 40", "nave": "Nave 1", "observacion": "Se recibe detenida mientras Mantención interviene sistema de calefacción del horno. El equipo es entregado a las 23:20 y posteriormente se realiza recuperación de tubería antes de iniciar temperaturas de trabajo. La línea parte a las 04:10 y logra normalizarse a las 04:30.\nCausa raíz: Falla en sistema de calefacción del horno."}, {"fecha": "2026-05-16", "turno": "Turno 2", "maquina": "E 40", "nave": "Nave 1", "observacion": "Al inicio de turno se realiza ajustes en parámetros de abocardadora por campanas con rechupe, se corrige."}, {"fecha": "2026-05-16", "turno": "Turno 3", "maquina": "E 51", "nave": "Nave 2", "observacion": "Se descarta tubería por campana mal conformada. Además, se registra un corte de línea por flujo, generando atascamiento en sierra durante el proceso.\nCausa raíz:\n\nDesviación en conformación de campana.\nInestabilidad de flujo que provoca atascamiento en sierra."}, {"fecha": "2026-05-16", "turno": "Turno 2", "maquina": "E 51", "nave": "Nave 2", "observacion": "Calidad separa tuberías por campanas mal conformadas, se realiza ajuste, posterior bien."}, {"fecha": "2026-05-16", "turno": "Turno 2", "maquina": "E 70", "nave": "Nave 3", "observacion": "Sin novedad, se detiene maquina 12:30 hrs por dotación de personal, maquina considerada backup para turno especial, se debe partir con ella 19:00 hrs."}, {"fecha": "2026-05-16", "turno": "Turno 3", "maquina": "E 80", "nave": "Nave 3", "observacion": "Se recibe operativa. A las 23:00 se realizan ajustes de centrado para disminuir sobrepeso, sin necesidad de detención. Posteriormente, a las 05:20, se realiza cambio de alimentación desde saca a Buffer Tank.\nCausa raíz: Ajuste operacional por desviación de sobrepeso."}, {"fecha": "2026-05-16", "turno": "Turno 2", "maquina": "E 80", "nave": "Nave 3", "observacion": "Sin novedad, detención de fin de semana."}, {"fecha": "2026-05-16", "turno": "Turno 3", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se recibe detenida con temperatura de purga. Matricería realiza desacople de hembra y reapriete completo de cabezal, entregando a las 00:10. Posteriormente Mantención conecta calefactores y entrega el equipo a las 00:30. La línea parte a las 01:20 y se normaliza a las 01:45.\n\nA las 02:55 se descartan tubos por campana mal conformada. Mantención interviene a las 03:20, detectando que los tiempos del ciclo de abocardado no se completaban correctamente, realizando cambio de sensor. Posteriormente Matricería realiza cambio de macho de abocardado (varilla de los segmentos suelta), entregando el equipo a las 05:35. Se deja temperatura de abocardado activa para recuperación de tubería y la línea queda en temperatura de purga.\nCausa raíz:\n\nDesajuste y reapriete insuficiente en cabezal/herramental.\nFalla de sensor en ciclo de abocardado."}, {"fecha": "2026-05-16", "turno": "Turno 2", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se recibe detenida, en proceso de recuperación de tuberías, posterior a ello se avanza con cambio planificado canaleta blanco 75mm. Matriceria entrega equipo, se inicia calentamiento, se realizan pruebas de campana , dando partida a las 11:30 hrs"}, {"fecha": "2026-05-16", "turno": "Turno 3", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se descarta medio rollo por perforación mientras la línea trabaja con alimentación 100% scrap.\nCausa raíz: Perforación en tubería asociada a inestabilidad de proceso con material scrap."}, {"fecha": "2026-05-16", "turno": "Turno 2", "maquina": "E 100", "nave": "Nave 2", "observacion": "se detiene a las 07:10 para cambio de malla y a la ves limpiar cabezal se cambia d malla por instrucciones. Para prevenir rechazos, se da partida a las 8:50 hrs descarte de cañerías por incrustaciones, calidad separa 3 rollos, incrustaciones de partículas de PVC , detención de fin de semana."}, {"fecha": "2026-05-16", "turno": "Turno 3", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se descarta tubería en dos oportunidades por presencia de rayas superficiales y problemas de flujo. Se realizan ajustes operacionales para estabilizar el proceso.\nCausa raíz:\n\nAcumulación o contaminación superficial generando rayas.\nInestabilidad de flujo de material."}, {"fecha": "2026-05-16", "turno": "Turno 3", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-16", "turno": "Turno 2", "maquina": "E 120", "nave": "Nave 3", "observacion": "Sin planificación."}, {"fecha": "2026-05-16", "turno": "Turno 3", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se recibe operativa. A las 01:45 se corta manga para realizar limpieza de calibrador debido a exceso de cera que estaba generando rayas exteriores en tubería. La línea se engancha nuevamente a las 02:00 y se estabiliza a las 02:10.\nCausa raíz: Exceso de cera acumulada en calibrador."}, {"fecha": "2026-05-16", "turno": "Turno 2", "maquina": "E 130", "nave": "Nave 3", "observacion": "Sin novedad, se trabaja con 10% de compuesto rechazado."}, {"fecha": "2026-05-16", "turno": "Turno 3", "maquina": "E 140", "nave": "Nave 3", "observacion": "Se recibe detenida por problemas en sierra. Mantención interviene y entrega el equipo a las 00:20, iniciándose temperaturas de trabajo y posterior partida a las 01:00. A las 01:20 reaparecen fallas en sierra, solicitándose nuevamente apoyo de Mantención. Debido a persistencia de la falla, la línea se detiene con AQ a las 01:40. Mantención entrega nuevamente a las 02:50, pero durante pruebas con máquina detenida la sierra continúa rompiendo canaletas. Se decide mantener la línea detenida para evitar mayor generación de scrap.\nCausa raíz: Falla mecánica persistente en sistema de sierra/corte."}, {"fecha": "2026-05-16", "turno": "Turno 2", "maquina": "E 140", "nave": "Nave 3", "observacion": "Detenida por falla en sierra, mtto trabaja en ello, pendiente entrega de equipo."}, {"fecha": "2026-05-16", "turno": "Turno 3", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se recibe detenida con calibradores desmontados en proceso de instalación. La línea parte a las 22:40 y logra normalizarse a las 23:00.\nCausa raíz: Cambio de producto y montaje de calibradores."}, {"fecha": "2026-05-16", "turno": "Turno 3", "maquina": "E 160", "nave": "Nave 1", "observacion": "Se recibe operativa. A las 00:00 se corta línea por pérdida de vacío, resolviéndose mediante aumento de niveles de agua en tinas. La operación se estabiliza hasta las 01:45, cuando falla el pasa tubos de la abocardadora en línea 1 y posteriormente, a las 02:00, falla el transportador de línea 4.\n\nMantención informa necesidad de realizar chequeo completo al PLC de la abocardadora por posible problema de señales de control. Debido a que no se logra estabilizar el sistema y para evitar acumulación excesiva de scrap, se decide detener la extrusora. Mantención se retira a las 03:15 sin solución definitiva. Se aprovecha la detención para realizar limpieza y pulido de calibradores, dejando temperaturas apagadas.\nCausa raíz:\n\nPérdida de vacío por nivel insuficiente en tinas.\nFalla de señales/PLC en sistema de abocardado y transporte."}, {"fecha": "2026-05-16", "turno": "Turno 2", "maquina": "E 160", "nave": "Nave 1", "observacion": "Detenida por falla en abocardadora, pendiente entrega por parte de mtto."}, {"fecha": "2026-05-16", "turno": "Turno 3", "maquina": "E 180", "nave": "Nave 1", "observacion": "A las 11:00 se realiza cambio a pulverizado blanco pigmentado. Durante el proceso se descarta tubería por problemas de flujo asociados al cambio de material.\nCausa raíz: Inestabilidad de flujo durante cambio de material/producto."}, {"fecha": "2026-05-16", "turno": "Turno 2", "maquina": "E 180", "nave": "Nave 1", "observacion": "A las 11: o": "Turno 1", "maquina": "E 51", "nave": "Nave 2", "observacion": "Se recibe detenida por falla en la sierra, mantención interviene y revisa, luego realiza cambio de rodamientos en polea tensora de correa de la sierra , se entrega a las 13:00 hrs, posteriormente se pone en calentamiento y se da partida a las 15:50 hrs quedando estable a las 16:30 hrs."}, {"fecha": "2026-05-17", "turno": "Turno 3", "maquina": "E 60", "nave": "Nave 2", "observacion": "Se registran dos cortes de línea por perforaciones durante el turno. Se realizan ajustes operacionales para recuperar continuidad de proceso.\nCausa raíz: Materia prima"}, {"fecha": "2026-05-17", "turno": "Turno 1", "maquina": "E 60", "nave": "Nave 2", "observacion": "se solicita intervención de mantención y se descartan tubos debido a fallas en la sierra, la cual presenta detenciones inesperadas en tres ocasiones durante la operación, mantención interviene y realiza limpieza de sensopres."}, {"fecha": "2026-05-17", "turno": "Turno 3", "maquina": "E 80", "nave": "Nave 3", "observacion": "Se recibe detenida mientras se recuperan tubos y se establecen temperaturas de trabajo. La línea parte a la 01:13 y normaliza a las 02:15. Posteriormente se descartan 10 tubos por flujo interno, corrigiéndose mediante ajuste en dosificación de cera.  (considerar la horas de producción de esta línea según la capacidad operacional)\nCausa raíz:\n\nRecuperación de producción pendiente al inicio, capacidad operativa\nFlujo interno asociado a dosificación de cera."}, {"fecha": "2026-05-17", "turno": "Turno 1", "maquina": "E 80", "nave": "Nave 3", "observacion": "Se trabaja en reemplazo de máquina 140"}, {"fecha": "2026-05-17", "turno": "Turno 3", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se recibe en producción, presentando pérdidas constantes de vacío en tina y problemas recurrentes en abocardado. Se identifican limitaciones operacionales asociadas a calibrador inapropiado para el producto, sobreespesor y dificultades en mesa de ha": "2026-05-19", "turno": "Turno 2", "maquina": "E 30", "nave": "Nave 1", "observacion": "Descarte de tuberías por campanas aplastadas."}, {"fecha": "2026-05-19", "turno": "Turno 1", "maquina": "E 30", "nave": "Nave 1", "observacion": "En una oportunidad se traba tubería en macho abocardador, se retira con pistola de calor, se mantiene el diámetro en el mínimo 25 mm y debe ser 25,1 mm. Y vacío de -0,6 bar en la tina."}, {"fecha": "2026-05-19", "turno": "Turno 3", "maquina": "E 30", "nave": "Nave 1", "observacion": "Se recibe operativa. Durante el turno se registra un corte en línea A por atascamiento de tubería en sierra. Se realizan ajustes y la línea vuelve a operación normal."}, {"fecha": "2026-05-19", "turno": "Turno 2", "maquina": "E 40", "nave": "Nave 1", "observacion": "Se recibe detenida por falla en conformación de campana, se revisa funcionamiento se macho abocardadora, se revisa horno de abocardado, se cambia tapa de horno de 110mm a 75mm se cambia de ciclo 3 a ciclo 4 sin resultados satisfactorios, se solicita a mtto revisar presión de aire en conjunto, asimismo se solicito a matricería cambio de macho abocardadora, al hacer la campana en ciclo y se marcan insertos, calidad no acepta producción, maquina queda detenida para no generar scrap."}, {"fecha": "2026-05-19", "turno": "Turno 1", "maquina": "E 40", "nave": "Nave 1", "observacion": "Se recibe detenida por problemas en la conformación de campanas, se realizan pruebas en vacío con ciclo 3 y 4, mantención revisa presiones. Se procede a dar partida a las 13:45 hrs con campanas marcadas por insertos con mínimo aceptado, pero sujeto a revisión de estanqueidad por parte de calidad (Pendiente"}, {"fecha": "2026-05-19", "turno": "Turno 3", "maquina": "E 40", "nave": "Nave 1", "observacion": "Se recibe operativa con pequeñas marcas de inserto aprobadas previamente por Calidad. Posteriormente se detectan pestañas cortas en campana, realizándose ajuste en cota de carro para corregir conformado. Se descartan tubos fuera de estándar y la condición queda estabilizada.\nCausa raíz: Desajuste en cota de carro que afectaba formación de campana (operacional)"}, {"fecha": "2026-05-19", "turno": "Turno 1", "maquina": "E 51", "nave": "Nave 2", "observacion": "Al inicio ajustes por espesores bajos, luego mantención interviene sierra del lado B , posteriormente limpieza completa del sistema de vacío, también filtración de agua por el macho abocardadora del lado B, matricería realiza cambio de o ring (20 min)"}, {"fecha": "2026-05-19", "turno": "Turno 3", "maquina": "E 51", "nave": "Nave 2", "observacion": "Se descarta tubería por campana mal conformada, corrigiéndose mediante ajuste de tiempos de abocardado. Posteriormente ambas líneas se detienen a las 08:30 por pérdida de vacío en la extrusora. Se realiza limpieza del sistema y reinstalación de guías, retomando operación a las 08:49 y normalizando a las 08:55.\nCausa raíz: Pérdida de vacío en extrusora y desajuste de tiempos de abocardado."}, {"fecha": "2026-05-19", "turno": "Turno 3", "maquina": "E 60", "nave": "Nave 2", "observacion": "Se corta línea debido a retorno de material por ducto de vacío. Se ajusta perfil de temperatura del cabezal, corrigiendo la condición y estabilizando el proceso. Se recibe y se mantiene bajo rendimiento por el comportamiento del material.\nCausa raíz: Parámetros de temperatura inadecuados en cabezal generando retorno de material."}, {"fecha": "2026-05-19", "turno": "Turno 1", "maquina": "E 70", "nave": "Nave 3", "observacion": "Se realiza cambio dimensional"}, {"fecha": "2026-05-19", "turno": "Turno 3", "maquina": "E 80", "nave": "Nave 3", "observacion": "Se recibe operativa. Se descartan tubos sin campana debido a falla de inserto fuera de posición, provocando atascamiento en el abocardado. Se baja rendimiento y se solicita apoyo a matricería a las 19:56, realizando limpieza completa del macho de abocardado. Matricería entrega a las 20:05, quedando operativa y estable.\nCausa raíz: Inserto fuera de posición y suciedad en macho de abocardado."}, {"fecha": "2026-05-19", "turno": "Turno 2", "maquina": "E 90", "nave": "Nave 1", "observacion": "Descarte de tuberías por desfase de campana, se realiza ajuste en mordazas."}, {"fecha": "2026-05-19", "turno": "Turno 1", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se detiene por filtración de agua en macho abocardadora, matricería interviene, producción retira material de tolvas, realiza limpieza y se prepara cambio de producto, luego matricería entrega a las 08:35 hrs, mantención conecta y revisa calefacción, se espera calentamiento y se inicia partida a las 10:00 hrs"}, {"fecha": "2026-05-19", "turno": "Turno 3", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se recibe operativa. Se descartan tubos por campana con desface. Durante el turno se registran dos cortes de línea: el primero por atascamiento de tubo en mesa y el segundo sin causa identificada en reporte.\nCausa raíz: Desfase en campana y atascamiento de tubería en mesa de transferencia. Manga muy estirada"}, {"fecha": "2026-05-19", "turno": "Turno 2", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se trabaja con 100% scrap. Inicio de turno se detiene para cambio de malla,  se detiene a las 22:40 control  se cambia de mallas y se limpia se inicia partida a las 23:10 y se detiene  a las 23:40 por presión de masa  se limpia nuevamente los filtros para liberar la presión de masa se inicia partida. A las 00:10  nuevamente se detiene a las 00:50  por presión de masa se regula temperatura  presión de masa se mantiene en 287  y se detiene en 295  bar Nuevamente se limpia filtros de malla. Para liberar presión  se inicia partida a las 01 :20 se logra subir rendimiento a 240  con espesores de 7 - 7.4 , Gravimétrico debería de marcar  en 7.14  y se baja a 5.5 se baja carro de tiro a 0.800 dando rendimiento en 180, No se puede subir más rendimiento por presión de masa estando en 2.88 bar, Limpieza y cambio de maya 4 veces en el turno."}, {"fecha": "2026-05-19", "turno": "Turno 1", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se detiene por cambio de producto y se entrega a matricería, por otra parte se inicia recuperado de rollos con zunchos sueltos"}, {"fecha": "2026-05-19", "turno": "Turno 1", "maquina": "E 100", "nave": "Nave 2", "observacion": "Partida a las 14:00 hrs"}, {"fecha": "2026-05-19", "turno": "Turno 3", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se detiene a las 04:35 por incrustaciones en línea. Se realiza cambio de mallas, pero la condición persiste, generando nueva detención a las 04:55. Se efectúa cambio de tejo y nuevamente de mallas, entregándose a matricería a las 05:20. Matricería entrega a las 05:50 y mantenimiento conecta calefactores, finalizando a las 05:57.\nSe reinicia a las 06:05, pero vuelven las incrustaciones a las 06:20. Se instala doble malla y se reinicia a las 06:55. Posteriormente la falla reaparece a las 07:10, realizándose vaciado completo del silo, donde se encuentran contaminantes como PPR, sunchos, scotch y pitillas, efectuándose limpieza total del sistema.\nCausa raíz: Contaminación de material en silo que generaba incrustaciones recurrentes."}, {"fecha": "2026-05-19", "turno": "Turno 1", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se corta en una oportunidad por incrustación de impureza"}, {"fecha": "2026-05-19", "turno": "Turno 3", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se descarta tubería por flujo y presencia de burbujas. Se ejecuta limpieza de ductos de vacío para estabilizar el proceso.\nCausa raíz: Deficiencia en sistema de vacío."}, {"fecha": "2026-05-19", "turno": "Turno 2", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Temporada"}, {"fecha": "2026-05-19", "turno": "Turno 1", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-19", "turno": "Turno 3", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Temporada"}, {"fecha": "2026-05-19", "turno": "Turno 2", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se recibe detenida por falta de inventario de compuesto blanco, planta de compuesto se encuentra formulando sanitario blanco, se enciende temperatura de trabajo a las 10:30 se inicia purga a la 11:15 se hace limpieza de vacío y aspersores, Se inicia partida 11:25 quedando estable a las 11:45."}, {"fecha": "2026-05-19", "turno": "Turno 1", "maquina": "E 130", "nave": "Nave 3", "observacion": "Descarte por flujo al momento de quedar sin material el silo y hacer uso 100% de compuesto rechazado."}, {"fecha": "2026-05-19", "turno": "Turno 2", "maquina": "E 140", "nave": "Nave 3", "observacion": "Mtto cambia rodamientos lineales de sierra, solicita dar partida para probar sierra, se inicia partida a las 3:09 se detiene 3:50 por problemas en la sierra y a la vez calidad no acepta producción por marca en color café se llama a matricería para limpieza de boquilla y dos primeras placas, Matricería entrega maquina 140 a las 4:30, queda pendiente entrega de sierra."}, {"fecha": "2026-05-19", "turno": "Turno 1", "maquina": "E 140", "nave": "Nave 3", "observacion": "Se recibe detenida por canaletas picadas y vetas, mantención inicia revisión de calefacción completa, además realiza revisión en sierra encontrando vibración, por lo que decide realizar cambio de disco de corte (con dientes), cambió motor de la sierra, se hizo regulación de sensores, mordazas, flujos entrada y salida. Se realizó prueba en vacío y sale limpiecito el corte realizar cambio de rodamientos, paralelamente matricería inicia desarme y limpieza de cabezal sin encontrar material adherido o imperfecciones, producción realiza limpieza de inyectores y filtros, además externo realiza limpieza de harneros de la extrusora, el cual se encuentra limpio, ahora va a limpiar el de la coextrusora, por otra parte se define realizar revisión de tornillos de la coextrusora (pendiente siguiente turno)"}, {"fecha": "2026-05-19", "turno": "Turno 3", "maquina": "E 140", "nave": "Nave 3", "observacion": "Se recibe detenida. Mantenimiento interviene realizando cambio de tornillo de coextrusora.\nCausa raíz: Falla mecánica en tornillo de coextrusora."}, {"fecha": "2026-05-19", "turno": "Turno 2", "maquina": "E 150", "nave": "Nave 1", "observacion": "A las 5:00 hrs maquina quedara detenida por filtración en bypass de tina lado B, se requiere soldar con unos, mtto retira pieza para intervención de contratistas a primera hora."}, {"fecha": "2026-05-19", "turno": "Turno 1", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se recibe detenida por filtración de agua en tubería del by pass, mantención y externo trabajan en la solución (07:00 a 10:15 hrs)"}, {"fecha": "2026-05-19", "turno": "Turno 3", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se recibe operativa. A las 15:05 se atascan tubos en el paso de sierra de mordaza de planetario, por lo que se dejan mordazas cerradas antes del corte para evitar nuevos atascos."}, {"fecha": "2026-05-19", "turno": "Turno 3", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se realiza cambio de producto programado (dimensional). Posteriormente se detecta flotador del lado B atascado en cilindro, provocando vibrado y ovalado por falta de agua debido a descarga continua de tina. Se rellena tina y mantenimiento ajusta sistema de nivel, estabilizando la operación. Se descartan tubos vibrados y ovalados.\nCausa raíz: Falla en control de nivel de agua y atascamiento en mordaza de planetario."}, {"fecha": "2026-05-19", "turno": "Turno 2", "maquina": "E 160", "nave": "Nave 1", "observacion": "Detenida por falla en abocardadora, pendiente entrega por parte de mtto."}, {"fecha": "2026-05-19", "turno": "Turno 1", "maquina": "E 160", "nave": "Nave 1", "observacion": "Detenida por falla en abocardadora, pendiente entrega por parte de mantención."}, {"fecha": "2026-05-19", "turno": "Turno 3", "maquina": "E 160", "nave": "Nave 1", "observacion": "Detenida por cambio de abocardado (Área
