ba de herramental. Matricería realiza cambio de herramental luego de entregar muestras. Mantención conecta calefactores y entrega. La línea inicia, pero durante normalización se presenta atascamiento de campana en macho abocardado. Se detiene y se deja informado a matricería para intervención en turno entrante.\nCausa raíz: Problema mecánico en sistema de abocardado posterior a cambio de herramental. (considerar las horas de prueba)"}, {"fecha": "2026-05-20", "turno": "Turno 2", "maquina": "E 60", "nave": "Nave 2", "observacion": "Al inicio de turno corte de línea en 1 ocasión , de retoma nuevamente."}, {"fecha": "2026-05-20", "turno": "Turno 1", "maquina": "E 60", "nave": "Nave 2", "observacion": "Se recibe operando con bajo rendimiento y sobrepeso en el tubo. Se procede a incrementar gradualmente el rendimiento y realizar ajustes de parámetros, controlando espesores y longitud para dejar el proceso dentro del estándar establecido"}, {"fecha": "2026-05-20", "turno": "Turno 3", "maquina": "E 60", "nave": "Nave 2", "observacion": "Se recibe con falla en mesa de traslado debido a soportes elevados. Mantención interviene desde las 15:20, detectando mala instalación de manifold. Luego de ajustes y pruebas se inicia operación a las 15:50, normalizando a las 16:15.\nCausa raíz: Instalación incorrecta de manifold en sistema de traslado."}, {"fecha": "2026-05-20", "turno": "Turno 2", "maquina": "E 70", "nave": "Nave 3", "observacion": "Presenta problemas en la zona de abocardado carro de tiro de abocardadora, se solicita a mtto asistencia , polines de mesa con desgaste y correa de oruga muy holgada, perno regulador no tiene holgura para realizar tensión en correa. Calidad separa producción por error en impresión, error operacional."}, {"fecha": "2026-05-20", "turno": "Turno 1", "maquina": "E 70", "nave": "Nave 3", "observacion": "Se recibe bajo rendimiento y se sube gradualmente a 235 kg/hr, además fallas reiteradas del carro de arrastre, mantención interviene y realiza cambio de rodillos de goma y correa, luego entrega."}, {"fecha": "2026-05-20", "turno": "Turno 3", "maquina": "E 80", "nave": "Nave 3", "observacion": "A las 16:13 falla motor de central hidráulica del abocardado, generando alarma de bomba hidráulica. Se realiza corrección y mantención entrega extrusora a las 16:30, quedando operativa.\nCausa raíz: Falla en sistema hidráulico del abocardado."}, {"fecha": "2026-05-20", "turno": "Turno 2", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se recibe con rallas externas se detiene máquina para limpieza de calibrador quedando estable a las 22:30, durante la marcha se descartan tubos con raya externa, se limpia calibrador en varias ocasiones."}, {"fecha": "2026-05-20", "turno": "Turno 1", "maquina": "E 90", "nave": "Nave 1", "observacion": "Descarte de tubería por flujo y falla de un sensor de cota carro, además se agrega cera a 0,200%"}, {"fecha": "2026-05-20", "turno": "Turno 3", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se recibe operativa. Durante el turno se presentan reiteradas pérdidas de vacío en tina y aparición de flujo en manga. Se ajusta vacío logrando estabilizar temporalmente la condición. Además, se descartan tubos por raya de calibrador y se realizan dos cortes de línea para retirar impurezas del calibrador. A las 21:00 se detiene carro para limpieza de residuos de material en calibrador, normalizando operación a las 21:30.\nCausa raíz: Contaminación e inestabilidad en sistema de vacío y calibrador."}, {"fecha": "2026-05-20", "turno": "Turno 2", "maquina": "E 100", "nave": "Nave 2", "observacion": "Al inicio de turno se detiene para cambio de mallas, Durante el turno se cambia 3 veces mallas"}, {"fecha": "2026-05-20", "turno": "Turno 1", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se descartan 3 unidades por quiebre en enrolladora y 1 por perforaciones."}, {"fecha": "2026-05-20", "turno": "Turno 3", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se corta línea a las 21:15 para realizar cambio de malla y limpieza de cabezal. Se reinicia a las 21:25 y normaliza a las 21:40.\nCausa raíz: Acumulación de residuos en sistema de filtrado y cabezal."}, {"fecha": "2026-05-20", "turno": "Turno 2", "maquina": "E 120", "nave": "Nave 3", "observacion": "Sin planificación."}, {"fecha": "2026-05-20", "turno": "Turno 1", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-20", "turno": "Turno 3", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-20", "turno": "Turno 2", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se trabaja con compuesto rechazado al 20%"}, {"fecha": "2026-05-20", "turno": "Turno 1", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se mantiene consumiendo 80% compuesto + 20% material rechazado y cera"}, {"fecha": "2026-05-20", "turno": "Turno 2", "maquina": "E 140", "nave": "Nave 3", "observacion": "Detenida por cambio de cámara y tornillo de coextrusora, mtto avanza a montar calefacción en coextrusora."}, {"fecha": "2026-05-20", "turno": "Turno 1", "maquina": "E 140", "nave": "Nave 3", "observacion": "Se recibe detenida por parte de matricería con temperaturas apagadas, primera y segunda placa desmontadas, boquilla desmontada. Pendiente entrega de mantención del cambio de cámara y tornillo"}, {"fecha": "2026-05-20", "turno": "Turno 3", "maquina": "E 140", "nave": "Nave 3", "observacion": "Detenida por  cambio de tornillos de coextrusora."}, {"fecha": "2026-05-20", "turno": "Turno 2", "maquina": "E 150", "nave": "Nave 1", "observacion": "Durante el transcurso del turno se realiza descarte de tubería por bajo diámetro y vibrado en ambas líneas"}, {"fecha": "2026-05-20", "turno": "Turno 1", "maquina": "E 150", "nave": "Nave 1", "observacion": "Al inicio descarte de tubería por vibración del lado B"}, {"fecha": "2026-05-20", "turno": "Turno 3", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se recibe operativa. Durante el turno se descartan tubos por atascamiento en sector sierra, vibrado y bajo diámetro. Se realizan ajustes en sistema de agua estabilizando parcialmente la condición. Posteriormente se detiene la línea debido a que el flotador de tina lado B se traba, provocando inundación de tina y producto ovalado. Mantención queda informado y entrega equipo a las 21:35.\nCausa raíz: Falla mecánica en flotador de tina y descontrol de nivel de agua."}, {"fecha": "2026-05-20", "turno": "Turno 2", "maquina": "E 160", "nave": "Nave 1", "observacion": "Detenida por cambio de abocardadora por parte de mtto."}, {"fecha": "2026-05-20", "turno": "Turno 1", "maquina": "E 160", "nave": "Nave 1", "observacion": "Detenida por cambio de abocardadora por parte de mantención"}, {"fecha": "2026-05-20", "turno": "Turno 3", "maquina": "E 160", "nave": "Nave 1", "observacion": "Detenida por cambio de abocardadora (Área de proyectos)."}, {"fecha": "2026-05-20", "turno": "Turno 2", "maquina": "E 180", "nave": "Nave 1", "observacion": "Se detiene con AQ.00:00 por falla de dosificador, poca carga, se vacía tolva para limpiar parte del dosificador, se encuentran amarras, se limpia y se deja ok. se inicia nuevamente 00:30, se trabaja con pulverizado blanco pigmentado en línea."}, {"fecha": "2026-05-20", "turno": "Turno 1", "maquina": "E 180", "nave": "Nave 1", "observacion": "Descarte por flujo en cambios de sacas, se mantiene uso de pulverizado blanco 100%. Pendiente cambiar a alcantarillado gris, se informa al turno entrante."}, {"fecha": "2026-05-20", "turno": "Turno 3", "maquina": "E 180", "nave": "Nave 1", "observacion": "A las 17:00 se detiene para cambio de producto y postizo. Matricería interviene entre las 17:10 y 17:25. Se realiza limpieza de filtros y sistema de vacío de extrusora. La línea inicia a las 17:50 y normaliza a las 18:20, pero posteriormente se detecta incumplimiento de espesores, generando nueva detención a las 18:40 para cambio adicional de postizo. Matricería entrega a las 18:55. Se ejecuta li to 2/5; posterior a ajustes la prueba empeora a 3/5. Se envía una hora de producción a molino. Más tarde se corta manga para eliminar marcas internas, reiniciando entre 17:10 y 17:20, pero las marcas persisten. Se realizan nuevas mejoras logrando eliminar defectos visuales, aunque Re muestreo vuelve a fallar 2/5. Calidad aprueba producto “para mejora”. Finalmente se descartan tubos por desgarro interior.\nCausa raíz: Problemas de formulación/proceso asociados a resistencia de impacto y defectos internos de material."}, {"fecha": "2026-05-21", "turno": "Turno 2", "maquina": "E 51", "nave": "Nave 2", "observacion": "Termino de horas de prueba, turno anterior realiza pruebas de campana, se recibe macho pegado con tubo de 40 mm y la maquina detenida , se solicita a matricería reparación de filtración de agua en macho abocardadora lado A, matricería cambio o ring, posterior a ello se realizan pruebas de campana, no se logra conformar campana, machos no soplan aire para conformar nichos  en campana, se solicita desmontar machos para revisar, los montador presentan 2 perforaciones entrada y salida de agua, las flautas que corresponden tienen 3 perforaciones,  se solicita cambio de flautas, solo se encuentran las de diámetro 50mm, refieren que no se encuentran en taller ni pañol, queda pendiente entrega de maquina por parte de matricería."}, {"fecha": "2026-05-21", "turno": "Turno 1", "maquina": "E 51", "nave": "Nave 2", "observacion": "Se recibe detenida por machos dañados, matricería realiza montaje, reparación y luego montaje, después se pone en calentamiento y se da partida, posteriormente fallan ensayos de impacto, se aumenta de 1,2% a 1,6%, se entrega mejora y calidad informa que sale bien."}, {"fecha": "2026-05-21", "turno": "Turno 3", "maquina": "E 51", "nave": "Nave 2", "observacion": "Se descarta tubería por campana mal conformada. Se detecta fuga de aire en conector del macho abocardador, reemplazándose el componente. Posteriormente persiste condición de campana estrecha; se realiza limpieza de filtro de abocardadora sin resultados definitivos, ajustándose temperaturas y cota de carro para estabilizar.\nCausa raíz: Fuga neumática y desajuste de parámetros de abocardado."}, {"fecha": "2026-05-21", "turno": "Turno 2", "maquina": "E 60", "nave": "Nave 2", "observacion": "Corte de línea por alta temperatura de agua en tina de enfriamiento, se baja rendimiento, posterior a ello mtto resuelve problema en chiller, posterior se normaliza."}, {"fecha": "2026-05-21", "turno": "Turno 1", "maquina": "E 60", "nave": "Nave 2", "observacion": "Se realiza cambio dimensional."}, {"fecha": "2026-05-21", "turno": "Turno 3", "maquina": "E 60", "nave": "Nave 2", "observacion": "Se descarta tubería por corte defectuoso. Se ajusta sierra quedando operación normalizada.\nCausa raíz: Desajuste en sistema de corte."}, {"fecha": "2026-05-21", "turno": "Turno 2", "maquina": "E 70", "nave": "Nave 3", "observacion": "Sin novedad, se recuperan y envasan  tuberías de 3 mts a 1 mts 6 pallet, producción anterior."}, {"fecha": "2026-05-21", "turno": "Turno 1", "maquina": "E 70", "nave": "Nave 3", "observacion": "Se corta en 3 oportunidades por atascamiento en la sierra y luego se corta por falta de agua en la tina, mantención interviene realizando llenado de pozo, luego se da nueva partida. Se debe realizar cambio a hidráulico pero planta de compuestos no tiene material disponible en saca y las otras máquinas se encuentran consumiendo en línea."}, {"fecha": "2026-05-21", "turno": "Turno 3", "maquina": "E 70", "nave": "Nave 3", "observacion": "Se recibe operativa sin novedades iniciales. Posteriormente se descartan tubos por atascamiento de tubería en sierra. A las 19:10 se detiene para cambio de cabezal a tubo hidráulico. Matricería entrega a las 20:52 y posteriormente completa entrega de mordazas de sierra a las 21:10. Mantención queda pendiente por instalación de calefactores.\nCausa raíz: Cambio programado de cabezal y atascamiento en sistema de corte."}, {"fecha": "2026-05-21", "turno": "Turno 2", "maquina": "E 80", "nave": "Nave 3", "observacion": "Se da aviso a mtto por alta temperatura en tina de enfriamiento, mtto detecta filtración de agua en tubería de chiller de extrusion, sin detención de maquina."}, {"fecha": "2026-05-21", "turno": "Turno 1", "maquina": "E 80", "nave": "Nave 3", "observacion": "Al finalizar turno se corta línea por falta de compuesto desde el silo y planta de compuesto, ya que estamos realizando el consumo en línea."}, {"fecha": "2026-05-21", "turno": "Turno 3", "maquina": "E 80", "nave": "Nave 3", "observacion": "Se recibe detenida por falta de materia prima. Mientras se realiza recuperación de tubería se aplican temperaturas de trabajo a las 17:50. Se inicia operación a las 18:30 y normaliza a las 18:46.\nCausa raíz: Falta de abastecimiento de materia prima."}, {"fecha": "2026-05-21", "turno": "Turno 2", "maquina": "E 90", "nave": "Nave 1", "observacion": "A las 4:00 hrs baja presión de agua, se descartan tubos por vibrado."}, {"fecha": "2026-05-21", "turno": "Turno 1", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se descarta tubería por campana desfasada y tubería picada por sierra."}, {"fecha": "2026-05-21", "turno": "Turno 3", "maquina": "E 90", "nave": "Nave 1", "observacion": "Durante el turno se presenta un tercer evento asociado a flujo. Se corrige disminuyendo vacío del sistema. Posteriormente se realiza detención breve a las 17:50 para limpieza de calibrador, el cual viene generando residuos y rayas en tubería desde turnos anteriores. Línea queda normalizada a las 21:30.\nCausa raíz: Acumulación de residuos en calibrador e inestabilidad de vacío."}, {"fecha": "2026-05-21", "turno": "Turno 2", "maquina": "E 100", "nave": "Nave 2", "observacion": "Alas 3:30 hrs se detiene por presencia de ralla, se limpia  y se le da partida, descarte de 3 rollos en proceso, se trabaja con 100% scrap."}, {"fecha": "2026-05-21", "turno": "Turno 3", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se descarta rollo por marca de agua. Se ajusta manguera articulada corrigiendo condición.\nCausa raíz: Mala orientación/posición de manguera de enfriamiento."}, {"fecha": "2026-05-21", "turno": "Turno 2", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se detiene a las 02:00 por problema de temperatura de agua, mtto revisa chiller, se retoma nuevamente, posterior a ello a las 4:00 hrs se detiene nuevamente por baja presión de agua, mtto encuentra pozo con bajo nivel, se detiene con Aq , se espera que mtto entregue, se retoma nuevamente a las 5:30 hrs."}, {"fecha": "2026-05-21", "turno": "Turno 1", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se recibe con menor rendimiento, se sube a 412 kg/hr."}, {"fecha": "2026-05-21", "turno": "Turno 3", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se descarta tubería por incrustación y posterior pérdida de vacío en tina producto de la misma contaminación.\nCausa raíz: Incrustaciones en el material afectando vacío."}, {"fecha": "2026-05-21", "turno": "Turno 2", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de temporada."}, {"fecha": "2026-05-21", "turno": "Turno 1", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-21", "turno": "Turno 3", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-21", "turno": "Turno 2", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se trabaja con compuesto rechazado al 20% + cera."}, {"fecha": "2026-05-21", "turno": "Turno 1", "maquina": "E 130", "nave": "Nave 3", "observacion": "se detiene con anti quemante por cambio de producto/matriz, se entrega a matricería a las 08:05.\nparalelamente mantención revisa baja presión de agua hacia macho abocardador, ducto se encontraba tapado de 09:30 a 10:10.\nSe realiza cambio de gomas de tinas 1, 2 y 3, matricería entrega montaje de cabezal 10:50 hrs, se llama a mantención para conexión de calefactores de hembra, máquina se pone a calentar 11:20 hrs. Paralelo aun se trabaja en abocardado recibiendo 10:50 hrs para realizar pruebas, 11:30 se llama a mantención para regular sensor de cota carro con problemas de lectura, se cambia sensor quedando operativo 12:20, se realiza prueba  de abocardado quedando ok, se pone en temperaturas de trabajo al terminar calefacción 12:50, se realiza centrado y reapriete de hembra y se da partida 13:30 regularizando 14:30 hrs."}, {"fecha": "2026-05-21", "turno": "Turno 3", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se recibe operativa en proceso de normalización, realizándose corrección de excentricidad y mejora de biselado, estabilizando a las 15:22. Posteriormente se descartan tubos para recuperación debido a falla de puerta atascada, corrigiéndose mediante ajuste de sensor.\nCausa raíz: Desajuste de sensor en puerta de abocardado."}, {"fecha": "2026-05-21", "turno": "Turno 3", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se recupera tubería sin campana en máquina 80"}, {"fecha": "2026-05-21", "turno": "Turno 2", "maquina": "E 140", "nave": "Nave 3", "observacion": "Detenida por cambio de cámara y tornillo de coextrusora."}, {"fecha": "2026-05-21", "turno": "Turno 1", "maquina": "E 140", "nave": "Nave 3", "observacion": "Mantención entrega montaje de cámara y tornillo y matricería realiza montaje de cabezal, luego mantención conecta y revisa calefacción y encuentra transductor de presión de masa sin lectura, realiza cambio y entrega a las 14:30 hrs."}, {"fecha": "2026-05-21", "turno": "Turno 3", "maquina": "E 140", "nave": "Nave 3", "observacion": "Se recibe detenida y se aplican temperaturas de trabajo desde las 15:30. A las 16:00 se solicita reapriete a matricería y se inicia operación a las 16:20. La línea presenta rayas en parte superior de canaleta y problemas severos de corte. Mantención interviene por corte picado y sobrecalentamiento del motor de sierra. Se detecta exceso de peso en disco dentado generando sobreconsumo eléctrico, por lo que se instala disco diamantado; sin embargo, el defecto persiste. Se decide detener línea a las 17:28 para evitar generación de scrap, quedando con temperaturas apagadas.\nCausa raíz: Incompatibilidad/falla en sistema de corte y sobrecarga de motor de sierra."}, {"fecha": "2026-05-21", "turno": "Turno 2", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se recibe detenida, se retoma producción a las 23:00 hrs , se ajusta espesores y diámetro, a las 2:20 hrs de detiene maquina por alta temperatura de tina , mtto repara filtración de agua, se retoma nuevamente a las 3:00 hrs , posterior a ello a las 4:00 hrs se detiene maquina por que tina se queda sin agua esta sonando alarmas se llama a mantenimiento, encontrando pozo bajo nivel de agua, mtto trabaja en solución. se retoma nuevamente a las 5:00 hrs."}, {"fecha": "2026-05-21", "turno": "Turno 1", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se corta en una oportunidad"}, {"fecha": "2026-05-21", "turno": "Turno 3", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se recibe operativa. Durante el turno se descartan tubos sin pigmentar debido a manguera fuera de posición.\nCausa raíz: Desalineación de manguera de pigmentación."}, {"fecha": "2026-05-21", "turno": "Turno 2", "maquina": "E 160", "nave": "Nave 1", "observacion": "Detenida por cambio de abocardadora por parte de mtto."}, {"fecha": "2026-05-21", "turno": "Turno 1", "maquina": "E 160", "nave": "Nave 1", "observacion": "Detenida por mantención en cambio de abocardadora de M170"}, {"fecha": "2026-05-21", "turno": "Turno 3", "maquina": "E 160", "nave": "Nave 1", "observacion": "Detenida por cambio de abocardado por parte del área de proyectos"}, {"fecha": "2026-05-21", "turno": "Turno 2", "maquina": "E 180", "nave": "Nave 1", "observacion": "Al inicio de turno falla ensayo de impacto, se aplica CPE, se limpia vacío y se modifica perfil de temperatura, se corrige, posterior bien."}, {"fecha": "2026-05-21", "turno": "Turno 3", "m o material directo de los turbos, sin detenciones de maquina."}, {"fecha": "2026-05-22", "turno": "Turno 3", "maquina": "E 40", "nave": "Nave 1", "observacion": "Se descarta una hora de producción por reiteradas fallas de impacto. Durante revisión conjunta con mantenimiento se detecta que las 4 termocuplas del tornillo trabajaban con lectura incorrecta, generando temperaturas reales inferiores a las indicadas en sistema. Se realizan nuevas pruebas y ajustes antes de detener línea. Se entregan muestras a calidad, las cuales también fallan. Máquina queda detenida.\n\nCausa raíz: Des calibración térmica del sistema de calentamiento."}, {"fecha": "2026-05-22", "turno": "Turno 2", "maquina": "E 51", "nave": "Nave 2", "observacion": "Sin Producción heredada, Al inicio de turno ajuste en abocardadora por campanas con rechupe, se cambia de rack, se hace limpieza de vacío en 1 ocasión."}, {"fecha": "2026-05-22", "turno": "Turno 1", "maquina": "E 51", "nave": "Nave 2", "observacion": "Descarte por bisel disparejo del lado A y B, se detiene y se entrega a mantención (50 min), luego abocardadora no realiza traslado, mantención interviene (20 min)"}, {"fecha": "2026-05-22", "turno": "Turno 3", "maquina": "E 51", "nave": "Nave 2", "observacion": "Cambio de producto programado (color). Se generan descartes por campana mal conformada y desajustes en sierra. Posteriormente aparecen problemas de tonalidad y rugosidad interna, corrigiéndose mediante limpieza de vacío y ajustes operacionales.\n\nCausa raíz: Inestabilidad en abocardado y deficiencias en vacío/proceso interno."}, {"fecha": "2026-05-22", "turno": "Turno 2", "maquina": "E 60", "nave": "Nave 2", "observacion": "Se detiene por cambio de producto matricería interviene 23:25 entrega 00.05.mantencion entrega 00:10.se espera tiempo de calentamiento para partida y reapriete, se inicia 00:30 se deja estable 00:50.al momento de normalizar falla sensor de arrastre mantención asiste de 00:45 hasta 01:10 dejando en buenas condiciones."}, {"fecha": "2026-05-22", "turno": "Turno 2", "maquina": "E 60", "nave": "Nave 2", "observacion": "Descarte de tuberías sin campana, se realiza limpieza en sensor de abocardadora, posterior bien."}, {"fecha": "2026-05-22", "turno": "Turno 1", "maquina": "E 60", "nave": "Nave 2", "observacion": "Se corta en 2 oportunidades por choque de tubería en la sierra por pérdida de vacío, luego se suelta cilindro y no vuelve, mantención interviene (15 min)  detiene a las 14:30 hrs por raya de retención,"}, {"fecha": "2026-05-22", "turno": "Turno 3", "maquina": "E 60", "nave": "Nave 2", "observacion": "Se recibe detenida por raya de quemado. Tras intervención de matricería y mantenimiento, se detecta obstrucción de material entre dosificador y tornillo durante la partida. Más tarde se corrige falla en desplazamiento de horno, quedando línea estabilizada a las 19:00.\n\nCausa raíz: Acumulación de material en alimentación y descontrol térmico en abocardado."}, {"fecha": "2026-05-22", "turno": "Turno 2", "maquina": "E 70", "nave": "Nave 3", "observacion": "Se recibe detenida, en proceso de cambio de producto, pendiente instalación de  calefactores, mantención asiste a la máquina al inicio de turno entregando la máquina a las 23:40, se enciende temperatura de trabajo, se regula cierra, se regula mesa, se regula batea, se regula abocardadora, se hacen limpieza de aspersores, filtros  y vacío. Observando una falla en la batea por falta de agua se llama a mantención por falta de agua en la batea llegando a las 1:50, encontrando flotador con barro, entregando máquina a las 2:50, se llama a matricería a las 2:50 para reapriete completo de cabezal, entrega de máquina a las 3:15, se apagaron temperatura, se encienden nuevamente temperaturas a las 3:15, se inicia partida 3:50, se estabiliza a las 4:20, se instala tolva mobacolor quedando en 0,150 rpm logrando un buen acabado, se regula nuevamente abocardadora ya que la campana salía desfasada y doble campana, se regula mordaza de abocardado, se regula altura y se decide detener máquina a las 6:20 por incrustaciones. Se amarra saca y se deja máquina en purga de 130°."}, {"fecha": "2026-05-22", "turno": "Turno 1", "maquina": "E 70", "nave": "Nave 3", "observacion": "se recibe detenida, temperaturas en 130° por incrustaciones, se realiza limpieza de tolvas e imanes, luego se monta nueva saca y se da partida a las 10:00 hrs."}, {"fecha": "2026-05-22", "turno": "Turno 2", "maquina": "E 80", "nave": "Nave 3", "observacion": "Se trabaja con material directo de turbos, en línea, descarte de 4 unidades por cambio de tonalidad, posterior bien."}, {"fecha": "2026-05-22", "turno": "Turno 2", "maquina": "E 90", "nave": "Nave 1", "observacion": "Corte de línea en 2 ocasiones, tubería de pincha por raya de impureza, se retoma producción nuevamente."}, {"fecha": "2026-05-22", "turno": "Turno 1", "maquina": "E 90", "nave": "Nave 1", "observacion": "Descarte de tubería por marcas exteriores, luego a las 14:25 hrs se corta línea por raya interna, se descentra y luego bien"}, {"fecha": "2026-05-22", "turno": "Turno 3", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se realizan ajustes por desfase de campana, logrando estabilizar condición. Posteriormente se detiene línea para recuperación de tubos sin campana.\n\nCausa raíz: Desajuste en parámetros de abocardado."}, {"fecha": "2026-05-22", "turno": "Turno 2", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se detiene para cambio de malla a las 02:20 y se parte a las 02:40, cambio de malla en 3 ocasiones encontrando trozos de zunchos, a las 6:45 hrs se entregara detenida ya que pistón que mueve la pieza del filtro no tiene fuerza para moverse a la velocidad normal, demorando el proceso de cambio de malla mas de lo normal"}, {"fecha": "2026-05-22", "turno": "Turno 1", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se recibe detenida por incrustaciones y cilindro del intercambiador abierto, se aprovecha detención y se define realizar cambio de producto, luego entregan y durante la partida se corta en 2 oportunidades por falla en sierra, mantención interviene (70 in)"}, {"fecha": "2026-05-22", "turno": "Turno 3", "maquina": "E 100", "nave": "Nave 2", "observacion": "Producción heredada"}, {"fecha": "2026-05-22", "turno": "Turno 3", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se recibe detenida por incrustaciones. Luego de cambio de mallas, persiste inestabilidad dimensional (bajo diámetro), requiriendo intervención de matricería para cambio de calibrador. Línea logra estabilizarse posterior al reemplazo.\n\nCalibrador saliente: 66,8\nCalibrador entrante: 66,2\n\nCausa raíz: Contaminación interna y desgaste/desajuste de calibrador."}, {"fecha": "2026-05-22", "turno": "Turno 1", "maquina": "E 110", "nave": "Nave 2", "observacion": "Sale vibrado en una oportunidad, se detiene se realiza limpieza de aspersores, luego descarte por raya, flujo, después se revisa y se visualizas mangueras articuladas se encuentran sin agua. Mantención interviene"}, {"fecha": "2026-05-22", "turno": "Turno 3", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se descartan tubos por incrustación y presencia de grumos en material. Se realiza limpieza de vacío y ajuste de perfil térmico del tornillo, logrando estabilizar condición antes del cierre de jornada.\n\nCausa raíz: Contaminación/inestabilidad térmica en plastificación."}, {"fecha": "2026-05-22", "turno": "Turno 2", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de temporada."}, {"fecha": "2026-05-22", "turno": "Turno 1", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-22", "turno": "Turno 3", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-22", "turno": "Turno 2", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se trabaja con 10% de compuesto rechazado."}, {"fecha": "2026-05-22", "turno": "Turno 1", "maquina": "E 130", "nave": "Nave 3", "observacion": "Descar ": "2026-05-24", "turno": "Turno 2", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se hace limpieza de bomba de vacío, aspersores y calibrador, se inicia 20:30 queda operativa 21:00, se corta la  línea x alta T°DZ3, a las 3:00 hrs mantención interviene se descartan tubos por flujo, Se revisa problema de sobre temperatura en la zona 3 del cabezal,  se revisa estado del relé de estado solido y estado del calefactor no encontrando nada anormal, se realiza cambio de termocupla para descartar una mala lectura, pero la condición persistía. Se revisa datos de controlador de temperatura de la zona y se detecta que estaba ingresado erróneamente el dato de termocupla tipo K,  se normaliza el dato a tipo J, equipo queda operativo, se retoma nuevamente producción a las 4:30 hrs"}, {"fecha": "2026-05-24", "turno": "Turno 3", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se recibe produciendo en condiciones estables.\nDurante el turno se descartan 15 tubos por impurezas y perforaciones.\n\nCausa raíz: Contaminación de material/proceso."}, {"fecha": "2026-05-24", "turno": "Turno 2", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se recibe con temperaturas encendidas de las 17:30 se hace limpieza de aspersores de primera batea y de corona de calibrador se hace limpieza de vacío y filtros de agua se inicia purga con AQ a las 20:30 iniciando partida a las 20:40 quedando estable a las 21:30 , descarte de tuberías por campanas mal conformadas, se modifica parámetros de tiempo y temperatura en abocardadora, debido a temperatura ambiente , asimismo de solicita a mtto revisión de puerta de abocardadora, movimientos irregulares de levante de puerta, mtto refiere que no tiene mas regulación cilindros neumáticos, posterior a ello a las 04:10 tolva de alimentación se queda sin material, se corta línea, sin acusar alarma , se solicita a mtto revisión, queda pendiente instalación de baliza sonora en tolva principal y se vuelve a colocar guía se reinicia partida a las 04:40 maquina queda estable a las 04:55, a las 6:40 hrs se baja rendimiento por problema en oruga de arrastre de abocardadora, se informa turno entrante para atención de mtto."}, {"fecha": "2026-05-24", "turno": "Turno 3", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se recibe (sin producción heredada), con problemas en oruga de arrastre del abocardado, encontrándose suelta y con sensor desplazado, generando falsa lectura y tubos sin campana.\nPosteriormente comienza a presentar campana con rechupete asociado a golpe en brida. Se realizan ajustes de cota carro y temperatura, logrando estabilizar parcialmente a las 07:40 hrs.\nLa condición reaparece, por lo que se solicita apoyo a matricería a las 09:10 hrs para intervención sobre brida. Matricería entrega línea a las 11:07 hrs. Posteriormente se realiza recuperación de tubería, se da temperatura de trabajo a las 13:40 hrs y se reinicia línea a las 13:50 hrs, normalizando a las 14:30 hrs.\n\nMás tarde, calidad solicita mejoras por falla reiterativa en prueba de impacto (1/5). Se revisa vacío de extrusora, temperaturas y dosificación. Se incrementa porcentaje de modificador de impacto y se recentra línea para trabajar espesores entre 3.5 y 3.6 mm.\nDurante los ajustes reaparece campana con rechupete, por lo que se vuelve a modificar condición operacional, estabilizando finalmente entre espesores 3.3 y 3.4 mm.\nAdicionalmente se realiza cambio de goma por nicho redondo, quedando línea estable a las 16:50 hrs.\n\nCausa raíz: Desgaste mecánico en sistema de abocardado/brida e inestabilidad térmica-dimensional del proceso."}, {"fecha": "2026-05-24", "turno": "Turno 2", "maquina": "E 140", "nave": "Nave 3", "observacion": "Al inicio de turno mtto trabaja en motor de sierra, Se realiza revisión del sistema eléctrico de la sierra debido a que el módulo de seguridad presentaba falla, impidiendo la partida del motor. Se revisa el sistema de seguridad y conexiones del motor, sin encontrar anomalías, Posteriormente, se realiza prueba de funcionamiento del motor con voltaje directo, verificando operación normal. Se procede a instalar un guardamotor de 2,5 a 4 A, quedando regulado en 3,2 A, permitiendo que el motor trabaje de manera directa. Se realizan pruebas en vacío, mtto solicita calentar maquina para hacer pruebas con maquina andando,  se enciende temperatura de trabajo a las 9:30 se espera tiempo de calentamiento se inicia purga 22:50 se inicia partida a las 23:00 quedando estable a las 23:30 mantención regula sierra quedando estable de igual manera, a las 6:00 hrs se detiene maquina por falla en sistema de alimentación en extrusor, mtto interviene, revisan sistema de carga de material, queda pendiente entrega de equipo por parte de mtto."}, {"fecha": "2026-05-24", "turno": "Turno 3", "maquina": "E 140", "nave": "Nave 3", "observacion": "Se recibe detenida realizando limpieza de blower.\nSe da temperatura de trabajo a las 07:20 hrs e inicia producción a las 07:50 hrs, sin lograr normalizar debido a presencia de dos rayas en producto. Se detiene línea y se solicita apoyo a matricería, ya que la condición no desaparece utilizando antiquemante.\nMatricería entrega a las 09:00 hrs y posteriormente mantenimiento realiza conexión de calefactores, entregando línea a las 09:30 hrs.\nSe reinicia producción a las 09:50 hrs, normalizando a las 10:00 hrs.\nDurante el turno se descartan canales en algunas ocasiones por desgarro en pestaña, además, se realizan diversos ajustes por extremos picados en el corte, se observa que al mantener la apertura de la canaleta ajustada (107,2 mm. Medida referencial), el corte logra corregirse (SE OBSERVA DESGASTE EN GUÍA DE CORTE INFERIOR).\n\nCausa raíz: Problemas en herramental y contaminación/rayas en proceso de extrusión y desgaste de guías de corte."}, {"fecha": "2026-05-24", "turno": "Turno 2", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se coloca temperatura de trabajo ya que estaban en 140 y las de las coextrusiona se encontraban apagadas, edando normalizada a las 05:30 hrs."}, {"fecha": "2026-05-25", "turno": "Turno 3", "maquina": "E 51", "nave": "Nave 2", "observacion": "Se descartan tubos por falla de impacto en tres oportunidades durante el turno.\nSe realizan ajustes de perfil térmico y limpieza profunda del sistema de vacío, sin lograr estabilizar resultados de impacto.\nA las 13:20 hrs se detiene línea para revisión completa de calefactores y termocuplas, a las espera de confirmación por parte de mantención.\n\nCausa raíz probable: Desviación térmica en calefacción y control de temperatura del proceso."}, {"fecha": "2026-05-25", "turno": "Turno 2", "maquina": "E 51", "nave": "Nave 2", "observacion": "Se recibe detenida, mantencion entrega revision de temperaturas completa a las 15:15hrs, sin encontrar ninguna desviacion. Se coloca en temperatura de trabajo, se da partida estable a las 16:15hrs, se trabaja con 0.700RPM de modificador de impacto,  pruebas de impacto salen ok"}, {"fecha": "2026-05-25", "turno": "Turno 1", "maquina": "E 60", "nave": "Nave 2", "observacion": "Se descartan tubos debido a presencia de manchas de material quemado en el producto. Se realizan mejoras y ajustes en el proceso, quedando en monitoreo a la espera de resultados y estabilización de la condición. Se solicita intervención de mantención para revisión de calefactores. Se procede a detener la máquina con anti quemante, Posteriormente, se realiza extracción de material desde la tolva con el fin de limpiar y eliminar material degradado, el cual es devuelto al área de compuesto,  mantención realiza revisión completa al sistema de calefactores. Además, se efectúa extracción de concho para su descarte y se vacía la tolva debido al material se degradaba en el proceso. se da inicio nuevamente a la partida de máquina, realizando cambio de perfiles de temperatura y se harán ajustes graduales de espesores y demás parámetros de proceso para alcanzar el estándar establecido"}, {"fecha": "2026-05-25", "turno": "Turno 3", "maquina": "E 60", "nave": "Nave 2", "observacion": "Cambio programado (dimensional)"}, {"fecha": "2026-05-25", "turno": "Turno 2", "maquina": "E 60", "nave": "Nave 2", "observacion": "20:30hrs se detiene por presentar problemas en la abocardadora, se rompe cilindro del horno, mantencion interviene y entrega a las 21:45hrs, maquina se entrega con temperaturas apagadas"}, {"fecha": "2026-05-25", "turno": "Turno 1", "maquina": "E 70", "nave": "Nave 3", "observacion": "Durante la partida se solicita a mantención revisar sistema de carga, no enciende PLC del cargador en automático, sin solución de mantención. 21:30 se vacía tolva de extrusor, mantención interviene hasta las 23:30 dejando cargador en manual por falla en plc, se mantiene cargando con pulsador de rosco de forma manual en el resto del turno"}, {"fecha": "2026-05-25", "turno": "Turno 3", "maquina": "E 70", "nave": "Nave 3", "observacion": "Se detiene a las 09:00 por mantención programada."}, {"fecha": "2026-05-25", "turno": "Turno 2", "maquina": "E 70", "nave": "Nave 3", "observacion": "Mantencion correctiva"}, {"fecha": "2026-05-25", "turno": "Turno 1", "maquina": "E 80", "nave": "Nave 3", "observacion": "Se separa tubería sin impresión por falla de 3 impresoras, además de otras que ya se encontraban en falla."}, {"fecha": "2026-05-25", "turno": "Turno 1", "maquina": "E 90", "nave": "Nave 1", "observacion": "En 2 oportunidades pierde vacío la tina, luego múltiples rayas de calibrador, se decide detener máquina para limpieza de aspersores de la corona (45 min)"}, {"fecha": "2026-05-25", "turno": "Turno 3", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se recibe operativa con desface en campana.\nSe realizan correcciones de ajuste quedando estable. Posteriormente se descartan tubos por pérdida de vacío en línea durante limpieza de rayas de calibrador.\n\nCausa raíz: tendencia a formación de una película de material en el calibrador."}, {"fecha": "2026-05-25", "turno": "Turno 2", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se realiza cambio de color"}, {"fecha": "2026-05-25", "turno": "Turno 2", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se detiene con antiquemante, se limpia tolva por cambio de color, se da partida estable"}, {"fecha": "2026-05-25", "turno": "Turno 1", "maquina": "E 100", "nave": "Nave 2", "observacion": "Al inicio arroja falla del VDF (falla convertidor, código de error 00), mantención interviene sin solución hasta que realiza modificación de parámetros en VDF salida de voltaje de motor (22:00 a 02:50 hrs), posteriormente se produce falla eléctrica en enrollador 1, mantención interviene (20 min). Se da partidas a las 03:30 hr y se mantiene consumiendo scrap 100% con tornillo a máxima revolución alcanzando 184 Kg/hr."}, {"fecha": "2026-05-25", "turno": "Turno 3", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se recibe sin producción heredada. Se trabaja estable durante todo el turno, pero con un 60% de rendimiento por consumo de scrap (tornillo extrusor a máxima capacidad)"}, {"fecha": "2026-05-25", "turno": "Turno 2", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se realiza cambio de mallas, al momento de partida no se logra normalizar por marcas de agua, se trabaja al 100% de scrap molido"}, {"fecha": "2026-05-25", "turno": "Turno 1", "maquina": "E 110", "nave": "Nave 2", "observacion": "Descarte por tubería vibrada."}, {"fecha": "2026-05-25", "turno": "Turno 3", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se recibe con problemas de vacío debido a bomba con falla, generando descarte por burbujas.\nA las 08:00 hrs se detiene línea.\nMatricería interviene entre 08:10 y 08:20 hrs.\nMantención trabaja entre 08:00 y 10:00 hrs realizando cambio de bomba de vacío. Paralelamente se ejecuta reemplazo de termocupla zona 5 del tornillo y zonas 1 y 3 del cabezal.\nEquipo es entregado a las 10:10 hrs.\nSe inicia partida a las 10:30 hrs, normalizando proceso a las 11:00 hrs.\n\nCausa raíz: Falla de bomba de vacío y desviación térmica por termocuplas defectuosas."}, {"fecha": "2026-05-25", "turno": "Turno 3", "maquina": "E 110", "nave": "Nave 2", "observacion": "Cambio programado (dimensional)"}, {"fecha": "2026-05-25", "turno": "Turno 2", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se realiza cambio dimensional"}, {"fecha": "2026-05-25", "turno": "Turno 2", "maquina": "E 110", "nave": "Nave 2", "observacion": "Fallan pruebas de impacto se rechaza 1 hora de produccion, se coloca modificador de impacto ya que estaba apagado, se corta en 4 ocaciones por chocar tuberia con bin en final de linea, se le informa a operadores para mejorar esta condicion. A las 21:35hrs vuelve a fallar pruebas de impacto, se descartan tuberias y se detiene con antiquemante, se deja en purga"}, {"fecha": "2026-05-25", "turno": "Turno 1", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-25", "turno": "Turno 3", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-25", "turno": "Turno 2", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera temporada"}, {"fecha": "2026-05-25", "turno": "Turno 2", "maquina": "E 130", "nave": "Nave 3", "observacion": "En 3 ocasiones se tapa sistema de vacio en extrusora, se entrega muestra de material a control y calidad, teniendo exceso de carbonato, exceso de estabilizante, se modifica perfil de temperaturas y se sube dosificacion de material, se normaliza."}, {"fecha": "2026-05-25", "turno": "Turno 1", "maquina": "E 140", "nave": "Nave 3", "observacion": "Se mantiene aceptada por calidad con máximo aceptado."}, {"fecha": "2026-05-25", "turno": "Turno 2", "maquina": "E 140", "nave": "Nave 3", "observacion": "Se detiene para limpieza de dos primeras placas por rayas exterior, se da partida nuevamente y se normaliza"}, {"fecha": "2026-05-25", "turno": "Turno 1", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se realizan ajustes por tubería vibrada."}, {"fecha": "2026-05-25", "turno": "Turno 1", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se recibe maquina operativa con persistente vibrado en el lado A y B, al no poder regular, se procede a la detención a las 12:00am y se entrega a matricería para limpieza de calibrador y cambio de gomas de la salida de la tina, además se observa que aspersores que se encuentran al interior del acrílico se encuentran obstruidos, matricería desarma y realiza limpieza, por nuestra parte realizamos limpieza de aspersores, by pass y filtros de ambas tinas, luego se prepara guía y se da nueva partida a las 02:20 hrs."}, {"fecha": "2026-05-25", "turno": "Turno 1", "maquina": "E 160", "nave": "Nave 1", "observacion": "COMISIONAMIENTO: Se mantiene detenida por mantención, pendiente la entrega formal, capacitación y pruebas de la abocardadora. Se entrega calentando en 100°C."}, {"fecha": "2026-05-25", "turno": "Turno 3", "maquina": "E 160", "nave": "Nave 1", "observacion": "COMISIONAMIENTO: Continúa detenida por proyecto.\nMantención realiza ajustes en correa de polines de arrastre y retiro de tapa para mejorar paso de tubos.\nSe solicita a matricería cambio completo de gomas de tina y a mantención cambio de las cuatro cuchillas.\nA las 10:40 hrs se da partida para pruebas y ajustes de mesa de abocardado , no de logra estabilizar.\nLínea se detiene nuevamente a las 13:00 hrs."}, {"fecha": "2026-05-25", "turno": "Turno 2", "maquina": "E 160", "nave": "Nave 1", "observacion": "COMISIONAMIENTO: persiste problemas en abocardadora, pruebas quedan para siguiente turno"}, {"fecha": "2026-05-25", "turno": "Turno 3", "maquina": "E 180", "nave": "Nave 1", "observacion": "Se descartan tubos por falla en prueba de impacto y rugosidad interna.\nSe realiza limpieza completa del sistema de vacío del extrusor.                                                                                                                                   Causa raíz: Contaminación/problemas de vacío asociados a rugosidad interna y desviación en propiedades mecánicas."}, {"fecha": "2026-05-25", "turno": "Turno 3", "maquina": "E 180", "nave": "Nave 1", "observacion": "A las 13:15 hrs se detiene línea para cambio de producto.\nMatricería entrega a las 13:30 hrs.\nSe inicia nuevamente a las 14:00 hrs."}, {"fecha": "2026-05-25", "turno": "Turno 2", "maquina": "E 180", "nave": "Nave 1", "observacion": "Se detiene con antiquemante por material degradado, matriceria baja postizo para limpieza por retencion de material (30min), se saca resto de material que queda en tolva por el problema de degradacion, se cambia de saca normalizando luego de 60min, se descartan tuberia por falta de pigmento, rayas blancas, 2 siguiente sacas se comportan con tuberia con desgarro"}], "demo": false, "real": true}, {"id": "2026-05-26_2026-05-26", "desde": "2026-05-26", "hasta": "2026-05-26", "importedAt": "2026-05-26T00:00:00.000Z", "turnos": {"Turno 1": {"jefePlanta": "Ivan Jerez", "kilos": 30598.31262, "sobrepeso": 0.004282398423128659, "scrap": 3878, "std": 41400.0, "eficiencia": 0.7390896768115942, "causas": {"PR": 232, "MP": 388, "MT": 0, "MN": 744, "C": 0, "PROY": 147, "P": 31}, "naves": {"Nave 1": {"encargado": "Por definir", "maquinas": [{"maquina": "E 30", "std": 1980.0000000000002, "prod": 1980.00792, "scrap": 81, "sobrepeso": -0.08133700798530134, "causas": {"PR": 0, "MP": 0, "MT": 0, "MN": 0, "C": 0, "PROY": 0, "P": 0}}, {"maquina": "E 40", "std": 2880, "prod": 2339.4084000000003, "scrap": 214, "sobrepeso": 0.01166602633383714, "causas": {"PR": 34, "MP": 67, "MT": 0, "MN": 0, "C": 0, "PROY": 0, "P": 0}}, {"maquina": "E 90", "std": 2250.0000000000005, "prod": 1740.56064, "scrap": 178, "sobrepeso": -0.06825423789888753, "causas": {"PR": 22, "MP": 100, "MT": 0, "MN": 0, "C": 0, "PROY": 0, "P": 0}}, {"maquina": "E 150", "std": 2700, "prod": 2700.126, "scrap": 54, "sobrepeso": 0.025641025641025644, "causas": {"PR": 0, "MP": 0, "MT": 0, "MN": 0, "C": 0, "PROY": 0, "P": 0}}, {"maquina": "E 160", "std": 4500, "prod resetea VDF y paralelamente matriceríabajan hembras para liberar  presión  logrando liberar el material quemado  con purga. Se pulen hembras y se monta nuevamente quedando ok (2:45 hrs a3:12 hrs)"}, {"fecha": "2026-05-27", "turno": "Turno 3", "maquina": "E 30", "nave": "Nave 1", "observacion": "Se recibe operativa, pero rack queda retenido debido a que tubería lado B sale con 10 cm menos de largo. Posteriormente, tubos del lado A comienzan a atascarse en sierra producto de resorte de rodamiento de apoyo que queda abajo interfiriendo el paso de tubería. Se detiene línea a las 08:55 y se solicita apoyo de mantención. Mantención entrega equipo y se realizan ajustes de guía antes de sierra, dando partida a las 09:55. Más tarde, lado A presenta material quemado, detectándose temperatura real de 224°C con seteo de 170°C. Eléctrico revisa y encuentra calefactores de zonas 7 y 9 invertidos. Se descarta tubería afectada y posteriormente línea queda estable.\nCausa raíz: Falla mecánica en apoyo de sierra y conexión incorrecta de calefactores."}, {"fecha": "2026-05-27", "turno": "Turno 2", "maquina": "E 30", "nave": "Nave 1", "observacion": "Se recibe turno con la maquina 30 con las campanas florecidas y en ocasiones campanas cortas se ajusta temperatura del Horno. Tiempo de calentamiento y se ajusta Mordaza. Quedando Ok!"}, {"fecha": "2026-05-27", "turno": "Turno 1", "maquina": "E 40", "nave": "Nave 1", "observacion": "Ajuste por sobre peso alto bajando de 9,8% a 0,54%"}, {"fecha": "2026-05-27", "turno": "Turno 3", "maquina": "E 40", "nave": "Nave 1", "observacion": "Se recibe operativa. A las 08:20 se detecta falla en abocardado: mordaza superior no sube correctamente y tubería queda pegada en macho. Tras pruebas y ajustes se decide detener línea a las 08:38 y solicitar intervención de mantención. Paralelamente se detecta falla en impresora y falta de cabezales disponibles. Mantención entrega abocardado a las 09:26, aumentando presión del sistema hidráulico. Se realiza recuperación de tubería y se da partida nuevamente a las 09:40.\nCausa raíz: Baja presión hidráulica en sistema de abocardado."}, {"fecha": "2026-05-27", "turno": "Turno 2", "maquina": "E 40", "nave": "Nave 1", "observacion": "A las 16:30 hrs se detiene ya que presenta raya interna se llama a matricería para que realicen limpieza, bajando postizo, Se limpia vacío y se da inicio nuevamente a producción dejando estable maquina 17:20"}, {"fecha": "2026-05-27", "turno": "Turno 1", "maquina": "E 51", "nave": "Nave 2", "observacion": "Calidad solicita mejora por ensayo de impacto 1/9."}, {"fecha": "2026-05-27", "turno": "Turno 1", "maquina": "E 51", "nave": "Nave 2", "observacion": "Se entrega cambiado a 1 mt"}, {"fecha": "2026-05-27", "turno": "Turno 3", "maquina": "E 51", "nave": "Nave 2", "observacion": "Se descarta tubería por falla de impacto. Se retira material correspondiente al lote del 26-05-2026 y se reemplaza por material del 27-05-2026, normalizando posteriormente las pruebas de impacto.\nCausa raíz: Condición deficiente del lote de materia prima utilizado anteriormente."}, {"fecha": "2026-05-27", "turno": "Turno 2", "maquina": "E 51", "nave": "Nave 2", "observacion": "Al inicio de turno falla impacto, se realiza limpieza de bomba de vacío , calidad acepta producción, se trabaja con 150rpm de CPE, posterior a ello se realiza prueba quitando CPE, fallando ensayos 4 de 7 muestras, se retoma nuevamente consumo de modificador de impacto."}, {"fecha": "2026-05-27", "turno": "Turno 1", "maquina": "E 60", "nave": "Nave 2", "observacion": "Descarte de tubos por choque de tubería en la sierra. Posteriormente, se reanuda la producción a las 11:45 sin inconvenientes y se ajustan parámetros para estabilizar el proceso, luego se detiene y se entrega a matricería para cambio de perno centrador por encontrarse dañado, en el cabezal debido a excentricidad alta"}, {"fecha": "2026-05-27", "turno": "Turno 1", "maquina": "E 70", "nave": "Nave 3", "observacion": "Mantención Preventiva."}, {"fecha": "2026-05-27", "turno": "Turno 3", "maquina": "E 70", "nave": "Nave 3", "observacion": "Mantención Preventiva."}, {"fecha": "2026-05-27", "turno": "Turno 2", "maquina": "E 70", "nave": "Nave 3", "observacion": "Mantenimiento Preventivo."}, {"fecha": "2026-05-27", "turno": "Turno 3", "maquina": "E 80", "nave": "Nave 3", "observacion": "Se recibe operativa, pero con problemas de corte en sierra. Se retiran tapas del costado de planetario y se realiza limpieza con soplado por exceso de viruta acumulada. Se descartan 6 tubos entre las 07:10 y 07:40. Posteriormente línea queda normalizada.\nCausa raíz: Acumulación excesiva de viruta en sistema de corte."}, {"fecha": "2026-05-27", "turno": "Turno 1", "maquina": "E 90", "nave": "Nave 1", "observacion": "Trabaja estable al 90%, ya que al estirar pierde vacío, se sugiere hacer PPO al 100%"}, {"fecha": "2026-05-27", "turno": "Turno 3", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se recibe operativa. Durante el turno se descartan tubos en dos oportunidades por desface de campana. Luego condición queda estabilizada.\nCausa raíz: Desajuste de parámetros en abocardado."}, {"fecha": "2026-05-27", "turno": "Turno 2", "maquina": "E 90", "nave": "Nave 1", "observacion": "Presenta flujo a las 18:15 cortándose línea en reiteradas ocasiones además se regula avances de sierra y adelantamiento de  la misma también se regula medida de carro por que al cortar línea se tranca o se estira dejando estable a las 18.45"}, {"fecha": "2026-05-27", "turno": "Turno 1", "maquina": "E 100", "nave": "Nave 2", "observacion": "Un rollo descartado por quiebre, se mantiene estable al 66% consumiendo scrap 100%"}, {"fecha": "2026-05-27", "turno": "Turno 3", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se recibe sin producción heredada y bajo rendimiento por consumo de scrap"}, {"fecha": "2026-05-27", "turno": "Turno 3", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se detiene línea y se entrega a matricería a las 08:40 para cambio completo de matriz. Luego de que matricería retira el cabezal se comienza con la purga a las 11:00 hrs. Durante la intervención se realiza limpieza de aspersores, tolva de dosificación, silo, tolva de alimentación, mallas, tejos y filtros de tina. Se deja coextrusora purgada con pigmento rojo y a las 11:00 queda en purga para eliminar restos de polietileno de alta densidad. A las 13:30 se solicita nuevamente a matricería para montaje de herramental del nuevo producto. Se deja guía instalada, además de sierra y oruga listas. Queda pendiente instalación de mesa abocardadora para partida de turno entrante.\nCausa raíz: Cambio de producto y contaminación residual de material anterior."}, {"fecha": "2026-05-27", "turno": "Turno 2", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se recibe detenida por cambio de producto, matricería entrega  a las 18:10 armado completo  se llama a mantención  para conexión de calefactores entregando a las 18:30 se pone temperatura de trabajo cumpliendo a las 20:10 y  se inicia partida  saliendo  manchas negras  se detiene y se limpia tejos de filtros nuevamente,  Quedando estable alas 21:10 diámetro en 40.6."}, {"fecha": "2026-05-27", "turno": "Turno 1", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se recibe en proceso de ajuste, se tapa vacío , se corta línea, se limpia sistema de vacío y descarte por raya de calibrador con PVC alojado en ranuras de refrigeración."}, {"fecha": "2026-05-27", "turno": "Turno 2", "maquina": "E 110", "nave": "Nave 2", "observacion": "Al inicio de turno falla ensayo de impacto, se limpia sistema de vacío, en la limpieza se descartan tuberías por porosidad interior, se realiza prueba quitando CPE en línea, sin resultados satisfactorios en ensayo de impacto, fallan 4 de 7 muestras, se retoma consumo de CPE, 150rpm cumple ensayos de impacto."}, {"fecha": "2026-05-27", "turno": "Turno 1", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-27", "turno": "Turno 3", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-27", "turno": "Turno 2", "maquina": "E 120", "nave": "Nave 3", "observacion": "Mantenimiento Preventivo"}, {"fecha": "2026-05-27", "turno": "Turno 1", "maquina": "E 130", "nave": "Nave 3", "observacion": "se corta línea y se lleva guía por quedar sin material  2 veces 00:20, se monta guía y se da partida nuevamente, se llama a mantención 00:40 para revisar funcionamiento de sensores y conectar alarma con baliza. Se termina el material blanco y se realiza cambio a sanitario gris."}, {"fecha": "2026-05-27", "turno": "Turno 2", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se limpia filtro ciclónico en reiteradas ocasiones, se trabaja con un solo tramo de filtro ciclónico, proyectos informa que mañana se reparara sistema, se trabaja con gris claro, se visualiza material semi grano en tornillo, material pasa hacia el vacío, se necesita realizar limpieza de manera continua, maquina trabaja sin CPE en línea, cumple ensayos de impacto."}, {"fecha": "2026-05-27", "turno": "Turno 2", "maquina": "E 140", "nave": "Nave 3", "observacion": "En una ocasión material de devuelve por vacío de extrusora, se modifica perfil de temperatura y se prueba con una saca nueva, posterior bien."}, {"fecha": "2026-05-27", "turno": "Turno 1", "maquina": "E 150", "nave": "Nave 1", "observacion": "Sin Novedad, solo que no aparece reflejada en pantalla de monitoreo."}, {"fecha": "2026-05-27", "turno": "Turno 3", "maquina": "E 150", "nave": "Nave 1", "observacion": "A las 08:15 se detiene por cambio de producto. Matricería interviene y posteriormente se realiza conexión de calefactores en punta, limpieza de filtros y aspersores primarios. Se instala guía y se espera calentamiento, pero por contingencias en otras líneas la partida se retrasa hasta las 11:20. Se realiza centrado inicial y línea queda normalizada a las 12:30, descartándose tubería por vibrado y bajo diámetro dura // Pareto clásico: columnas ordenadas (eje izq. = minutos) + curva de % acumulado (eje der. = 0–100 %) alineados.

    const isVital=prevRun/total<.8; if(isVital) vital++;
    const cx=padL+slot*(i+.5), x=cx-bw/2, top=yP(share), bh=Math.max(0,base-top), r=Math.min(7,bw/2,bh);
    defs+=`<linearGradient id="${uid}${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(${it.var})"/><stop offset="1" style="stop-color:var(${it.var});stop-opacity:.58"/></linearGradient>`;
    const tip=`${it.label}|${fmtInt(it.val)} min · ${(share*100).toFixed(0)}% del total|Acumulado: ${(cum*100).toFixed(0)}%`;
    const d=bh<=0.5?'':`M${x.toFixed(1)},${base.toFixed(1)} L${x.toFixed(1)},${(top+r).toFixed(1)} Q${x.toFixed(1)},${top.toFixed(1)} ${(x+r).toFixed(1)},${top.toFixed(1)} L${(x+bw-r).toFixed(1)},${top.toFixed(1)} Q${(x+bw).toFixed(1)},${top.toFixed(1)} ${(x+bw).toFixed(1)},${(top+r).toFixed(1)} L${(x+bw).toFixed(1)},${base.toFixed(1)} Z`;
    const inside=bh>=28;
    bars+=`<g class="pbar tip-el" data-tip="${esc(tip)}" opacity="${isVital?1:.55}">`+(d?`<path d="${d}" fill="url(#${uid}${i})" style="--d:${i*70}ms"/>`:'')
      +`<rect x="${(cx-slot/2).toFixed(1)}" y="${padT}" width="${slot.toFixed(1)}" height="${plotH}" fill="transparent"/>`
      +(it.val>0?`<text x="${cx.toFixed(1)}" y="${(inside?top+16:top-6).toFixed(1)}" font-size="${(narrow?9:11)-(fmtInt(it.val).length>=7?1.5:0)}" font-weight="800" text-anchor="middle" fill="${inside?'var(--on-bar)':'var(--ink)'}">${fmtInt(it.val)}</text>`:'')+`</g>`;
    if(narrow){ const fs=mobile?10:10.5, lx=(cx+3).toFixed(1), ly=(base+14).toFixed(1);
      xl+=`<text x="${lx}" y="${ly}" font-size="${fs}" font-weight="600" fill="var(--viz-secondary)" text-anchor="end" transform="rotate(-40 ${lx} ${ly})">${esc(CAUSA_MED[it.code]||it.label)}</text>`;
    } else { const lines=twoLines(it.label);
    xl+=`<text x="${cx.toFixed(1)}" y="${(base+17).toFixed(1)}" font-size="11" font-weight="600" text-anchor="middle" fill="var(--viz-secondary)">${esc(lines[0])}</text>`+(lines[1]?`<text x="${cx.toFixed(1)}" y="${(base+30).toFixed(1)}" font-size="11" font-weight="600" text-anchor="middle" fill="var(--viz-secondary)">${esc(lines[1])}</text>`:''); }
    if(it.val>0) dots.push([cx,yP(cum),cum]);
  });
  const curve=smoothPath(dots.map(p=>[p[0],p[1]]));
  const dotSvg=dots.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.6" fill="var(--yellow)" stroke="var(--ink)" stroke-width="1.6"/>`
    +(!(i>0&&dots[i-1][2]>=.995)?`<text x="${p[0].toFixed(1)}" y="${(p[1]-10).toFixed(1)}" font-size="${mobile?9.5:10.5}" font-weight="800" text-anchor="middle" fill="var(--ink)" stroke="var(--card)" stroke-width="3" paint-order="stroke">${Math.round(p[2]*100)}%</text>`:'')).join('');
  const top1=items[0], vitalPct=Math.round(items.slice(0,vital).reduce((s,i)=>s+i.val,0)/total*100);
  const aria=`Pareto de causas de pérdida. Principal: ${top1.label}, ${Math.round(top1.val/total*100)}% de ${fmtInt(total)} minutos. ${vital} causas concentran ${vitalPct}%.`;
  const foot=`<div class="pareto-foot"><span class="chip"><b>${vital} ${vital===1?'causa concentra':'causas concentran'}</b> el ${vitalPct}% de los minutos perdidos</span><span>Principal: <b>${esc(top1.label)}</b> (${Math.round(top1.val/total*100)}%)</span></div>`;
  return `<div class="pareto-wrap"><svg class="svg-chart" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(aria)}"><defs>${defs}</defs>${grid}${bars}<g class="pline"><path d="${curve}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>${dotSvg}</g>${xl}</svg>${foot}</div>`;
}

// Traduce minutos perdidos a un estimado de impacto (horas y kg no producidos)
function impactoTexto(minutos, stdKg){
  if(!minutos) return '';
  const horas = minutos/60;
  if(window.__REAL_SEPTEMBER__) return `${horas.toFixed(1)} h perdidas`;
  const kg = impactKg(minutos, stdKg);
  return `≈ ${horas.toFixed(1)} h · ≈ ${fmtInt(kg)} kg no producidos (estimado)`;
}

// Línea de tendencia con zonas de desempeño (verde / ámbar / rojo), área suavizada y punto final destacado
function trendChart(points, opts={}){
  points=points.filter(p=>p.value!=null);
  const w=opts.width||520, h=opts.height||240, showAllLabels=opts.showAllLabels===true;
  const dense=points.length>8, padL=48, padR=30, padT=24, padB=showAllLabels&&dense?104:34;
  const custom=!!opts.bands;
  const bands=opts.bands||[
    {v:0.95,color:'var(--ok)',label:'95%'},{v:0.90,color:'var(--ok)',label:'90%'},
    {v:0.85,color:'var(--ok)',label:'meta 85%',bold:true},
    {v:0.75,color:'var(--warn)',label:'75%'},{v:0.65,color:'var(--bad)',label:'65%'},
  ];
  if(points.length<2) return '<div class="trend-empty">Se necesitan al menos 2 días/periodos importados para mostrar tendencia.</div>';
  const uid='tg'+(++__gid);
  const vals=points.map(p=>p.value), bandVals=bands.map(b=>b.v);
  const min=Math.min(...vals,...bandVals)-0.02, max=Math.max(...vals,...bandVals)+0.02;
  const x=i=>padL+(w-padL-padR)*i/(points.length-1);
  const y=v=>padT+(h-padT-padB)*(1-(v-min)/(max-min||1));
  const plotBottom=h-padB, W2=w-padL-padR;
  let zones='';
  if(!custom){ const yv=v=>Math.max(padT,Math.min(plotBottom,y(v)));
    zones=`<rect x="${padL}" y="${padT}" width="${W2}" height="${(yv(.85)-padT).toFixed(1)}" fill="var(--ok)" opacity=".08"/><rect x="${padL}" y="${yv(.85).toFixed(1)}" width="${W2}" height="${(yv(.75)-yv(.85)).toFixed(1)}" fill="var(--warn)" opacity=".08"/><rect x="${padL}" y="${yv(.75).toFixed(1)}" width="${W2}" height="${(plotBottom-yv(.75)).toFixed(1)}" fill="var(--bad)" opacity=".07"/>`; }
  const pts=points.map((p,i)=>[x(i),y(p.value)]);
  const line=smoothPath(pts), area=`${line} L${pts[pts.length-1][0].toFixed(1)},${plotBottom} L${pts[0][0].toFixed(1)},${plotBottom} Z`;
  const last=pts[pts.length-1];
  const dots=points.map((p,i)=>i===points.length-1?'':`<circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="${showAllLabels?4.2:3.4}" fill="var(--card)" stroke="var(--accent)" stroke-width="2"><title>${esc(p.label)} · ${(p.value*100).toFixed(1)}%</title></circle>`).join('')
    +`<circle class="pulse-halo" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="9" fill="var(--yellow)" opacity=".35"/><circle class="pulse-dot" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="5" fill="var(--yellow)" stroke="var(--ink)" stroke-width="1.8"><title>${esc(points[points.length-1].label)} · ${(points[points.length-1].value*100).toFixed(1)}%</title></circle>`;
  const labelEvery=dense?Math.ceil(points.length/6):1;
  const xLabels=points.map((p,i)=>{
    if(!showAllLabels&&dense&&i%labelEvery!==0&&i!==points.length-1) return '';
    const px=x(i).toFixed(1), py=(showAllLabels&&dense?plotBottom+16:h-12).toFixed(1);
    const rotate=showAllLabels&&dense?` transform="rotate(-55 ${px} ${py})" text-anchor="end"`:` text-anchor="${i===points.length-1&&!dense?'end':i===0&&!dense?'start':'middle'}"`;
    const lb=(!showAllLabels&&/^\d{2}-\d{2}-\d{4}$/.test(p.label))?p.label.slice(0,5):p.label;
    return `<text x="${px}" y="${py}" font-size="${showAllLabels?10.5:9.5}" fill="var(--viz-muted)"${rotate}>${esc(lb)}</text>`;
  }).join('');
  const pill=(i,p)=>{ const labelY=Math.max(padT+14,Math.min(plotBottom-6,y(p.value)+(i%2?-22:26)));
    const px=Math.max(padL+26,Math.min(w-padR-4,x(i)));
    return `<rect x="${(px-24).toFixed(1)}" y="${(labelY-12).toFixed(1)}" width="48" height="18" rx="9" fill="var(--card)" stroke="var(--line)" stroke-width=".9"/><text x="${px.toFixed(1)}" y="${(labelY+1).toFixed(1)}" font-size="9.5" fill="var(--ink)" font-weight="800" text-anchor="middle">${(p.value*100).toFixed(1)}%</text>`; };
  const valLabels=(!dense||showAllLabels)?points.map((p,i)=>pill(i,p)).join(''):pill(points.length-1,points[points.length-1]);
  const bandLines=bands.map(b=>{ const by=y(b.v);
    return `<line x1="${padL}" y1="${by.toFixed(1)}" x2="${w-padR}" y2="${by.toFixed(1)}" stroke="${b.color}" stroke-width="${b.bold?1.8:1}" stroke-dasharray="${b.bold?'0':'3,5'}" opacity="${b.bold?0.85:0.45}"/><text x="${padL-6}" y="${(by+3.5).toFixed(1)}" font-size="${showAllLabels?10:9.5}" fill="${b.color}" text-anchor="end" font-weight="${b.bold?800:600}">${b.v*100|0}%</text>`;
  }).join('');
  return `<svg class="svg-chart" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tendencia de eficiencia: último valor ${(points[points.length-1].value*100).toFixed(1)}%"><defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.30"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>${zones}${bandLines}<g class="tcurve"><path d="${area}" fill="url(#${uid})"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>${dots}${valLabels}${xLabels}</svg>
  <div class="legend"><div class="li"><span class="sw" style="background:var(--ok);opacity:.7"></span>sobre la meta (85%)</div><div class="li"><span class="sw" style="background:var(--warn);opacity:.7"></span>desviación leve (75–85%)</div><div class="li"><span class="sw" style="background:var(--bad);opacity:.7"></span>desviación considerable (&lt;75%)</div></div>`;
}

function responsiveTrendChart(points){

// Fila compacta de comparacion: actual vs periodo anterior vs meta
function comparisonRow(label, cur, prev, meta, higherIsBetter=true, fmt=fmtPct){
  let delta = '';
  if(prev!=null && cur!=null){
    const d = cur-prev;
    const good = higherIsBetter ? d>=0 : d<=0;
    const arrow = d===0 ? '→' : (d>0 ? '▲' : '▼');
    delta = `<span style="color:${good?'var(--ok)':'var(--bad)'};font-weight:700;">${arrow} ${fmt(Math.abs(d))}</span> vs. anterior`;
  }
  const metaTxt = meta!=null ? `<span style="color:var(--muted);">· meta ${fmt(meta)}</span>` : '';
  return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px;">
    <span style="color:var(--muted);">${esc(label)}</span>
    <span>${fmt(cur)} &nbsp; ${delta} ${metaTxt}</span>
  </div>`;
}
// Version simetrica: la meta es un punto central (ej. sobrepeso 0%), "mejor" es acercarse a la meta, no subir o bajar
function comparisonRowSym(label, cur, prev, meta=0, fmt=fmtPct){
  let delta = '';
  if(prev!=null && cur!=null){
    const d = cur-prev;
    const good = Math.abs(cur-meta) <= Math.abs(prev-meta);
    const arrow = d===0 ? '→' : (d>0 ? '▲' : '▼');
    delta = `<span style="color:${good?'var(--ok)':'var(--bad)'};font-weight:700;">${arrow} ${fmt(Math.abs(d))}</span> vs. anterior`;
  }
  return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px;">
    <span style="color:var(--muted);">${esc(label)}</span>
    <span>${fmt(cur)} &nbsp; ${delta} <span style="color:var(--muted);">· meta ${fmt(meta)}</span></span>
  </div>`;
}

// Donut simple de distribucion de causas (% del total)
function donutChart(causas, opts={}){
  const size = opts.size||150, r=size/2-8, cx=size/2, cy=size/2, sw=18;
  const items = CAUSAS.map(c=>({...c, val: causas[c.code]||0}));
  const total = items.reduce((s,i)=>s+i.val,0) || 1;
  let a0 = -90, arcs='';
  items.forEach(it=>{
    const frac = it.val/total;
    if(frac<=0) return;
    const a1 = a0 + frac*360;
    const large = (a1-a0)>180 ? 1 : 0;
    const p0 = polar(cx,cy,r,a0), p1=polar(cx,cy,r,a1);
    arcs += `<path d="M${p0.x},${p0.y} A${r},${r} 0 ${large} 1 ${p1.x},${p1.y}" fill="none" stroke="var(${it.var})" stroke-width="${sw}"></path>`;
    a0 = a1;
  });
  return `<svg class="svg-chart" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" style="max-width:${size}px;margin:0 auto;">${arcs}</svg>`;
}
function polar(cx,cy,r,angDeg){ const a=angDeg*Math.PI/180; return {x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)}; }

function fmtInt(n){ return n==null ? 'S/D' : Math.round(n).toLocaleString('es-CL'); }
function fmtPct(n){ return n==null ? 'S/D' : ((n*100).toFixed(1)+'%'); }
function fmtPct0(n){ return n==null ? 'S/D' : ((n*100).toFixed(0)+'%'); }
function fmtDate(value){
  const match=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(value??''));
  return match ? `${match[3]}-${match[2]}-${match[1]}` : String(value??'');
}
function fmtPeriod(period){
  const start=fmtDate(period.desde), end=fmtDate(period.hasta);
  return start===end ? start : `${start} → ${end}`;
}
function pillClass(eff){ if(eff==null) return 'na'; return eff>=META_EFICIENCIA ? 'ok' : eff>=META_EFICIENCIA-0.10 ? 'warn' : 'bad'; }

function periodMonth(period){ return String(period?.desde||'').slice(0,7); }

function activeMonthKey(){
  if(state.activeMonth) return state.activeMonth;
  const selected=state.store.periods.find(p=>p.id===state.periodId);
  return periodMonth(selected||latestPeriod(state.store));
}
function periodsInMonth(month=activeMonthKey()){
  return state.store.periods.filter(p=>periodMonth(p)===month).sort((a,b)=>a.hasta.localeCompare(b.hasta));

function visiblePeriods(){ return periodsInMonth(); }

function currentPeriod(){
  const periods=visiblePeriods();
  if(!periods.length) return null;
  return periods.find(p=>p.id===state.periodId)||periods[periods.length-1];
}
function periodIndex(){ const cur=currentPeriod(); return cur ? visiblePeriods().findIndex(p=>p.id===cur.id) : -1; }
function prevPeriod(){ const i=periodIndex(); return i>0 ? visiblePeriods()[i-1] : null; }
function goAdjacentPeriod(delta){
  const periods=visiblePeriods();
  const n=periodIndex()+delta;
  if(n>=0 && n<periods.length){ state.periodId=periods[n].id; render(); }
}

function avatarHTML(nombre, size, editable, turno){
  size = size||38;
  const pending = /por definir/i.test(nombre||'');
  const foto = liderFoto(nombre);
  const photoSrc=foto||(turno==='Turno 3'?TURNO3_PHOTOS[nombre]:null);
  const editAttr = editable ? `data-edit-foto="${esc(nombre)}"` : '';
  const cursor = editable ? 'pointer' : 'default';
  const col = avatarColor(nombre);
  const style = pending ? '' : `background:${col};`;
  return `<div class="avatar ${pending?'pending':''}" ${editAttr} style="width:${size}px;height:${size}px;${style}cursor:${cursor};"><span class="avatar-initials">${initials(nombre)}</span>${photoSrc?`<img src="${esc(photoSrc)}" alt="" onerror="this.remove()">`:''}</div>`;
}

function contentHTML(){
  const cur = currentPeriod();
  if(!cur){
    return `<div class="empty-state"><b>Aún no hay datos en este navegador ni publicados en GitHub.</b><br><br>Si ya cargaste datos antes, ábrelo en el mismo navegador donde los veías y pulsa «Publicar en GitHub» (modo edición) para que todos los vean.<br>Si tienes un respaldo (.json), usa «Restaurar respaldo» en modo edición.<br>Si es un inicio nuevo, pega los datos del "Reporte KPIs".</div>`;
  }
  if(state.view==='planta') return plantaHTML(cur);
  if(state.view==='ejecutivo') return ejecutivoHTML(cur);
  if(state.view==='macro') return macroHTML();
  if(state.view==='bitacora') return bitacoraHTML();
  if(TURNOS.includes(state.view)) return turnoHTML(cur, state.view);
  return '';
}

/* ---------- helpers de agregacion ---------- */
function plantaAgg(p){
  const kilos = TURNOS.reduce((s,t)=>s+p.turnos[t].kilos,0);
  const std = TURNOS.reduce((s,t)=>s+p.turnos[t].std,0);
  const scrap = TURNOS.reduce((s,t)=>s+p.turnos[t].scrap,0);
  const causas = emptyCausas();
  TURNOS.forEach(t=> CAUSAS.forEach(c=> causas[c.code]+=p.turnos[t].causas[c.code]));
  return {kilos, std, scrap, eficiencia: safeEff(kilos,std), scrapPct: scrapPct(kilos,scrap), causas};
}

function causasInsightHTML(causas, std, scope){
  const items = CAUSAS.map(c=>({...c, val: causas[c.code]||0})).sort((a,b)=>b.val-a.val);
  const {picked, restPct} = paretoTop(items, 'val', 3);
  if(!picked.length) return `Sin minutos de causa registrados${scope?` en ${scope}`:''} en este periodo.`;
  if(picked.length===1){
    const p = picked[0];
    let txt = `La causa que más golpea la eficiencia${scope?` en ${scope}`:''} es <b>${p.label} (${p.code})</b>, con ${fmtInt(p.val)} min perdidos (${fmtPct0(p.pct)} del total) — ${impactoTexto(p.val, std)}.`;
    txt += restPct>0.05 ? ` El resto de las causas (${fmtPct0(restPct)}) es marginal.` : '';
    return txt;
  }
  const lista = picked.map((p,i)=> `<b>${p.label} (${p.code})</b> ${fmtPct0(p.pct)}${i===picked.length-1?` (acumulado ${fmtPct0(p.acum)})`:''}`).join(', ');
  let txt = `Bajo criterio 80/20, ${picked.length} causas concentran la ineficiencia${scope?` en ${scope}`:''}: ${lista}. ${impactoTexto(picked.reduce((s,p)=>s+p.val,0), std)}.`;
  txt += restPct>0.05 ? ` El resto de las causas (${fmtPct0(restPct)}) es marginal.` : '';
  return txt;
}

function maquinasInsightHTML(worstList){
  if(!worstList.length || worstList[0].count===0) return 'Ninguna máquina muestra brechas recurrentes relevantes en el histórico disponible.';
  const {picked, restPct} = paretoTop(worstList, 'count', 3);
  if(!picked.length) return 'Ninguna máquina muestra brechas recurrentes relevantes en el histórico disponible.';
  if(picked.length===1){
    const m = picked[0];
    return `Máquina con más brechas recurrentes: <b>${m.maquina}</b> (fuera de rango en ${m.count} periodo(s) del histórico).`;
  }
  const lista = picked.map(m=> `<b>${m.maquina}</b> (${m.count})`).join(', ');
  return `Máquinas con brechas recurrentes: ${lista} — concentran ${fmtPct0(1-restPct)} de las alertas del histórico.`;
}

function insightsPlanta(cur, prev){
  const out = [];
  const turnosOrd = TURNOS.map(t=>({t, e:safeEff(cur.turnos[t].kilos,cur.turnos[t].std)})).sort((a,b)=>(b.e??-1)-(a.e??-1));
  out.push({icon:'🏆', text:`<b>${turnosOrd[0].t}</b> lidera esta ventana con ${fmtPct(turnosOrd[0].e)} de eficiencia; <b>${turnosOrd[2].t}</b> es el que más brecha tiene, con ${fmtPct(turnosOrd[2].e)}.`});
  const ag = plantaAgg(cur);
  out.push({icon:'⚠️', text: causasInsightHTML(ag.causas, ag.std)});
  if(prev){
    const agPrev = plantaAgg(prev);
    if(ag.eficiencia!=null && agPrev.eficiencia!=null){
      const delta = (ag.eficiencia-agPrev.eficiencia)*100;
      out.push({icon: delta>=0?'📈':'📉', text:`La eficiencia de planta ${delta>=0?'subió':'bajó'} ${Math.abs(delta).toFixed(1)} pts respecto al día/periodo anterior.`});
    }
  }
  out.push({icon:'🔧', text: maquinasInsightHTML(worstMachines(6))});
  return out;
}

function insightsTurno(cur, prev, turno){
  const out = [];
  const t = cur.turnos[turno];
  out.push({icon:'⚠️', text: causasInsightHTML(t.causas, t.std, turno)});
  const tEff = safeEff(t.kilos, t.std);
  if(prev){
    const pEff = safeEff(prev.turnos[turno].kilos, prev.turnos[turno].std);
    if(tEff!=null && pEff!=null){
      const delta = (tEff-pEff)*100;
      out.push({icon: delta>=0?'📈':'📉', text:`La eficiencia de ${turno} ${delta>=0?'subió':'bajó'} ${Math.abs(delta).toFixed(1)} pts respecto al día/periodo anterior.`});
    }
  }
  const worst = worstMachines(6, turno);
  out.push({icon:'🔧', text: maquinasInsightHTML(worst)});
  return out;
}

// Ranking de maquinas que mas se repiten con baja eficiencia o alto scrap, a traves de TODO el historico
// (opcionalmente acotado a un turno especifico)
function worstMachines(topN=5, soloTurno=null){
  const stats = {};
  const periods=visiblePeriods();
  periods.forEach((p,periodIndex)=>{
    const previous=periodIndex>0?periods[periodIndex-1]:null;
    const turnosScope = soloTurno ? [soloTurno] : TURNOS;
    turnosScope.forEach(t=> Object.entries(p.turnos[t].naves).forEach(([naveName,nd])=> nd.maquinas.forEach(m=>{
      const key = m.maquina;
      if(!machineHasData(m)) return;
      if(!stats[key]) stats[key] = {maquina:key, count:0, alertDays:new Set(), totalCausas:0, totalScrap:0, totalProd:0};
      const old=previous?.turnos[t].naves[naveName].maquinas.find(item=>item.maquina===key);
      const prod=window.__CUMULATIVE_MONTHLY__?m.prod-(old?.prod||0):m.prod;
      const std=window.__CUMULATIVE_MONTHLY__?m.std-(old?.std||0):m.std;
      const scrap=window.__CUMULATIVE_MONTHLY__?m.scrap-(old?.scrap||0):m.scrap;
      const causes=emptyCausas();
      CAUSAS.forEach(c=>causes[c.code]=window.__CUMULATIVE_MONTHLY__?m.causas[c.code]-(old?.causas[c.code]||0):m.causas[c.code]);
      const eff = safeEff(prod, std);
      const sp = scrapPct(prod, scrap);
      if((eff!=null && eff < META_EFICIENCIA-0.10) || sp > META_SCRAP*1.4){
        if(window.__CUMULATIVE_MONTHLY__) stats[key].alertDays.add(p.hasta);
        else stats[key].count++;
      }
      stats[key].totalCausas += totalCausas(causes);
      stats[key].totalScrap += scrap;
      stats[key].totalProd += prod;
    })));
  });
  const ranked=Object.values(stats);
  if(window.__CUMULATIVE_MONTHLY__) ranked.forEach(item=>item.count=item.alertDays.size);
  return ranked.sort((a,b)=> b.count-a.count || b.totalCausas-a.totalCausas).slice(0,topN);
}
