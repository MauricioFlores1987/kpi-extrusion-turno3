<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A2670">
<title>Panel de Planta</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232A2670'/%3E%3Crect x='6' y='6' width='9' height='9' rx='2' fill='%23F5E202'/%3E%3Crect x='17' y='6' width='9' height='9' rx='2' fill='white'/%3E%3Crect x='6' y='17' width='9' height='9' rx='2' fill='white'/%3E%3Crect x='17' y='17' width='9' height='9' rx='2' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<style>
:root{--navy:#2A2670;--navy-dark:#1B1850;--navy-tint:#EEEDF8;--yellow:#F5E202;--ink:#1A1745;--muted:#6B6E85;--bg:#F5F5FA;--card:#fff;--line:#E4E3F0;--shadow:0 1px 2px rgba(26,23,69,.06),0 6px 18px rgba(26,23,69,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0B0A1E;--card:#15143A;--ink:#EEEDFB;--muted:#A3A5C4;--line:#2B2A5E;--navy-tint:#1F1E4C;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45}
.app{max-width:440px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;border-inline:1px solid var(--line)}
.bar{background:linear-gradient(135deg,var(--navy-dark),var(--navy));border-bottom:3px solid var(--yellow);color:#fff;padding:16px;min-height:64px}
.bar h1{font-size:18px;font-weight:800;margin:0}.bar span{display:block;font-size:12px;font-weight:600;opacity:.8}
main{padding:16px;display:flex;flex-direction:column;gap:14px}
a.card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;box-shadow:var(--shadow);text-decoration:none;color:inherit;min-height:84px}
a.card:hover{border-color:var(--navy)}a.card:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.ico{width:52px;height:52px;border-radius:14px;background:var(--navy);display:grid;place-items:center;flex:none}
.ico svg{width:28px;height:28px;stroke:var(--yellow);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{font-size:16px;font-weight:800}.d{font-size:12px;color:var(--muted);margin-top:2px}
.arrow{margin-left:auto;color:var(--muted);font-size:22px}
footer{margin-top:auto;padding:16px;text-align:center;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <div class="bar"><h1>Panel de Planta<span>Extrusión · elige una herramienta</span></h1></div>
  <main>
    <a class="card" href="kpi.html">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div>
      <div><div class="t">KPIs Extrusión</div><div class="d">Indicadores y seguimiento del turno</div></div><span class="arrow">›</span>
    </a>
    <a class="card" href="https://mauricioflores1987.github.io/fichas-parametros-extrusion/">
      <div class="ico"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/></svg></div>
      <div><div class="t">Fichas de Parámetros</div><div class="d">Registro de parámetros por máquina</div></div><span class="arrow">›</span>
    </a>
  </main>
  <footer>Guarda esta página en la pantalla de inicio de tu celular.</footer>
</div>
</body>
</html>
