function semColor(cls){ return cls==='ok'?'var(--ok)':cls==='warn'?'var(--warn)':cls==='na'?'var(--muted)':'var(--bad)'; }
function semSpan(text, cls){ return `<span style="color:${semColor(cls)};font-weight:700;">${text}</span>`; }

function deltaChip(cur,prev,mode,meta){
  if(cur==null||prev==null) return null; const d=cur-prev;
  const good=mode==='sym'?Math.abs(cur-(meta||0))<=Math.abs(prev-(meta||0)):(mode==='up'?d>=0:d<=0), flat=Math.abs(d)<0.0005;
  return {arrow:flat?'→':(d>0?'▲':'▼'),text:`${Math.abs(d*100).toFixed(1)} pts`,good,flat};
}
function kgDelta(cur,prev){ if(cur==null||prev==null) return null; const d=cur-prev; return {arrow:d>0?'▲':d<0?'▼':'→',text:fmtInt(Math.abs(d))+' kg',good:d>=0,flat:d===0}; }
function kpiCard(o){
  const st=o.state||'na', c=o.delta;
  const chip=c?`<span class="kpi-chip ${c.flat?'flat':c.good?'ok':'bad'}" title="vs. corte anterior">${c.arrow} ${c.text}</span>`:'';
  let meter='';
  if(o.meter){ const f=Math.max(0,Math.min(1,o.meter.v/o.meter.max)), m=Math.max(0,Math.min(1,o.meter.meta/o.meter.max));
    meter=`<div class="kpi-meter" aria-hidden="true"><div class="kpi-track"><i class="${st}" style="width:${(f*100).toFixed(1)}%"></i><b style="left:${(m*100).toFixed(1)}%"></b></div><div class="kpi-meta">${o.meter.label}</div></div>`; }
  return `<div class="kpi-card kpi2 st-${st}"><div class="kpi-top"><span class="lbl">${o.lbl}</span>${chip}</div><div class="val">${o.val}</div>${o.sub?`<div class="sub">${o.sub}</div>`:''}${meter}${o.spark?`<div class="spark-row">${o.spark}</div>`:''}</div>`;
}
function gapTxt(v,meta){ if(v==null) return ''; const d=(v-meta)*100; return d>=0?`+${d.toFixed(1)} pts sobre la meta`:`−${Math.abs(d).toFixed(1)} pts bajo la meta`; }
function effMeter(v){ return v==null?null:{v,max:1,meta:META_EFICIENCIA,label:`<span>meta ${fmtPct0(META_EFICIENCIA)}</span><span>${gapTxt(v,META_EFICIENCIA,true)}</span>`}; }
function scrapMeter(v){ return v==null?null:{v,max:Math.max(META_SCRAP*2,v*1.08),meta:META_SCRAP,label:`<span>meta ${fmtPct0(META_SCRAP)}</span><span>${gapTxt(v,META_SCRAP,false)}</span>`}; }
function ringColorAt(t){ // t = avance del anillo (0–1): rojo → ámbar → verde al llegar a la meta (85 %)
  const dk=isDark(), R=dk?[255,111,97]:[209,59,46], A=dk?[245,197,66]:[232,165,0], G=dk?[74,222,149]:[30,158,90];
  const mix=(x,y,k)=>x.map((c,i)=>Math.round(c+(y[i]-c)*k)), m=META_EFICIENCIA;
  let c; if(t<=.55*m) c=R; else if(t<=.85*m) c=mix(R,A,(t-.55*m)/(.30*m)); else if(t<m) c=mix(A,G,(t-.85*m)/(.15*m)); else c=G;
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function ringGauge(v,color,txt){
  const r=26, f=Math.max(0,Math.min(1,v==null?0:v)), a=(META_EFICIENCIA*360-90)*Math.PI/180, N=60, cx=34, cy=34;
  const pt=t=>{ const an=(t*360-90)*Math.PI/180; return [cx+r*Math.cos(an), cy+r*Math.sin(an)]; };
  let segs=''; const n=Math.ceil(f*N);
  for(let i=0;i<n;i++){ const t0=i/N, t1=Math.min(f,(i+1)/N+0.004), p0=pt(t0), p1=pt(t1);
    segs+=`<path d="M${p0[0].toFixed(2)},${p0[1].toFixed(2)} A${r},${r} 0 0 1 ${p1[0].toFixed(2)},${p1[1].toFixed(2)}" fill="none" stroke="${ringColorAt((t0+t1)/2)}" stroke-width="8"/>`; }
  const e=pt(f), s0=pt(0);
  const caps=f>0?`<circle cx="${s0[0].toFixed(2)}" cy="${s0[1].toFixed(2)}" r="4" fill="${ringColorAt(0)}"/><circle cx="${e[0].toFixed(2)}" cy="${e[1].toFixed(2)}" r="4" fill="${ringColorAt(f)}"/>`:'';
  return `<svg class="ring" width="68" height="68" viewBox="0 0 68 68" aria-hidden="true"><circle cx="34" cy="34" r="${r}" fill="none" stroke="var(--track)" stroke-width="8"/><g style="animation:fadein .9s both">${segs}${caps}</g><line x1="${(34+(r-7)*Math.cos(a)).toFixed(1)}" y1="${(34+(r-7)*Math.sin(a)).toFixed(1)}" x2="${(34+(r+7)*Math.cos(a)).toFixed(1)}" y2="${(34+(r+7)*Math.sin(a)).toFixed(1)}" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/><text x="34" y="38" text-anchor="middle" font-size="12" font-weight="800" fill="var(--viz-secondary)">${txt}</text></svg>`;
}
function miniBar(frac,cls){ return `<span class="mbar"><i class="${cls}" style="width:${Math.max(2,Math.min(100,frac*100)).toFixed(0)}%"></i></span>`; }

function monthClosingPeriods(){
  const closings=new Map();
  state.store.periods.forEach(period=>{
    const key=periodMonth(period),previous=closings.get(key);
    if(!previous||period.hasta>previous.hasta) closings.set(key,period);
  });
  return [...closings.values()].sort((a,b)=>a.desde.localeCompare(b.desde));
}
function aggregateMacroPeriods(periods){
  const result={kilos:0,std:0,scrap:0,overweightKg:0,causas:emptyCausas()};
  periods.forEach(period=>TURNOS.forEach(turno=>{
    const data=period.turnos[turno];
    result.kilos+=data.kilos;
    result.std+=data.std;
    result.scrap+=data.scrap;
    result.overweightKg+=data.sobrepeso*data.kilos;
    CAUSAS.forEach(cause=>result.causas[cause.code]+=data.causas[cause.code]||0);
  }));
  result.eficiencia=safeEff(result.kilos,result.std);
  result.scrapPct=scrapPct(result.kilos,result.scrap);
  result.sobrepeso=result.kilos?result.overweightKg/result.kilos:0;
  return result;
}
function macroHTML(){
  const closings=monthClosingPeriods();
  if(!closings.length) return '<div class="empty-state">No hay meses para comparar.</div>';
  const years=[...new Set(closings.map(period=>period.desde.slice(0,4)))].sort();
  if(!years.includes(state.macroYear)) state.macroYear=years[years.length-1];
  const monthMode=state.macroMode!=='years';
  let groups,summary,trendPts,tableRows;
  if(monthMode){
    groups=closings.filter(period=>period.desde.slice(0,4)===state.macroYear);
    summary=aggregateMacroPeriods(groups);

      const data=plantaAgg(period);
      return `<tr><td style="text-align:left;font-weight:700;">${monthLabel(periodMonth(period))}</td><td>${fmtDate(period.hasta)}</td><td>${fmtInt(data.kilos)}</td><td>${fmtPct(data.eficiencia)}</td><td>${fmtPct(data.scrapPct)}</td><td>${fmtPct(avgSobrepeso(period))}</td></tr>`;
    }).join('');
  }else{
    const byYear=new Map();
    closings.forEach(period=>{
      const year=period.desde.slice(0,4);
      if(!byYear.has(year)) byYear.set(year,[]);
      byYear.get(year).push(period);
    });
    groups=[...byYear.entries()].map(([year,periods])=>({year,periods,data:aggregateMacroPeriods(periods)}));
    summary=aggregateMacroPeriods(closings);
    trendPts=groups.map(group=>({label:group.year,value:group.data.eficiencia}));
    tableRows=groups.map(group=>`<tr><td style="text-align:left;font-weight:700;">${group.year}</td><td>${group.periods.length} mes(es)</td><td>${fmtInt(group.data.kilos)}</td><td>${fmtPct(group.data.eficiencia)}</td><td>${fmtPct(group.data.scrapPct)}</td><td>${fmtPct(group.data.sobrepeso)}</td></tr>`).join('');
  }
  const causesLabel=monthMode?`Pareto acumulado · ${state.macroYear}`:'Pareto acumulado · todos los años';
  return `

    <div class="section-head"><h2>Análisis macro</h2><span class="hint">Se usa un cierre por mes; no se suman los cortes diarios acumulados.</span></div>
    <div class="tabbar" style="margin:8px 0 12px;">
      <button class="btn secondary ${monthMode?'active':''}" data-macro-mode="months">Meses</button>
      <button class="btn secondary ${!monthMode?'active':''}" data-macro-mode="years">Años</button>
      ${monthMode?`<label style="display:flex;align-items:center;gap:8px;margin-left:auto;font-size:12px;color:var(--muted);">Año <select id="macroYear">${years.map(year=>`<option value="${year}" ${year===state.macroYear?'selected':''}>${year}</option>`).join('')}</select></label>`:''}
    </div>
    <div class="kpi-grid">
      ${kpiCard({lbl:'Producción',val:fmtInt(summary.kilos),state:'na'})}
      ${kpiCard({lbl:'Eficiencia ponderada',val:fmtPct(summary.eficiencia),state:pillClass(summary.eficiencia),meter:effMeter(summary.eficiencia)})}
      ${kpiCard({lbl:'Scrap',val:fmtPct(summary.scrapPct),state:pillClassInv(summary.scrapPct,META_SCRAP),meter:scrapMeter(summary.scrapPct)})}
      ${kpiCard({lbl:'Sobrepeso ponderado',val:fmtPct(summary.sobrepeso),state:pillClassSobrepeso(summary.sobrepeso),sub:`meta ${fmtPct0(META_SOBREPESO)}`})}
    </div>
  </div>
  <div class="section">
    <div class="section-head"><h2>${monthMode?'Cierres mensuales':'Cierres anuales'}</h2></div>
    <div class="card"><table class="mtable">
      <tr><th style="text-align:left;">${monthMode?'Mes':'Año'}</th><th>${monthMode?'Último corte':'Meses'}</th><th>Kilos</th><th>Eficiencia</th><th>Scrap</th><th>Sobrepeso</th></tr>
      ${tableRows}

  <div class="section">

    ${responsiveTrendChart(trendPts)}
  </div>
  <div class="section">
    <div class="section-head"><h2>${causesLabel}</h2><span class="hint">minutos perdidos</span></div>
    <div class="card">${paretoChart(summary.causas)}</div>
  </div>`;
}

function bitacoraFiltered(){
  const current=currentPeriod();
  const monthly=state.store.bitacoraByMonth?.[periodMonth(current)];
  const sameStart=state.store.periods.filter(p=>p.desde===current?.desde).length>1;
  const periods=sameStart&&current?[current]:visiblePeriods();
  const all=Array.isArray(monthly)?monthly.filter(e=>e.fecha<=current.hasta):[];
  if(!Array.isArray(monthly)) periods.forEach(p=>p.bitacora.forEach(e=>all.push(e)));
  all.sort((a,b)=> b.fecha.localeCompare(a.fecha));
  return all.filter(e=>{
    if(state.bFiltro.maquina && e.maquina!==state.bFiltro.maquina) return false;
    if(state.bFiltro.turno && e.turno!==state.bFiltro.turno) return false;
    if(state.bFiltro.texto && !e.observacion.toLowerCase().includes(state.bFiltro.texto.toLowerCase()) && !e.maquina.toLowerCase().includes(state.bFiltro.texto.toLowerCase())) return false;
    return true;
  });
}
function bitacoraResultsHTML(){

        <div class="bitacora-item">

<script>
/* ============================================================
   PARSER — texto pegado desde Excel (tab-separado) -> objeto periodo
   ============================================================ */
function normLabel(s){
  return (s||'').toString().trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,''); // sin tildes
}
function normalizeNumberInput(s){
  if(s==null) return 0;
  let t = String(s).trim().replace(/[%$€£]/g,'').replace(/\s+/g,'');
  if(!t) return 0;
  const comma=t.lastIndexOf(',');
  const dot=t.lastIndexOf('.');
  if(comma!==-1 && dot!==-1){
    const decimal=comma>dot?',':'.';
    const thousands=decimal===','?/\./g:/,/g;
    t=t.replace(thousands,'').replace(decimal,'.');
  }else{
    const separator=comma!==-1?',':dot!==-1?'.':'';
    if(separator){
      const parts=t.split(separator);
      if(parts.length>2){
        const decimals=parts.pop();
        t=parts.join('')+'.'+decimals;
      }else{
        const decimals=parts[1]||'';
        const integer=parts[0].replace(/^[+-]/,'');
        const grouped=decimals.length===3 && integer.length<=3;
        t=grouped?parts.join(''):parts.join('.');
      }
    }
  }
  const n = Number(t);
  return Number.isFinite(n) ? n : 0;
}
function parseNum(s){
  return normalizeNumberInput(s);
}
function parsePct(s){
  if(s==null) return 0;
  const hasPct = /%/.test(String(s));
  const n = parseNum(s);
  if(hasPct) return n/100;
  if(Math.abs(n) > 1 && Math.abs(n) <= 100) return n/100;
  return n;
}
function parseFecha(s){
  const raw = (s||'').toString().trim();
  if(!raw) return '';

  const iso = raw.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
  if(iso){
    const [,y,m,d] = iso;
    return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  const eu = raw.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
  if(eu){
    const [,d,m,y] = eu;
    return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  const us = raw.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{2,4})$/);
  if(us){
    let [,a,b,y] = us;
    const first = Number(a), second = Number(b);
    if(first > 12 && second <= 12){
      return `${String(y).length===2 ? '20'+y : y}-${String(second).padStart(2,'0')}-${String(first).padStart(2,'0')}`;
    }
    if(second > 12 && first <= 12){
      return `${String(y).length===2 ? '20'+y : y}-${String(first).padStart(2,'0')}-${String(second).padStart(2,'0')}`;
    }
    return `${String(y).length===2 ? '20'+y : y}-${String(first).padStart(2,'0')}-${String(second).padStart(2,'0')}`;
  }

  const shortMonth = raw.match(/^(\d{1,2})[-/\s]([a-záéíóú]+)(?:[-/\s](\d{2,4}))?$/i);
  if(shortMonth){
    const [,dayText,monthText,yearText] = shortMonth;
    const monthKey = monthText.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const months = {ene:1,jan:1,feb:2,mar:3,abr:4,apr:4,may:5,jun:6,jul:7,ago:8,aug:8,sep:9,set:9,oct:10,nov:11,dic:12,dec:12};
    const month = months[monthKey] || months[monthKey.slice(0,3)];
    if(month){
      const year = yearText ? (yearText.length===2 ? '20'+yearText : yearText) : String(new Date().getFullYear());
      return `${year}-${String(month).padStart(2,'0')}-${String(dayText).padStart(2,'0')}`;
    }
  }

  const exemplars = raw.match(/^\d{4}-\d{2}-\d{2}/);
  if(exemplars) return exemplars[0];

  const d = new Date(raw);
  if(!Number.isNaN(d.getTime())){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  return '';
}

function parseReporteKPIs(text){
  const rows = text.split(/\r?\n/).map(r=>r.split('\t'));
  const result = {desde:'', hasta:'', turnos:{}};

  // 1) fechas
  for(const r of rows){
    const l0 = normLabel(r[0]);
    if(l0.includes('periodo')){
      // busca "desde"/"hasta" en esta fila o la siguiente
    }
    if(normLabel(r[1]||'')==='desde' || l0==='desde'){
      const cell = r.find(c=>parseFecha(c)); result.desde = parseFecha(r[2]||r[1]||'');
    }
    if(normLabel(r[1]||'')==='hasta' || l0==='hasta'){
      result.hasta = parseFecha(r[2]||r[1]||'');
    }
  }
  // fallback: busca cualquier par de fechas en las primeras 10 filas
  if(!result.desde || !result.hasta){
    const fechas = [];
    rows.slice(0,12).forEach(r=> r.forEach(c=>{ const f=parseFecha(c); if(f) fechas.push(f); }));
    const unique = [...new Set(fechas)].sort();
    if(unique.length>=2){ result.desde=unique[0]; result.hasta=unique[unique.length-1]; }
  }

  // 2) fila "Turno" con encabezados Turno 1/2/3 -> mapea columna->turno
  let turnoColIdx = null; // {1:colIndex,...}
  let jefesRow = null;
  rows.forEach((r,i)=>{
    if(normLabel(r[0])==='turno' && /turno\s*1/i.test(r[1]||'')){
      turnoColIdx = {}; 
      for(let c=1;c<r.length;c++){ const m=(r[c]||'').match(/turno\s*(\d)/i); if(m) turnoColIdx[m[1]]=c; }
    }
    if(normLabel(r[0]).includes('jefe de planta')) jefesRow = r;
  });
  if(!turnoColIdx) turnoColIdx = {1:1,2:2,3:3}; // fallback posicional

  TURNOS.forEach((turno,i)=>{
    const n = i+1;
    const col = turnoColIdx[n] ?? (i+1);
    result.turnos[turno] = {
      jefePlanta: jefesRow ? (jefesRow[col]||JEFES_PLANTA[turno]) : JEFES_PLANTA[turno],
      kilos:0, sobrepeso:0, scrap:0, std:0, eficiencia:0, causas: emptyCausas(), naves:{},
    };
  });

  const findRow = (kw)=> rows.find(r=> normLabel(r[0]).includes(kw));
  const rKilos = findRow('kilos de produccion');
  const rSobre = findRow('sobrepeso') && rows.find(r=>normLabel(r[0])==='% sobrepeso' || normLabel(r[0]).includes('% sobrepeso'));
  const rScrap = findRow('generacion de scrap');
  const rStd   = findRow('std produccion');
  TURNOS.forEach((turno,i)=>{
    const col = turnoColIdx[i+1] ?? (i+1);
    const t = result.turnos[turno];
    if(rKilos) t.kilos = parseNum(rKilos[col]);
    if(rSobre) t.sobrepeso = parsePct(rSobre[col]);
    if(rScrap) t.scrap = parseNum(rScrap[col]);
    if(rStd)   t.std = parseNum(rStd[col]);
    t.eficiencia = safeEff(t.kilos, t.std);
  });

  // 3) Causas de ineficiencia por turno: fila "Causa" con Turno1/2/3, luego 7 filas PR/MP/MT/MN/C/PROY/P
  let causaHeaderIdx = rows.findIndex(r=> normLabel(r[0])==='causa');
  if(causaHeaderIdx>=0){
    const hdr = rows[causaHeaderIdx];
    const causaCols = {};
    for(let c=1;c<hdr.length;c++){ const m=(hdr[c]||'').match(/turno\s*(\d)/i); if(m) causaCols[m[1]]=c; }
    for(let k=causaHeaderIdx+1; k<rows.length && k<causaHeaderIdx+9; k++){
      const code = (rows[k][0]||'').trim().toUpperCase();
      if(!CAUSAS.find(c=>c.code===code)) continue;
      TURNOS.forEach((turno,i)=>{
        const col = causaCols[i+1] ?? (i+1);
        result.turnos[turno].causas[code] = parseNum(rows[k][col]);
      });
    }
  }

  // 4) KPI por nave, por turno: secciones "KPI por nave turno N"
  TURNOS.forEach((turno,ti)=>{
    const n = ti+1;
    const startIdx = rows.findIndex(r=> normLabel(r[0]).includes(`kpi por nave turno ${n}`) || (normLabel(r[0]).includes('kpi por nave') && ti===2 && rows.findIndex(r2=>r2===r)>=0 && !result._t3seen));
    let idx = rows.findIndex(r=> normLabel(r[0]).includes(`kpi por nave turno ${n}`));
    // fallback para el bloque original "KPI por nave turno 3" (sin numero explicito en algunos formatos)
    if(idx<0 && n===3) idx = rows.findIndex(r=> normLabel(r[0])==='kpi por nave turno 3');
    if(idx<0) return;
    let cursor = idx+1;
    Object.keys(NAVES).forEach(nave=>{
      // busca "Encargado" desde el cursor
      while(cursor<rows.length && !normLabel(rows[cursor][0]).includes('encargado')) cursor++;
      const encargado = rows[cursor] ? (rows[cursor][1]||'Por definir').trim() : 'Por definir';
      cursor++; // fila de nombre de nave + encabezados
      cursor++; // primera fila de maquina
      const maquinas = [];
      while(cursor<rows.length && rows[cursor][0] && NAVES[nave].includes((rows[cursor][0]||'').trim())){
        const r = rows[cursor];
        const causas = emptyCausas();
        CAUSAS.forEach((c,ci)=> causas[c.code]=parseNum(r[6+ci]));
        maquinas.push({maquina:r[0].trim(), std:parseNum(r[1]), prod:parseNum(r[2]), scrap:parseNum(r[3]), sobrepeso:parsePct(r[4]), causas});
        cursor++;
      }
      // fila totales (saltar), fila eficiencia (saltar) -> ya la recalculamos
      while(cursor<rows.length && !normLabel(rows[cursor][0]).includes('eficiencia')) { if(normLabel(rows[cursor][0]).includes('encargado')) break; cursor++; }
      if(rows[cursor] && normLabel(rows[cursor][0]).includes('eficiencia')) cursor++;
      const std = maquinas.reduce((s,m)=>s+m.std,0);
      const prod = maquinas.reduce((s,m)=>s+m.prod,0);
      const scrap = maquinas.reduce((s,m)=>s+m.scrap,0);
      const _act = maquinas.filter(machineHasData); const sobrepeso = _act.length ? _act.reduce((s,m)=>s+m.sobrepeso,0)/_act.length : 0;
      result.turnos[turno].naves[nave] = {encargado: encargado||'Por definir', maquinas, std, prod, scrap, sobrepeso, eficiencia: safeEff(prod,std)};
    });
  });

  return result;
}

// Tokeniza texto separado por tabs respetando celdas entre comillas que
// contienen saltos de linea internos (asi es como Excel copia una celda
// multilinea al portapapeles: la envuelve en " " y una " " doble dentro
// de la celda representa una comilla literal). Sin esto, una observacion
// de varios parrafos se corta a la mitad al copiar/pegar.
function parseDelimitedText(text, delim){
  delim = delim || '\t';
  const rows = [];
  let row = [], field = '', inQuotes = false;
  let i = 0;
  const n = text.length;
  while(i < n){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i += 2; }
        else { inQuotes = false; i++; }
      } else { field += c; i++; }
      continue;
    }
    if(c === '"' && field === ''){ inQuotes = true; i++; continue; }
    if(c === delim){ row.push(field); field=''; i++; continue; }
    if(c === '\r'){ i++; continue; }
    if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
    field += c; i++;
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

// Formato real de origen (columnas en este orden, tal como se exporta del
// reporte): Fecha, MAQ, T (horario: N=Noche/M=Manana/T=Tarde), Cod.
// (codigo de producto), PRODUCTO, Observaciones, Indicador de turno
// (Turno 1/2/3, el que cruza con los KPIs). Se conservan todas las filas,
// incluidas las de "Sin novedad", "Mantencion preventiva", "Sin programa",
// etc. — la bitacora debe ser una copia fiel de lo entregado, no un
// listado solo de incidentes.
function parseBitacora(text){
  const rows = parseDelimitedText(text);
  const out = [];
  const stats = { totalFilas:0, ok:0, sinNovedad:0, omitidasSinFecha:0, omitidasSinMaquina:0, omitidasSinObservacion:0 };
  rows.forEach(r=>{
    const blank = r.every(c=>!String(c||'').trim());
    if(blank) return; // linea vacia de separacion, no cuenta como fila real
    if(normLabel(r[0])==='fecha') return; // encabezado, no cuenta como fila real

    stats.totalFilas++;
    const fecha = parseFecha(r[0]);
    if(!fecha){ stats.omitidasSinFecha++; return; }
    const maquina = (r[1]||'').trim();
    const horario = (r[2]||'').trim();
    const codigo = (r[3]||'').trim();
    const producto = (r[4]||'').trim();
    const observacion = (r[5]||'').trim();
    const turno = (r[6]||'').trim();

    if(!maquina){ stats.omitidasSinMaquina++; return; }
    if(!observacion){ stats.omitidasSinObservacion++; return; }
    if(/^sin novedad\.?$/i.test(observacion)) stats.sinNovedad++;

    const nave = naveOf(maquina) || '';
    out.push({fecha, maquina, horario, codigo, producto, observacion, turno, nave});
    stats.ok++;
  });
  return { entries: out, stats };
}
</script>

function validateImportedPeriod(period){
  const issues = [];
  if(!period.desde || !period.hasta){
    issues.push('No se detectaron fechas válidas del periodo.');
  } else if(period.desde > period.hasta){
    issues.push('La fecha de inicio es posterior a la fecha final.');
  }
  TURNOS.forEach(turno=>{
    const t = period.turnos?.[turno];
    if(!t){ issues.push(`Falta información del ${turno}.`); return; }
    if(t.kilos < 0 || t.std < 0 || t.scrap < 0){ issues.push(`${turno}: hay valores negativos.`); }
    if(t.kilos > 0 && t.scrap > t.kilos){ issues.push(`${turno}: el scrap supera la producción.`); }
    if(t.std > 0 && t.kilos > t.std * 1.5){
      // no bloquea, pero avisa porque suele indicar dato incompleto o mal copiado
      issues.push(`${turno}: la producción es muy superior a su STD.`);
    }
  });
  return issues;
}

function doImport(){
  const kpiText = document.getElementById('pasteKpi').value.trim();
  const bitText = document.getElementById('pasteBitacora').value.trim();
  const fb = document.getElementById('importFeedback');
  if(!kpiText){ fb.textContent='Falta pegar los datos de "Reporte KPIs".'; fb.style.color='var(--bad)'; return false; }
  let parsed;
  try{ parsed = parseReporteKPIs(kpiText); }
  catch(e){ fb.textContent='No se pudo leer el formato de KPIs. Revisa que copiaste el rango completo.'; fb.style.color='var(--bad)'; return false; }
  if(!parsed.desde || !parsed.hasta){ fb.textContent='No se detectaron las fechas del periodo (desde/hasta). Revisa las celdas C4/C5.'; fb.style.color='var(--bad)'; return false; }

  let bitResult = { entries: [], stats: null };
  if(bitText){
    try{ bitResult = parseBitacora(bitText); }
    catch(e){ fb.textContent='No se pudo leer el formato de Bitácora. Revisa que copiaste el rango completo (Fecha, MAQ, T, Cod., PRODUCTO, Observaciones, Indicador de turno).'; fb.style.color='var(--bad)'; return false; }
  }
  const period = {
    id: `${parsed.desde}_${parsed.hasta}`, desde: parsed.desde, hasta: parsed.hasta,
    importedAt: new Date().toISOString(), turnos: parsed.turnos, bitacora:[], demo:false,
  };
  const validationIssues = validateImportedPeriod(period);
  if(validationIssues.length){
    fb.innerHTML = validationIssues.slice(0,4).map(v=>`• ${v}`).join('<br>');
    fb.style.color = 'var(--bad)';
    return false;
  }
  ensureMachines(period);
  // conserva encargados definidos manualmente si ya existian para ese turno/nave
  TURNOS.forEach(turno=> Object.keys(NAVES).forEach(nave=>{
    const nd = period.turnos[turno].naves[nave];
    if(nd && (!nd.encargado || nd.encargado==='Por definir') && state.store.encargados?.[turno]?.[nave]){
      nd.encargado = state.store.encargados[turno][nave];
    }
  }));

  let mergeInfo = null;
  if(bitText){
    if(!state.store.bitacoraByMonth) state.store.bitacoraByMonth={};
    mergeInfo = { nuevas:0, actualizadas:0, iguales:0 };
    const porMes = {};
    bitResult.entries.forEach(e=>{ (porMes[e.fecha.slice(0,7)] = porMes[e.fecha.slice(0,7)] || []).push(e); });
    Object.keys(porMes).forEach(mes=>{
      const r = mergeBitacora(state.store.bitacoraByMonth[mes]||[], porMes[mes]);
      state.store.bitacoraByMonth[mes] = r.merged;
      mergeInfo.nuevas += r.nuevas; mergeInfo.actualizadas += r.actualizadas; mergeInfo.iguales += r.iguales;
    });
  }
  upsertPeriod(state.store, period);
  saveStore(state.store);
  state.activeMonth=periodMonth(period);
  state.periodId = period.id;

  // panel de verificacion: nunca se queda en silencio si algo no calzo
  let lines = [`<b style="color:var(--ok);">✓ Periodo ${esc(fmtPeriod(parsed))} importado correctamente.</b>`];
  if(bitText && bitResult.stats){
    const s = bitResult.stats;
    lines.push(`<b>Bitácora:</b> ${s.ok} de ${s.totalFilas} fila(s) leídas (incluye ${s.sinNovedad} "Sin novedad"/sin incidentes).`);
    if(mergeInfo) lines.push(`Acumulado con lo existente: <b>${mergeInfo.nuevas}</b> nueva(s), <b>${mergeInfo.actualizadas}</b> actualizada(s), <b>${mergeInfo.iguales}</b> ya existían (sin duplicar).`);
    const omitidas = s.omitidasSinFecha + s.omitidasSinMaquina + s.omitidasSinObservacion;
    if(omitidas > 0){
      const detalle = [];
      if(s.omitidasSinFecha) detalle.push(`${s.omitidasSinFecha} sin fecha reconocible`);
      if(s.omitidasSinMaquina) detalle.push(`${s.omitidasSinMaquina} sin máquina`);
      if(s.omitidasSinObservacion) detalle.push(`${s.omitidasSinObservacion} sin observación`);
      lines.push(`<span style="color:var(--warn);">⚠ ${omitidas} fila(s) omitida(s): ${detalle.join(', ')}. Revísalas en el texto pegado.</span>`);
    }
  } else if(bitText === ''){
    lines.push(`<span style="color:var(--muted);">No se pegó bitácora — se mantiene la existente.</span>`);
  }
  fb.innerHTML = lines.join('<br>');
  fb.style.color = 'var(--ink)';
  render();
  return true;
}

function openPeriodsModal(){
  const rows = state.store.periods.slice().reverse().map(p=>`
    <div class="period-list-item">
      <div class="pinfo"><b>${fmtPeriod(p)}</b>${p.demo?' <span class="badge">demo</span>':''}</div>
      <button class="link-btn" data-del-period="${p.id}" style="color:var(--bad);">eliminar</button>
    </div>`).join('') || '<div class="empty-state">Sin periodos guardados.</div>';
  showModal(`
    <button class="close-x" onclick="closeModal()">✕</button>
    <h3>Periodos guardados</h3>
    <p style="font-size:12px;color:var(--muted);margin-top:-8px;">El histórico se conserva completo. Eliminar un periodo es permanente.</p>
    ${rows}
  `);
  document.querySelectorAll('[data-del-period]').forEach(b=> b.addEventListener('click', e=>{
    const id = e.target.dataset.delPeriod;
    if(!confirm('¿Eliminar este periodo del histórico? No se puede deshacer.')) return;
    const removed=state.store.periods.find(p=>p.id===id);
    state.store.periods = state.store.periods.filter(p=>p.id!==id);
    state.store.periods.sort((a,b)=>a.desde.localeCompare(b.desde)||a.hasta.localeCompare(b.hasta));
    if(removed&&!state.store.periods.some(p=>periodMonth(p)===periodMonth(removed))) delete state.store.bitacoraByMonth?.[periodMonth(removed)];
    const activePeriods=periodsInMonth(state.activeMonth);
    if(!activePeriods.length){
      const fallback=latestPeriod(state.store);
      state.activeMonth=fallback?periodMonth(fallback):null;
      state.periodId=fallback?.id||null;
    }else if(state.periodId===id||!activePeriods.some(period=>period.id===state.periodId)){
      state.periodId=activePeriods[activePeriods.length-1].id;
    }
    saveStore(state.store);
    closeModal(); render(); toast('Periodo eliminado');
  }));
}

}

// Al imprimir o generar PDF siempre se usa el tema claro (ahorra tinta y se lee mejor), aunque la pantalla esté en oscuro.
let __themeBeforePrint=null;

function resizeImageToDataUrl(file, size, cb){
  const reader = new FileReader();
  reader.onload = ev=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const side = Math.min(img.width, img.height);
      const sx = (img.width-side)/2, sy=(img.height-side)/2;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      cb(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

/* ============================================================
   EXPORTAR VISOR ESTATICO (solo lectura, autocontenido)
   ============================================================ */
function imageAssetToDataUrl(src){
  if(src.startsWith('data:')) return Promise.resolve(src);
  return new Promise((resolve,reject)=>{
    const image = new Image();
    image.onload = ()=>{
      try{
        const canvas = document.createElement('canvas');
        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;
        canvas.getContext('2d').drawImage(image,0,0);
        resolve(canvas.toDataURL('image/jpeg',0.9));
      }catch(error){ reject(error); }
    };
    image.onerror = ()=>reject(new Error(`No se pudo leer ${src}`));
    image.src = new URL(src,document.baseURI).href;
  });
}

/* ============================================================
   ACUMULACIÓN DE BITÁCORA + PUBLICACIÓN EN GITHUB
   ============================================================ */
function bitKey(e){ return [e.fecha,e.maquina,e.horario||'',e.codigo||'',e.turno||''].join('|'); }
function bitSig(list){ return list.map(e=>(e.observacion||'').trim()+'¦'+(e.producto||'')).sort().join('§'); }
// Acumula: lo que llega reemplaza SOLO las entradas con la misma clave
// (fecha|máquina|horario|código|turno); todo lo demás se conserva. Re-pegar no duplica.
function mergeBitacora(existing, incoming){
  const groups = new Map();
  existing.forEach(e=>{ const k=bitKey(e); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(e); });
  const inc = new Map();
  incoming.forEach(e=>{ const k=bitKey(e); if(!inc.has(k)) inc.set(k,[]); inc.get(k).push(e); });
  let nuevas=0, actualizadas=0, iguales=0;
  inc.forEach((list,k)=>{
    const prev = groups.get(k);
    if(!prev){ nuevas += list.length; }
    else if(bitSig(prev)===bitSig(list)){ iguales += list.length; }
    else { actualizadas += list.length; }
    if(!prev || bitSig(prev)!==bitSig(list)) groups.set(k,list);
  });
  const merged = [].concat(...groups.values());
  merged.sort((a,b)=> a.fecha.localeCompare(b.fecha) || (a.maquina||'').localeCompare(b.maquina||'',undefined,{numeric:true}));
  return { merged, nuevas, actualizadas, iguales };
}
// Une lo publicado por otra persona con mis cambios locales (los míos ganan en conflicto)
function mergeStores(remote, local){
  const out = JSON.parse(JSON.stringify(remote));
  local.periods.forEach(p=>{ const i=out.periods.findIndex(x=>x.id===p.id); if(i>=0) out.periods[i]=p; else out.periods.push(p); });
  out.periods.sort((a,b)=>a.desde.localeCompare(b.desde)||a.hasta.localeCompare(b.hasta));
  out.bitacoraByMonth = out.bitacoraByMonth || {};
  Object.keys(local.bitacoraByMonth||{}).forEach(m=>{
    out.bitacoraByMonth[m] = mergeBitacora(out.bitacoraByMonth[m]||[], local.bitacoraByMonth[m]).merged;
  });
  out.excelRows = out.excelRows || {};
  Object.keys(local.excelRows||{}).forEach(m=>{
    const fs=new Set(local.excelRows[m].map(x=>x[0]));
    out.excelRows[m]=(out.excelRows[m]||[]).filter(x=>!fs.has(x[0])).concat(local.excelRows[m]);
  });
  out.encargados = local.encargados || out.encargados;
  out.lideres = Object.assign({}, out.lideres||{}, local.lideres||{});
  return out;
}
function b64encodeUtf8(str){
  const bytes = new TextEncoder().encode(str); let bin=''; const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+CH));
  return btoa(bin);
}

async function ghGetFile(c){
  const url=`https://api.github.com/repos/${c.owner}/${c.repo}/contents/data.json`;
  const h={Authorization:`Bearer ${c.token}`,Accept:'application/vnd.github+json'};
  const r=await fetch(url+'?t='+Date.now(),{headers:h,cache:'no-store'});
  if(r.status===404) return {exists:false};
  if(r.status===401) throw new Error('Token inválido o vencido.');
  if(!r.ok) throw new Error('GitHub respondió '+r.status);
  const j=await r.json();
  let text;
  if(j.content && j.encoding==='base64'){ text=new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\s/g,'')),ch=>ch.charCodeAt(0))); }
  else { const rr=await fetch(url,{headers:{...h,Accept:'application/vnd.github.raw+json'},cache:'no-store'}); text=await rr.text(); }
  return {exists:true, sha:j.sha, data:JSON.parse(text)};
}

let __publishing=false;
async function publishToGithub(){
  const c=ghConfig();
  if(!c.token){ openGhConfigModal(); return; }
  if(__publishing) return; __publishing=true;
  const btns=[...document.querySelectorAll('#btnPublish,#pubBarBtn')]; btns.forEach(b=>{b.disabled=true;b.textContent='Publicando…';});
  try{
    let lastErr;
    for(let intento=0; intento<2; intento++){
      const f=await ghGetFile(c);
      const meta=getMeta();
      let toPublish=state.store, merged=false;
      if(f.exists && (f.data.rev||0)!==(meta.baseRev||0)){ toPublish=mergeStores(f.data,state.store); hydrateStore(toPublish); merged=true; }
      toPublish.rev=(f.exists?(f.data.rev||0):0)+1;
      toPublish.updatedAt=new Date().toISOString();
      const body={message:`Actualización KPI (versión ${toPublish.rev})`,content:b64encodeUtf8(JSON.stringify(serializeStore(toPublish)))};
      if(f.exists) body.sha=f.sha;
      const r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/data.json`,{method:'PUT',headers:{Authorization:`Bearer ${c.token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
      if(r.status===409||r.status===422){ lastErr=new Error('Conflicto al guardar, reintentando'); continue; }
      if(r.status===401||r.status===403) throw new Error('El token no tiene permiso para escribir (Contents: Read and write) o venció.');
      if(r.status===404) throw new Error('No se encontró el repositorio. Revisa «Conexión GitHub».');
      if(!r.ok) throw new Error('GitHub respondió '+r.status);
      state.store=toPublish; saveStore(state.store,{clean:true}); setMeta({dirty:false,baseRev:toPublish.rev});
      if(merged){ const l=latestPeriod(state.store); state.activeMonth=l?periodMonth(l):state.activeMonth; if(!state.periodId||!state.store.periods.some(p=>p.id===state.periodId)) state.periodId=l?.id||null; }
      render(); updatePubBar();
      toast(`Publicado (versión ${toPublish.rev}). El equipo lo verá en 1–2 minutos.`);
      __publishing=false; return;
    }
    throw lastErr||new Error('No se pudo publicar');
  }catch(e){
    console.error(e); toast('No se pudo publicar: '+e.message);
    btns.forEach(b=>{b.disabled=false;b.textContent=b.id==='pubBarBtn'?'Publicar ahora':'Publicar en GitHub';});
  }
  __publishing=false;
}

/* ============================================================
   CARGA DE MES COMPLETO DESDE EXCEL MENSUAL («NN. Mes Ext.xlsx», hoja «Datos»)
   Lector .xlsx propio (sin librerías externas): descomprime con DecompressionStream.
   Mismas definiciones que «Reporte KPIs»: Producción=R, STD=S, Scrap=U+V+W,
   Sobrepeso=AF, Causas=AM..AS (PR,MP,MT,MN,C,PROY,P), Observaciones=BK, Turno=BL.
   ============================================================ */
async function xlsxInflate(data){
  const ds = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(ds).arrayBuffer());
}
async function xlsxOpenZip(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf);
  let e=u8.length-22; while(e>=0 && dv.getUint32(e,true)!==0x06054b50) e--;
  if(e<0) throw new Error('El archivo no es un Excel (.xlsx) válido.');
  const cnt=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const ents={}, dec=new TextDecoder();
  for(let i=0;i<cnt;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    ents[dec.decode(u8.subarray(p+46,p+46+nlen))]={method,csize,lho};
    p+=46+nlen+elen+clen;
  }
  return { has:n=>!!ents[n], async text(name){
    const en=ents[name]; if(!en) throw new Error('Falta «'+name+'» dentro del Excel.');
    const nl=dv.getUint16(en.lho+26,true), el=dv.getUint16(en.lho+28,true), s=en.lho+30+nl+el;
    const raw=u8.subarray(s,s+en.csize);
    return dec.decode(en.method===0 ? raw : await xlsxInflate(raw));
  }};
}
function xlsxUnescape(s){
  return s.replace(/_x000D_/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(m,n)=>String.fromCharCode(+n)).replace(/&#x([0-9a-fA-F]+);/g,(m,n)=>String.fromCharCode(parseInt(n,16))).replace(/&amp;/g,'&');
}
// Devuelve filas {A:..,B:..} de la hoja pedida, solo con las columnas pedidas.
async function xlsxReadSheet(buf, sheetName, wantCols){
  const zip=await xlsxOpenZip(buf);
  const wb=await zip.text('xl/workbook.xml');
  let rid=null; const sheetRe=/<sheet\b[^>]*>/g; let m;
  while((m=sheetRe.exec(wb))){
    const nm=(m[0].match(/\bname="([^"]*)"/)||[])[1]; if(nm!=null && xlsxUnescape(nm)===sheetName){ rid=(m[0].match(/\br:id="([^"]*)"/)||[])[1]; break; }
  }
  if(!rid) throw new Error('El Excel no tiene una hoja llamada «'+sheetName+'». ¿Es el archivo mensual «Ext»?');
  const rels=await zip.text('xl/_rels/workbook.xml.rels'); let target=null; const relRe=/<Relationship\b[^>]*>/g;
  while((m=relRe.exec(rels))){ if((m[0].match(/\bId="([^"]*)"/)||[])[1]===rid){ target=(m[0].match(/\bTarget="([^"]*)"/)||[])[1]; break; } }
  if(!target) throw new Error('No se pudo ubicar la hoja «'+sheetName+'».');
  const path=target.startsWith('/')?target.slice(1):'xl/'+target;
  const xml=await zip.text(path);
  const want=new Set(wantCols); const rows=[]; const needed=new Set();
  const rowRe=/<row\b[^>]*>([\s\S]*?)<\/row>/g; let rm, first=true;
  while((rm=rowRe.exec(xml))){
    const cells={}; const cellRe=/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let cm;
    while((cm=cellRe.exec(rm[1]))){
      const attrs=cm[1], body=cm[2]; if(body==null) continue;
      const ref=(attrs.match(/\br="([A-Z]+)\d+"/)||[])[1]; if(!ref || !want.has(ref)) continue;
      const t=(attrs.match(/\bt="([^"]*)"/)||[])[1];
      let v;
      if(t==='inlineStr'){ v=xlsxUnescape((body.match(/<t[^>]*>([\s\S]*?)<\/t>/g)||[]).map(x=>x.replace(/<[^>]+>/g,'')).join('')); }
      else { const vm=body.match(/<v>([\s\S]*?)<\/v>/); if(!vm) continue; v=vm[1];
        if(t==='s'){ needed.add(+v); v={sst:+v}; }
        else if(t==='str'||t==='e'){ v=xlsxUnescape(v); }
        else if(t==='b'){ v=v==='1'; }
        else { v=parseFloat(v); } }
      cells[ref]=v;
    }
    rows.push(cells);
  }
  if(needed.size){
    const sst=await zip.text('xl/sharedStrings.xml'); const siRe=/<si>([\s\S]*?)<\/si>|<si\/>/g; let sm, idx=0; const table=new Map();
    while((sm=siRe.exec(sst))){
      if(needed.has(idx)) table.set(idx, xlsxUnescape(((sm[1]||'').match(/<t[^>]*>([\s\S]*?)<\/t>/g)||[]).map(x=>x.replace(/<[^>]+>/g,'')).join('')));
      idx++;
    }
    rows.forEach(r=>{ for(const k in r){ const v=r[k]; if(v && typeof v==='object' && 'sst' in v) r[k]=table.get(v.sst)??''; } });
  }
  return rows;
}
function excelSerialToISO(n){ const d=new Date(Date.UTC(1899,11,30)+Math.floor(n)*86400000); return d.toISOString().slice(0,10); }

// Extrae de «Datos»: filas diarias COMPACTAS por mes (se guardan) + bitácora
function extractDatos(rows){
  const maqNave={}; Object.keys(NAVES).forEach(n=>NAVES[n].forEach(m=>maqNave[m]=n));
  const CC=['AM','AN','AO','AP','AQ','AR','AS'];
  const stats={filas:0, dias:0, maqDesconocidas:{}, sinFecha:0, meses:{}};
  const daily={}, bit=[]; const r2=x=>Math.round(x*100)/100;
  rows.forEach(r=>{
    const maq=typeof r.B==='string'?r.B.trim():''; if(!maq) return;
    if(typeof r.A!=='number'){ if(!/^fecha$/i.test(String(r.A||'').trim())) stats.sinFecha++; return; }
    const fecha=excelSerialToISO(r.A), turno=String(r.BL||'').trim(), ti=TURNOS.indexOf(turno);
    if(ti<0) return;
    if(!maqNave[maq]){ stats.maqDesconocidas[maq]=(stats.maqDesconocidas[maq]||0)+1; return; }
    const n=x=>(typeof x==='number'&&isFinite(x))?x:0;
    stats.filas++;
    (daily[fecha.slice(0,7)]=daily[fecha.slice(0,7)]||[]).push([fecha,ti,maq,r2(n(r.R)),r2(n(r.S)),r2(n(r.U)+n(r.V)+n(r.W)),r2(n(r.AF)),...CC.map(c=>r2(n(r[c])))]);
    const obs=typeof r.BK==='string'?r.BK.trim():'';
    if(obs) bit.push({fecha,maquina:maq,horario:String(r.C||'').trim(),codigo:r.D==null?'':String(r.D).trim(),producto:String(r.E||'').trim(),observacion:obs,turno,nave:maqNave[maq]});
  });
  Object.keys(daily).forEach(m=>{ daily[m].sort((a,b)=>a[0].localeCompare(b[0])); stats.meses[m]=new Set(daily[m].map(x=>x[0])).size; });
  return {daily, bit, stats};
}
// Cortes diarios acumulados (mismo formato de siempre) a partir de las filas diarias compactas
function periodsFromDaily(daily, onlyMonths){
  const maqNave={}; Object.keys(NAVES).forEach(n=>NAVES[n].forEach(m=>maqNave[m]=n));
  const periods=[];
  (onlyMonths||Object.keys(daily)).sort().forEach(mes=>{
    const list=(daily[mes]||[]).slice().sort((a,b)=>a[0].localeCompare(b[0]));
    const acc={}; TURNOS.forEach((t,ti)=>{ acc[ti]={}; Object.keys(maqNave).forEach(m=>acc[ti][m]={prod:0,std:0,scrap:0,over:0,causas:[0,0,0,0,0,0,0]}); });

function hydrateStore(store){

async function importMonthFile(file){
  const buf=await file.arrayBuffer();
  const rows=await xlsxReadSheet(buf,'Datos',['A','B','C','D','E','R','S','U','V','W','AF','AM','AN','AO','AP','AQ','AR','AS','BK','BL']);
  const r=extractDatos(rows);
  const meses=Object.keys(r.daily);
  if(!meses.length) throw new Error('No se encontraron filas con fecha, máquina y turno en la hoja «Datos».');
  if(!state.store.excelRows) state.store.excelRows={};
  meses.forEach(m=>{
    const fechas=new Set(r.daily[m].map(x=>x[0]));
    state.store.excelRows[m]=(state.store.excelRows[m]||[]).filter(x=>!fechas.has(x[0])).concat(r.daily[m]);
  });
  state.store.periods=state.store.periods.filter(p=>!(p.fuente==='excel-mensual' && meses.includes(String(p.desde).slice(0,7))));
  periodsFromDaily(state.store.excelRows,meses).forEach(p=>upsertPeriod(state.store,p));
  if(!state.store.bitacoraByMonth) state.store.bitacoraByMonth={};
  const info={nuevas:0,actualizadas:0,iguales:0}; const porMes={};
  r.bit.forEach(e=>{ (porMes[e.fecha.slice(0,7)]=porMes[e.fecha.slice(0,7)]||[]).push(e); });
  Object.keys(porMes).forEach(mes=>{ const x=mergeBitacora(state.store.bitacoraByMonth[mes]||[],porMes[mes]); state.store.bitacoraByMonth[mes]=x.merged; info.nuevas+=x.nuevas; info.actualizadas+=x.actualizadas; info.iguales+=x.iguales; });
  saveStore(state.store);
  const l=latestPeriod(state.store); state.activeMonth=l?periodMonth(l):null; state.periodId=l?.id||null;
  return {stats:r.stats, bitTotal:r.bit.length, sinNovedad:r.bit.filter(e=>/^sin novedad\.?$/i.test(e.observacion)).length, info};
}

// ---------- mapa de calor ----------
function divColor(t){
  const dk=isDark(), n=dk?[70,70,128]:[240,239,236], b=dk?[84,160,245]:[42,120,214], r=dk?[240,96,92]:[227,73,72]; t=Math.max(-1,Math.min(1,t)); const p=t>=0?b:r, a=Math.abs(t);
  return `rgb(${n.map((c,i)=>Math.round(c+(p[i]-c)*a)).join(',')})`;
}
function heatCardHTML(){
  const v=V(), ds=(state.ds||[]).filter(r=>!r.bad); const metric=v.hmMetric; const M=VIZ_METRICS[metric];
  const tsel=v.hmTurno==='all'?TURNOS:[v.hmTurno];
  const head=`<div class="viz-head"><div><div class="viz-title">Mapa de calor por máquina</div><div class="viz-sub">${esc(M.label)} de cada día vs. meta (${fmtPct0(M.meta())}) · ${v.hmTurno==='all'?'todos los turnos':esc(v.hmTurno)}</div></div>
    <div class="viz-ctrls">${segHTML('hmMetric',metric,[['efic','Eficiencia'],['scrap','Scrap']])}${segHTML('hmTurno',v.hmTurno,[['all','Todos'],['Turno 1','T1'],['Turno 2','T2'],['Turno 3','T3']])}</div></div>`;
  if(ds.length<1) return head+`<div class="trend-empty">Sin cortes en este mes.</div>`;
  const span=metric==='efic'?0.20:0.10, mv=M.meta();
  const cw=Math.max(20,Math.min(60,Math.floor(900/ds.length))), ch=22, gap=2, labW=58, grpGap=22, top=22;
  let y=top, svg='', cells=0, tbody='';
  Object.keys(NAVES).forEach(nave=>{
    svg+=`<text x="0" y="${y+12}" font-size="10.5" font-weight="700" fill="var(--viz-muted)" letter-spacing=".06em">${nave.toUpperCase()}</text>`; y+=grpGap-6;
    NAVES[nave].forEach(mq=>{
      svg+=`<text x="${labW-8}" y="${y+ch/2+4}" font-size="11.5" font-weight="600" fill="var(--viz-secondary)" text-anchor="end">${mq}</text>`;
      let trow=`<tr><th>${mq}</th>`;
      ds.forEach((r,i)=>{
        const a=dsSum(Object.fromEntries(TURNOS.map(t=>[t,(r.mq[mq]||{})[t]])),tsel);
        const val=dsValue(a,metric); const x=labW+i*(cw+gap);
        const fill=val==null?'var(--cell-empty)':divColor(metric==='efic'?(val-mv)/span:(mv-val)/span);
        const tip=val==null?`${mq} · ${rowRangeLabel(r)}|${MAQ_INSTALACION[mq]?MAQ_INSTALACION[mq].toLowerCase()+' · aún sin datos':'sin programa'}|`:`${mq} · ${rowRangeLabel(r)}|${M.label}: ${fmtPct(val)}|${fmtInt(a.k)} kg producidos`;
        svg+=`<rect class="hm-cell" x="${x}" y="${y}" width="${cw}" height="${ch}" rx="3" fill="${fill}" data-tip="${esc(tip)}"/>`;
        trow+=`<td>${val==null?'—':fmtPct(val)}</td>`; cells++;
      });
      tbody+=trow+'</tr>'; y+=ch+gap;
    });
    y+=grpGap-gap;
  });
  const wTot=labW+ds.length*(cw+gap);
  const cols=ds.map((r,i)=>`<text x="${labW+i*(cw+gap)+cw/2}" y="12" font-size="10" fill="var(--viz-muted)" text-anchor="middle">${dayNum(r.fecha)}</text>`).join('');
  const table=`<details class="viz-table"><summary>Ver tabla de datos</summary><div class="tbl-wrap"><table><thead><tr><th>Máquina</th>${ds.map(r=>`<th>${dayNum(r.fecha)}</th>`).join('')}</tr></thead><tbody>${tbody}</tbody></table></div></details>`;
  const lg=`<div class="hm-legend"><span>${metric==='efic'?'bajo la meta':'sobre la meta'}</span><i class="hm-bar"></i><span>${metric==='efic'?'sobre la meta':'bajo la meta'}</span><span class="hm-none"><i></i>sin programa</span></div>`;
  return `${head}<div class="hm-scroll"><svg class="hm" viewBox="0 0 ${wTot} ${y}" width="${wTot}" height="${y}" role="img" aria-label="Mapa de calor de ${M.label.toLowerCase()} por máquina y día. Los mismos datos están en la tabla de abajo.">${cols}${svg}</svg></div>${lg}${table}`;
}
function spark(vals,color){
  const pts=vals.map((v,i)=>({v,i})).filter(p=>p.v!=null); if(pts.length<2) return '';
  const w=120,h=32,lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v)),n=vals.length-1||1;
  const X=i=>2+(w-4)*i/n, Y=v=>3+(h-6)*(1-(v-lo)/((hi-lo)||1));
  const d=pts.map((p,k)=>`${k?'L':'M'}${X(p.i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' '), l=pts[pts.length-1];
  const area=`${d} L${X(pts[pts.length-1].i).toFixed(1)},${h} L${X(pts[0].i).toFixed(1)},${h} Z`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="${area}" fill="${color}" opacity=".13"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(l.i).toFixed(1)}" cy="${Y(l.v).toFixed(1)}" r="3.2" fill="${color}" stroke="var(--card)" stroke-width="1.5"/></svg>`;
}
// ---------- interacción global (delegada) ----------
(function initViz(){
  let tip=null;
  const getTip=()=>{ if(!tip){ tip=document.createElement('div'); tip.className='viz-tip'; tip.setAttribute('role','status'); document.body.appendChild(tip); } return tip; };
  const hide=()=>{ if(tip) tip.style.opacity='0'; document.querySelectorAll('.iv-x').forEach(l=>l.setAttribute('opacity','0')); document.querySelectorAll('.iv-dots').forEach(g=>g.replaceChildren()); };
  const place=(cx,cy)=>{ const t=getTip(); t.style.opacity='1'; const w=t.offsetWidth, h=t.offsetHeight; let x=cx+14, y=cy-h-10; if(x+w>innerWidth-8) x=cx-w-14; if(y<8) y=cy+16; t.style.left=Math.max(8,x)+'px'; t.style.top=y+'px'; };
  const fill=(title,rows)=>{ const t=getTip(); t.replaceChildren(); const h=document.createElement('div'); h.className='vt-title'; h.textContent=title; t.appendChild(h);
    rows.forEach(r=>{ const d=document.createElement('div'); d.className='vt-row'; if(r.color){ const k=document.createElement('i'); k.style.background=r.color; d.appendChild(k); } const v=document.createElement('b'); v.textContent=r.text; d.appendChild(v); if(r.name){ const n=document.createElement('span'); n.textContent=r.name; d.appendChild(n); } t.appendChild(d); }); };
  function showIv(svg, idx){
    const reg=window.__iv[svg.dataset.iv]; if(!reg) return; const sx=reg.xs[idx];
    const line=svg.querySelector('.iv-x'); line.setAttribute('x1',sx); line.setAttribute('x2',sx); line.setAttribute('opacity','.5');
    const g=svg.querySelector('.iv-dots'); g.replaceChildren();
    reg.ys[idx].forEach((y,k)=>{ if(y==null) return; const c=document.createElementNS('http://www.w3.org/2000/svg','circle'); c.setAttribute('cx',sx); c.setAttribute('cy',y); c.setAttribute('r',5); c.setAttribute('fill',reg.colors[k]); c.setAttribute('stroke','var(--card)'); c.setAttribute('stroke-width',2); g.appendChild(c); });
    const it=reg.items[idx]; fill(it.title,it.rows);
    const rc=svg.getBoundingClientRect(); const firstY=reg.ys[idx].find(y=>y!=null); place(rc.left+sx*rc.width/reg.W, rc.top+(firstY==null?reg.H/2:firstY)*rc.height/reg.H);
    svg.dataset.idx=idx;
  }
  document.addEventListener('pointermove',e=>{
    const svg=e.target.closest&&e.target.closest('svg.iv');
    if(svg){ const reg=window.__iv[svg.dataset.iv]; if(!reg) return; const rc=svg.getBoundingClientRect(); const px=(e.clientX-rc.left)/rc.width*reg.W;
      let best=0,bd=1e9; reg.xs.forEach((x,i)=>{ const d=Math.abs(x-px); if(d<bd){bd=d;best=i;} }); showIv(svg,best); return; }
    const cell=e.target.closest&&e.target.closest('.hm-cell,.tip-el');
    if(cell){ const [a,b,c]=cell.dataset.tip.split('|'); fill(a,[{text:b},...(c?[{text:c}]:[])]); place(e.clientX,e.clientY); return; }
    hide();
  });
  document.addEventListener('pointerleave',hide,true);
  document.addEventListener('scroll',hide,true);
  document.addEventListener('keydown',e=>{
    const svg=e.target.closest&&e.target.closest('svg.iv'); if(!svg) return; const reg=window.__iv[svg.dataset.iv]; if(!reg) return;
    let i=+(svg.dataset.idx||reg.xs.length-1);
    if(e.key==='ArrowLeft') i=Math.max(0,i-1); else if(e.key==='ArrowRight') i=Math.min(reg.xs.length-1,i+1); else if(e.key==='Escape'){ hide(); return; } else return;
    e.preventDefault(); showIv(svg,i);
  });
  document.addEventListener('focusout',e=>{ if(e.target.closest&&e.target.closest('svg.iv')) hide(); });
  let wasMob=innerWidth<640, rt=null;
  addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{ const m=innerWidth<640; if(m===wasMob) return; wasMob=m; const dc=document.getElementById('dailyCard'); if(dc) dc.innerHTML=dailyCardHTML(); },150); });
  document.addEventListener('click',e=>{
    const b=e.target.closest&&e.target.closest('button[data-viz]'); if(!b) return;
    const v=V(); v[b.dataset.viz]=b.dataset.val; hide();
    const dc=document.getElementById('dailyCard'), hc=document.getElementById('heatCard');
    if(b.dataset.viz==='metric'||b.dataset.viz==='mode'){ if(dc) dc.innerHTML=dailyCardHTML(); } else { if(hc) hc.innerHTML=heatCardHTML(); }
  });
})();

/* ============================================================
   ARRANQUE
   ============================================================ */
const REAL_MACHINE_NAMES=Object.values(NAVES).flat();
const REAL_CAUSE_CODES=['PR','MP','MT','MN','C','PROY','P'];
const REAL_START_SERIAL=46266;
async function loadCachedRealRows(){
  if(!window.KPI_REAL_GZIP || !window.DecompressionStream) throw new Error('No se pudo leer la caché comprimida del Excel.');
  const bytes=Uint8Array.from(atob(window.KPI_REAL_GZIP),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}
function newRealShift(){
  const naves={};
  Object.keys(NAVES).forEach(nave=>{
    naves[nave]={encargado:'Por definir',maquinas:NAVES[nave].map(maquina=>({maquina,std:0,prod:0,scrap:0,overKg:0,sobrepeso:0,causas:emptyCausas()})),std:0,prod:0,scrap:0,overKg:0,sobrepeso:0,eficiencia:0,causas:emptyCausas()};
  });
  return {jefePlanta:'',kilos:0,sobrepeso:0,overKg:0,scrap:0,std:0,eficiencia:0,causas:emptyCausas(),naves};
}
async function buildCachedSeptemberPeriods(){
  const source=await loadCachedRealRows();
  const rows=source.rows;
  const events=source.events;
  const septemberEvents=events.map(event=>{
    const maquina=REAL_MACHINE_NAMES[event[2]];
    return {fecha:`2026-09-${String(event[0]+1).padStart(2,'0')}`,turno:TURNOS[event[1]],maquina,nave:naveOf(maquina)||'',observacion:event[3]};
  });
  const reportDuplicate=septemberEvents.find(event=>event.fecha==='2026-09-25'&&event.turno==='Turno 3'&&event.maquina==='E 51');
  if(reportDuplicate) septemberEvents.push({...reportDuplicate});
  const bitacoraByMonth={'2026-09':septemberEvents};
  const periods=[];
  for(let day=0;day<29;day++){
    const turnos={};
    TURNOS.forEach((turno,ti)=>{turnos[turno]=newRealShift();turnos[turno].jefePlanta=JEFES_PLANTA[turno];});
    rows.forEach(row=>{
      if(row[0]>day) return;
      const shift=turnos[TURNOS[row[1]]];
      const machineName=REAL_MACHINE_NAMES[row[2]];
      const naveName=naveOf(machineName);
      if(!shift || !naveName) return;
      const machine=shift.naves[naveName].maquinas.find(item=>item.maquina===machineName);
      const prod=row[3],std=row[4],scrap=row[5]+row[6]+row[7],overKg=row[8];
      shift.kilos+=prod; shift.std+=std; shift.scrap+=scrap; shift.overKg+=overKg;
      machine.prod+=prod; machine.std+=std; machine.scrap+=scrap; machine.overKg+=overKg;
      REAL_CAUSE_CODES.forEach((code,index)=>{
        const value=row[9+index]||0;
        shift.causas[code]+=value;
        machine.causas[code]+=value;
      });
    });
    TURNOS.forEach(turno=>{
      const shift=turnos[turno];
      shift.kilos=Math.round(shift.kilos);
      shift.std=Math.round(shift.std);
      shift.scrap=Math.round(shift.scrap);
      shift.eficiencia=safeEff(shift.kilos,shift.std);
      shift.sobrepeso=shift.kilos?shift.overKg/shift.kilos:0;
      Object.keys(NAVES).forEach(naveName=>{
        const nave=shift.naves[naveName];
        nave.encargado=DEFAULT_ENCARGADOS[turno][naveName];
        nave.maquinas.forEach(machine=>{
          machine.sobrepeso=machine.prod?machine.overKg/machine.prod:0;
          nave.prod+=machine.prod; nave.std+=machine.std; nave.scrap+=machine.scrap; nave.overKg+=machine.overKg;
          CAUSAS.forEach(cause=>{nave.causas[cause.code]+=machine.causas[cause.code];});
        });
        nave.sobrepeso=nave.maquinas.length?nave.maquinas.reduce((sum,machine)=>sum+machine.sobrepeso,0)/nave.maquinas.length:0;
        nave.eficiencia=safeEff(nave.prod,nave.std);
      });
      delete shift.overKg;
      Object.values(shift.naves).forEach(nave=>delete nave.overKg);
      shift.sobrepeso=shift.sobrepeso||0;
    });
    turnos['Turno 3'].naves['Nave 1'].encargado='Gonzalo Nuñez';
    turnos['Turno 3'].naves['Nave 2'].encargado='Hector Pineda';
    turnos['Turno 3'].naves['Nave 3'].encargado='Hanner Carabali';
    const date=`2026-09-${String(day+1).padStart(2,'0')}`;
    periods.push({id:`2026-09-01_${date}`,desde:'2026-09-01',hasta:date,importedAt:`${date}T12:00:00.000Z`,turnos,bitacora:[],demo:false,real:true});
  }
  return {periods,bitacoraByMonth,encargados:JSON.parse(JSON.stringify(DEFAULT_ENCARGADOS)),lideres:{}};
}
window.__REAL_SEPTEMBER__=true;
window.__CUMULATIVE_MONTHLY__=true;
async function fetchRemoteData(){
  try{
    const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) return null;
    const j=await r.json();
    return (j && Array.isArray(j.periods)) ? j : null;
  }catch(e){ return null; }
}
// Solo los dispositivos de quien edita ven el botón «Editar». Se activan una vez abriendo el link con ?editor
function isEditorDevice(){
  try{
    if(/[?&#]editor\b/.test(location.search+location.hash)) localStorage.setItem('kpiExtrusionApp_editor','1');
    return localStorage.getItem('kpiExtrusionApp_editor')==='1' || !!ghConfig().token;
  }catch(e){ return false; }
}
async function bootCore(opts){
  opts=opts||{};
  window.__READONLY__=!isEditorDevice();
  const remote=await fetchRemoteData();
  const cfg=ghConfig(), meta=getMeta();
  const hasLocal=localStorage.getItem(STORAGE_KEY)!==null;
  const isEditor=!!cfg.token;
  let useLocal=false;
  if(opts.ignoreLocal){ window.__NO_LOCAL_WRITE=true; }
  else if(hasLocal && isEditor){
    if(meta.dirty) useLocal=true;                                   // cambios propios sin publicar
    else if(remote && (meta.baseRev||0) > (remote.rev||0)) useLocal=true; // Pages aún no refleja mi última publicación
  }
  if(!remote && hasLocal && !opts.ignoreLocal) useLocal=true;       // sin data.json publicado: lo local es lo único que hay
  let st;
  if(useLocal){
    st=await loadStoreAsync();
    if(!remote && meta.dirty===undefined){ meta.dirty=true; setMeta(meta); }
    if(!st.periods.length && !remote){
      try{ const sd=await buildCachedSeptemberPeriods(); if(sd.periods.length) st=sd; }catch(e){}
    }
  } else if(remote){
    st=remote;
    setMeta({dirty:false, baseRev:remote.rev||0});
  } else if(opts.ignoreLocal){
    st={periods:[],bitacoraByMonth:{},encargados:JSON.parse(JSON.stringify(DEFAULT_ENCARGADOS)),lideres:{}};
  } else {
    try{ st=await buildCachedSeptemberPeriods(); }
    catch(e){ st={periods:[],bitacoraByMonth:{},encargados:JSON.parse(JSON.stringify(DEFAULT_ENCARGADOS)),lideres:{}}; }
  }
  st.periods=(Array.isArray(st.periods)?st.periods:[]).filter(x=>x && x.id && x.desde && x.hasta && x.turnos);
  if(!st.bitacoraByMonth || typeof st.bitacoraByMonth!=='object') st.bitacoraByMonth={};
  state.store=st;
  if(!state.store.encargados) state.store.encargados=JSON.parse(JSON.stringify(DEFAULT_ENCARGADOS));
  if(!state.store.lideres) state.store.lideres={};
  hydrateStore(state.store);
  if(normalizeBitacoraStore(state.store)) saveStore(state.store);
  const latest=latestPeriod(state.store);
  state.activeMonth=latest?periodMonth(latest):null;
  state.periodId=latest?.id||null;
  document.title='KPI Extrusion - Periodos mensuales';
  render();
  updatePubBar();
}
function showBootError(e1,e2){
  const det=[e1,e2].filter(Boolean).map(e=>esc((e&&e.message)||String(e))+(e&&e.stack?' — '+esc(String(e.stack).split('\n').slice(1,3).join(' ').trim()):'')).join('<br>');
  document.getElementById('app').innerHTML=`<div class="empty-state" style="max-width:560px;margin:40px auto;text-align:left;">
    <b>No se pudo abrir la aplicación.</b><br>Tus datos publicados en GitHub no se han tocado.<br><br>
    <button class="btn primary" id="btnBootRetry" style="margin-right:8px;">Reintentar</button>
    <button class="btn secondary" id="btnBootReset">Borrar copia local y reintentar</button>
    <p style="font-size:11px;margin-top:14px;word-break:break-word;">Detalle técnico (envíalo si el problema sigue):<br>${det}</p></div>`;
  document.getElementById('btnBootRetry').onclick=()=>location.reload();
  document.getElementById('btnBootReset').onclick=()=>{ if(!confirm('Se borrará solo la copia local de este navegador (lo ya publicado en GitHub no se toca; lo no publicado se pierde). ¿Continuar?')) return; try{ localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(META_KEY); }catch(e){} location.reload(); };
}
async function boot(){
  try{ await bootCore({}); }
  catch(e1){
    console.error('Arranque normal falló:',e1);
    try{ await bootCore({ignoreLocal:true}); toast('Hubo un problema con la copia local de este navegador; se cargó lo publicado en GitHub.'); }
    catch(e2){ console.error('Arranque seguro falló:',e2); showBootError(e1,e2); }
  }
}
document.addEventListener('DOMContentLoaded',()=>boot().catch(error=>showBootError(error)));
