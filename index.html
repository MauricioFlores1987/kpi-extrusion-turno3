:root{
  --navy:#2A2670; --navy-dark:#1B1850; --navy-tint:#EEEDF8;
  --yellow:#F5E202; --ink:#1A1745; --muted:#6B6E85;
  --bg:#F5F5FA; --card:#FFFFFF;
  --ok:#12703B; --ok-bg:#E8F7EE;
  --warn:#8A6200; --warn-bg:#FDF6DE;
  --bad:#C0392B; --bad-bg:#FBEAE8;
  --line:#E4E3F0; --radius:16px;
  --c-pr:#2A2670; --c-mp:#25829A; --c-mt:#8B7FD6; --c-mn:#C0392B;
  --c-c:#B8860B; --c-proy:#178A4C; --c-p:#6B6E85;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(rgba(42,38,112,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(42,38,112,.025) 1px,transparent 1px);background-size:28px 28px;}
#app{
  font-family:"Inter","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); max-width:1440px; margin:0 auto;
  min-height:100vh; padding-bottom:56px; font-variant-numeric:tabular-nums;
  box-shadow:0 0 48px rgba(27,24,80,.07);
}
a{color:inherit;}
button{font-family:inherit;}
.header{
  background:linear-gradient(115deg,var(--navy-dark) 0%,var(--navy) 100%);
  padding:calc(16px + env(safe-area-inset-top,0px)) 28px 16px;
  position:sticky; top:0; z-index:30; box-shadow:0 5px 18px rgba(27,24,80,.2);border-top:4px solid var(--yellow);
}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
.brand{display:flex;flex-direction:column;color:#fff;}
.brand .t1{font-size:20px;font-weight:800;color:var(--yellow);line-height:1.15;}
.brand .t2{font-size:16px;font-weight:700;color:#fff;margin-top:7px;white-space:nowrap;}
.brand .t3{font-size:11px;color:rgba(255,255,255,.7);margin-top:3px;}
.brand-mark{display:inline-flex;align-items:center;justify-content:flex-start;min-height:38px;max-width:min(270px,62vw);padding:0;background:transparent;}
.brand-logo{display:block;width:auto;height:auto;max-width:100%;max-height:48px;object-fit:contain;object-position:left center;}
.brand-fallback{font-size:23px;font-weight:900;line-height:1;color:#fff;letter-spacing:0;}
.edit-toggle{
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.28); color:#fff;
  border-radius:20px; padding:7px 13px; font-size:12px; font-weight:600;
  display:flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap;
}
.edit-toggle.active{background:var(--yellow);color:var(--navy-dark);border-color:var(--yellow);}
.period-row{display:flex;align-items:center;gap:8px;}
.period-select{
  flex:1; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.28); color:#fff;
  border-radius:10px; padding:9px 10px; font-size:12.5px; font-weight:600; appearance:none;
}
.period-select option{color:#111;}
.icon-btn{
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.28); color:#fff;
  border-radius:10px; width:36px; height:36px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0; font-size:16px;
}
.tabbar{display:flex;gap:6px;margin-top:12px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;}
.tabbar::-webkit-scrollbar{display:none;}
.tab-btn{
  flex-shrink:0; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); color:rgba(255,255,255,.85);
  border-radius:20px; padding:7px 14px; font-size:12.5px; font-weight:600; cursor:pointer;
}
.tab-btn.active{background:var(--yellow);color:var(--navy-dark);border-color:var(--yellow);}
.content{padding:24px 28px;}
.view-content > .section.editor-panel{grid-column:1 / -1 !important;width:100%;max-width:640px;}
.section{margin-bottom:22px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
.section-head h2{font-size:15px;margin:0;font-weight:700;}
.section-head .hint{font-size:11.5px;color:var(--muted);}
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 2px 8px rgba(27,52,46,.045);border:1px solid var(--line);}
.card + .card{margin-top:10px;}
[style*="display:grid"] > .card + .card{margin-top:0;}
.kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.kpi-card{background:var(--card);border-radius:9px;padding:16px;border:1px solid var(--line);border-top:3px solid var(--navy);}
.kpi-card .lbl{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px;}
.kpi-card .val{font-size:22px;font-weight:800;line-height:1.1;}
.kpi-card .sub{font-size:11px;margin-top:4px;font-weight:600;}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.pill.ok{background:var(--ok-bg);color:var(--ok);}
.pill.warn{background:var(--warn-bg);color:var(--warn);}
.pill.bad{background:var(--bad-bg);color:var(--bad);}
.pill.na{background:var(--track);color:var(--muted);}
.turno-summary{display:flex;gap:8px;}
.turno-summary .tcard{flex:1;background:var(--card);border-radius:9px;padding:14px;border:1px solid var(--line);text-align:center;}
.turno-summary .tcard .t{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.turno-summary .tcard .e{font-size:19px;font-weight:800;margin-top:3px;}
.nave-block{margin-bottom:12px;}
.nave-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:9px;cursor:pointer;}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0;}
.avatar.pending{background:var(--card);border:2px dashed #C7C5DE;color:var(--muted);}
.nave-head .info{flex:1;min-width:0;}
.nave-head .name{font-size:13.5px;font-weight:700;}
.nave-head .role{font-size:11px;color:var(--muted);}
.nave-head .eff{font-size:15px;font-weight:800;}
.nave-metrics{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.nave-metric{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:60px;line-height:1.15;}
.nave-metric span{font-size:9px;color:var(--muted);font-weight:600;}
.nave-metric b{font-size:12px;font-weight:800;}
.nave-head .chev{color:var(--muted);transition:transform .15s;}
.nave-head.open .chev{transform:rotate(180deg);}
.nave-body{background:var(--card);border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px;padding:0 14px 14px;display:none;}
.nave-body.open{display:block;}
table.mtable{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
table.mtable th{text-align:right;color:var(--muted);font-weight:600;font-size:10.5px;padding:6px 4px;border-bottom:1px solid var(--line);}
table.mtable th:first-child, table.mtable td:first-child{text-align:left;}
table.mtable td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line);}
table.mtable tr.tot td{font-weight:800;border-top:1.5px solid var(--ink);border-bottom:none;}
.link-btn{background:none;border:none;color:var(--navy);font-size:11.5px;font-weight:700;cursor:pointer;padding:0;text-decoration:underline;}
.chart-wrap{margin-top:6px;}
.nave-body .chart-wrap .svg-chart{max-width:720px;}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.legend .li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
.legend .sw{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.insight{display:flex;gap:10px;padding:12px;border-radius:12px;background:var(--navy-tint);margin-bottom:8px;font-size:12.5px;line-height:1.4;}
.insight .ic{flex-shrink:0;}
.bitacora-item{padding:12px 0;border-bottom:1px solid var(--line);}
.bitacora-item:last-child{border-bottom:none;}
.bitacora-item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px;}

.filters-row{display:flex;gap:8px;margin-bottom:12px;}
.filters-row select, .filters-row input{
  flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:12.5px;background:var(--card);color:var(--ink);
}
.empty-state{text-align:center;padding:32px 16px;color:var(--muted);font-size:13px;}
.fab-row{display:flex;gap:10px;margin-top:4px;}
.btn{border:none;border-radius:12px;padding:12px 16px;font-size:13px;font-weight:700;cursor:pointer;flex:1;}
.btn.primary{background:var(--navy);color:#fff;}

.modal-overlay{position:fixed;inset:0;background:rgba(20,18,50,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;}

.modal{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px;max-height:88vh;overflow-y:auto;}
.modal-overlay.centered .modal{border-radius:18px;}
.modal h3{margin:0 0 14px;font-size:16px;}

.pin-dots{display:flex;gap:10px;justify-content:center;margin:18px 0;}
.pin-dots .d{width:14px;height:14px;border-radius:50%;border:2px solid var(--navy);}
.pin-dots .d.filled{background:var(--navy);}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.numpad button{padding:16px;font-size:19px;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);}
.numpad button.wide{grid-column:span 1;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;}
.field input, .field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;}
.period-list-item{display:flex;align-items:center;justify-content:between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.period-list-item .pinfo{flex:1;}
.period-list-item .pinfo b{display:block;font-size:13px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:24px;font-size:12.5px;font-weight:600;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.25);}
.svg-chart{width:100%;height:auto;display:block;}
.svg-chart text{font-family:inherit;}
.trend-empty{font-size:11.5px;color:var(--muted);text-align:center;padding:12px;}
.trend-card{padding:16px 18px;}
.trend-chart-desktop{display:none;}
.trend-chart-mobile{display:block;}
.trend-axis-label{font-size:10px;fill:var(--muted);}
.avatar{position:relative;overflow:hidden;}
.avatar img{position:absolute;inset:0;z-index:2;display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;}
.avatar-initials{position:relative;z-index:0;}

  [data-view="planta"] .view-content > .section.half{grid-column:span 6;}
  [data-view^="Turno"] .view-content{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:22px;align-items:start;}
  [data-view^="Turno"] .content > .section:nth-of-type(1),

  .nave-head{display:grid;grid-template-columns:64px minmax(0,1fr) 18px;grid-template-areas:"avatar info chev" "metrics metrics metrics";row-gap:10px;}

@media(prefers-color-scheme:dark){}

/* ===== Alternativa A: visualización, accesibilidad ===== */
:root{--grid:#E8E7F1;--axis:#C9C8D8;--viz-muted:#6B6E85;--viz-secondary:#3F4160;--cell-empty:#ECECF3;}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px;border-radius:4px;}
.header :focus-visible,.header button:focus-visible{outline-color:var(--yellow);}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);}
.seg button{border:0;background:transparent;padding:7px 12px;font:600 12px/1 inherit;color:var(--ink);cursor:pointer;min-height:34px;}
.seg button+button{border-left:1px solid var(--line);}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;}
.seg button:hover:not([aria-pressed="true"]){background:var(--navy-tint);}
.viz-head{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.viz-title{display:none;}
.viz-tip{font-family:"Inter","Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--ink);}
.viz-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.viz-ctrls{display:flex;flex-wrap:wrap;gap:8px;}
.iv-wrap{position:relative;}
svg.iv{width:100%;height:auto;display:block;touch-action:pan-y;border-radius:8px;}
.viz-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--viz-secondary);margin-bottom:6px;}
.viz-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle;}
.viz-note{font-size:12px;color:var(--ink);margin-top:10px;padding:9px 12px;background:var(--navy-tint);border-radius:8px;line-height:1.5;}
.viz-table{margin-top:10px;font-size:12px;}
.viz-table summary{cursor:pointer;color:var(--navy);font-weight:700;min-height:28px;}
.tbl-wrap{overflow:auto;max-height:280px;margin-top:6px;border:1px solid var(--line);border-radius:8px;}
.viz-table table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;}
.viz-table th,.viz-table td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;}
.viz-table th:first-child,.viz-table td:first-child{text-align:left;position:sticky;left:0;background:var(--card);}
.viz-table thead th{position:sticky;top:0;background:var(--navy-tint);}
.viz-tip{position:fixed;z-index:100;pointer-events:none;opacity:0;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 24px rgba(27,24,80,.2);border-radius:10px;padding:8px 11px;font-size:12px;max-width:260px;transition:opacity .08s;}
.vt-title{font-weight:700;color:var(--ink);margin-bottom:4px;}
.vt-row{display:flex;gap:7px;align-items:center;line-height:1.5;}
.vt-row i{display:inline-block;width:14px;height:3px;border-radius:2px;}
.vt-row b{font-size:13px;color:var(--ink);}
.vt-row span{color:var(--muted);}
.hm-scroll{overflow-x:auto;padding-bottom:4px;}
svg.hm{display:block;}
.hm-cell{cursor:default;}
.hm-cell:hover{stroke:var(--ink);stroke-width:1.5;}
.hm-legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--viz-secondary);margin-top:10px;}
.hm-bar{display:inline-block;width:160px;height:10px;border-radius:5px;background:linear-gradient(90deg,rgb(227,73,72),rgb(240,239,236),rgb(42,120,214));}
.hm-none{margin-left:auto;}
.hm-none i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--cell-empty);margin-right:6px;vertical-align:-2px;border:1px solid var(--axis);}
.spark-row{margin-top:6px;height:28px;}
.spark{display:block;}
.foot-note{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5;}
@media (pointer:coarse){.tab-btn,.seg button,.edit-toggle{min-height:44px;}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;scroll-behavior:auto !important;}}

/* ===== v7: diseño premium + modo oscuro ===== */
:root{--accent:var(--navy);--viz-planta:#2A2670;--card-2:#FAFAFE;--track:#EEEDF8;--on-bar:#fff;--shadow:0 1px 2px rgba(27,24,80,.05),0 10px 28px -12px rgba(27,24,80,.18);--shadow-hover:0 2px 4px rgba(27,24,80,.06),0 16px 36px -14px rgba(27,24,80,.28);}
html[data-theme="dark"]{color-scheme:dark;
  --bg:#0B0A1E;--card:#15143A;--card-2:#1B1A48;--ink:#EEEDFB;--muted:#A3A5C4;--line:#2B2A62;--navy-tint:#211F55;--track:#23225A;
  --navy:#6C67E6;--navy-dark:#0F0E34;--accent:#B9B5FF;--viz-planta:#A9A5FF;--on-bar:#0B0A1E;
  --ok:#4ADE95;--ok-bg:#12352A;--warn:#F2C14E;--warn-bg:#3A2F12;--bad:#FF8B7E;--bad-bg:#40202A;
  --c-pr:#8A85F5;--c-mp:#3FB6D1;--c-mt:#B7A9F5;--c-mn:#F07A6B;--c-c:#E5B23A;--c-proy:#45C98A;--c-p:#9FA1BD;
  --grid:#27265A;--axis:#3A3978;--viz-muted:#A3A5C4;--viz-secondary:#CFCEEA;--cell-empty:#1E1D4A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);--shadow-hover:0 2px 4px rgba(0,0,0,.35),0 18px 40px -16px rgba(0,0,0,.7);}
html[data-theme="dark"] body{background-image:none;}

html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:var(--card-2);color:var(--ink);border-color:var(--line);}

body{transition:background-color .25s;}
#app{background:transparent;}
.header{background:radial-gradient(900px 260px at 92% -40%,rgba(245,226,2,.16),transparent 60%),linear-gradient(135deg,var(--navy) 0%,var(--navy-dark) 100%);}
.header-actions{display:flex;align-items:center;gap:8px;}
.theme-toggle{width:38px;height:36px;border-radius:20px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.theme-toggle:hover{background:rgba(255,255,255,.22);}
.theme-toggle svg{width:18px;height:18px;}
.theme-toggle .i-sun{display:none;} html[data-theme="dark"] .theme-toggle .i-sun{display:block;} html[data-theme="dark"] .theme-toggle .i-moon{display:none;}
.section-head h2{color:var(--accent);display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.01em;}
.section-head h2::before{content:"";width:5px;height:18px;border-radius:3px;background:var(--yellow);flex-shrink:0;}
.section-head .hint{color:var(--muted);font-size:11.5px;}
.card{border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);}
.link-btn,.viz-table summary{color:var(--accent);}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;}
.seg button:hover:not([aria-pressed="true"]){background:var(--navy-tint);}
.viz-table th:first-child,.viz-table td:first-child{background:var(--card);}
.viz-table thead th{background:var(--navy-tint);}
.viz-tip{background:var(--card);border-color:var(--line);color:var(--ink);}
.insight{background:var(--navy-tint);color:var(--ink);}
.insight .ic{width:28px;height:28px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow);}
.badge{color:var(--accent);}
.avatar.pending{border-color:var(--axis);}
/* tarjetas KPI */
.kpi-card.kpi2{position:relative;overflow:hidden;border-radius:18px;padding:18px 18px 14px;box-shadow:var(--shadow);border:1px solid var(--line);background:linear-gradient(180deg,var(--card) 0%,var(--card-2) 100%);transition:transform .2s,box-shadow .2s;}
.kpi-card.kpi2:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);}
.kpi-card.kpi2::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--navy);}
.kpi-card.kpi2.st-ok::before{background:linear-gradient(90deg,var(--ok),transparent 130%);}
.kpi-card.kpi2.st-warn::before{background:linear-gradient(90deg,var(--warn),transparent 130%);}
.kpi-card.kpi2.st-bad::before{background:linear-gradient(90deg,var(--bad),transparent 130%);}
.kpi2 .kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;min-height:22px;}
.kpi2 .lbl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0;}
.kpi2 .val{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.05;}
.kpi2 .sub{font-size:11.5px;font-weight:600;margin-top:6px;color:var(--muted);}
.kpi-chip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap;}
.kpi-chip.ok{background:var(--ok-bg);color:var(--ok);} .kpi-chip.bad{background:var(--bad-bg);color:var(--bad);} .kpi-chip.flat{background:var(--track);color:var(--muted);}
.kpi-meter{margin-top:12px;}
.kpi-track{position:relative;height:8px;border-radius:999px;background:var(--track);}
.kpi-track i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--navy);animation:growx .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:left;}
.kpi-track i.ok{background:linear-gradient(90deg,var(--ok),color-mix(in srgb,var(--ok) 65%,#fff));} .kpi-track i.warn{background:linear-gradient(90deg,var(--warn),color-mix(in srgb,var(--warn) 65%,#fff));} .kpi-track i.bad{background:linear-gradient(90deg,var(--bad),color-mix(in srgb,var(--bad) 65%,#fff));}
.kpi-track b{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink);}
.kpi-meta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;font-weight:600;}
.kpi2 .spark-row{height:32px;margin-top:8px;display:flex;justify-content:flex-end;}
@keyframes growx{from{transform:scaleX(0);}}
@keyframes growy{from{transform:scaleY(0);}}
@keyframes fadein{from{opacity:0;}}
/* turnos: anillos */
.turno-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
.turno-summary .tcard{display:flex;align-items:center;gap:14px;text-align:left;padding:16px 18px;border-radius:18px;box-shadow:var(--shadow);}
.tcard .ring{flex-shrink:0;}
.tcard .tinfo{min-width:0;}
.tcard .t{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.07em;}
.tcard .t i{width:9px;height:9px;border-radius:50%;display:inline-block;}
.tcard .e{font-size:24px;letter-spacing:-.02em;}
.tcard .tmeta{font-size:11px;color:var(--muted);font-weight:600;margin-top:4px;}
/* nave / maquinas */
.nave-head,.nave-body{border-radius:18px;box-shadow:var(--shadow);}
.nave-head.open{border-bottom-left-radius:0;border-bottom-right-radius:0;box-shadow:none;}
.nave-body{border-radius:0 0 18px 18px;}
.mbar{display:block;height:5px;border-radius:999px;background:var(--track);margin:4px 0 0 auto;width:72px;overflow:hidden;position:relative;}
.mbar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;animation:growx .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:left;}
.mbar i.ok{background:var(--ok);} .mbar i.warn{background:var(--warn);} .mbar i.bad{background:var(--bad);} .mbar i.na{background:var(--muted);}
.mcell{display:flex;flex-direction:column;align-items:flex-end;}
table.mtable th{text-transform:uppercase;letter-spacing:.05em;font-size:10px;}
table.mtable tbody tr:hover td{background:var(--navy-tint);}
table.mtable tr.tot td{border-top:1.5px solid var(--accent);}
.chip-inst{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;background:var(--navy-tint);color:var(--accent);font-size:11px;font-weight:700;border:1px dashed var(--accent);}
.chip-inst::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 2px var(--ink);}
.nave-body .chart-wrap .svg-chart{max-width:760px;margin:0 auto;}

<body>

<script>
window.__READONLY__ = false; // el exportador de visor cambia esto a true e inyecta window.__DATA__
/* ============================================================
   KPI EXTRUSIÓN — MODELO DE DATOS
   ============================================================ */
const CAUSAS = [
  {code:'PR',  label:'Producción',        var:'--c-pr'},
  {code:'MP',  label:'Materia Prima',     var:'--c-mp'},
  {code:'MT',  label:'Matricería',        var:'--c-mt'},
  {code:'MN',  label:'Mantención',        var:'--c-mn'},
  {code:'C',   label:'Cambios progr.',    var:'--c-c'},
  {code:'PROY',label:'Proyectos',         var:'--c-proy'},
  {code:'P',   label:'Partida de planta', var:'--c-p'},
];
const TURNOS = ['Turno 1','Turno 2','Turno 3'];
const NAVES = {
  'Nave 1': ['E 30','E 40','E 90','E 150','E 160','E 180'],
  'Nave 2': ['E 51','E 60','E 100','E 110','E 170'],
  'Nave 3': ['E 70','E 80','E 120','E 130','E 140'],
};
// Lineas nuevas aun sin produccion (pruebas / marcha blanca): se muestran como parte de la planta pero no cuentan en promedios ni alertas.
const MAQ_INSTALACION = {'E 170':'En instalación'};
function machineHasData(m){ return !!m && ((m.prod||0)>0 || (m.std||0)>0); }
function machineStatusLabel(m){ return !machineHasData(m) && MAQ_INSTALACION[m?.maquina] ? MAQ_INSTALACION[m.maquina] : 'S/D'; }
// Asegura que todo corte tenga todas las maquinas de NAVES (los cortes antiguos no traen las nuevas)
function ensureMachines(period){
  Object.values(period.turnos||{}).forEach(sh=>Object.keys(NAVES).forEach(n=>{
    const nv=sh.naves&&sh.naves[n]; if(!nv) return; if(!Array.isArray(nv.maquinas)) nv.maquinas=[];
    NAVES[n].forEach(mq=>{ if(!nv.maquinas.some(x=>x.maquina===mq)) nv.maquinas.push({maquina:mq,std:0,prod:0,scrap:0,overKg:0,sobrepeso:0,causas:emptyCausas()}); });
  }));
}
// Historial de encargados: Gonzalo Nuñez lideró la Nave 3 del Turno 3 hasta esta fecha; después queda "Por definir".
const ENCARGADO_HISTORICO = [{turno:'Turno 3',nave:'Nave 3',nombre:'Gonzalo Nuñez',hasta:'2026-10-31'}];
function encargadoHistorico(turno,nave,fecha){
  const h=ENCARGADO_HISTORICO.find(x=>x.turno===turno&&x.nave===nave);
  return h&&fecha<=h.hasta?h.nombre:null;
}
function naveOf(maquina){
  for(const [n,ms] of Object.entries(NAVES)) if(ms.includes(maquina)) return n;
  return null;
}
function initials(name){
  if(!name || /por definir/i.test(name)) return '?';
  return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}
function avatarColor(name){
  if(!name || /por definir/i.test(name)) return null;
  let h=0; for(const c of name) h = (h*31 + c.charCodeAt(0))>>>0;
  const palette=['#2A2670','#5B57A8','#178A4C','#B8860B','#C0392B','#0E7C7B'];
  return palette[h%palette.length];
}
function emptyCausas(){ const o={}; CAUSAS.forEach(c=>o[c.code]=0); return o; }
function sumCausas(a,b){ const o=emptyCausas(); CAUSAS.forEach(c=>o[c.code]=(a?.[c.code]||0)+(b?.[c.code]||0)); return o; }
function totalCausas(o){ return CAUSAS.reduce((s,c)=>s+(o?.[c.code]||0),0); }

// Criterio de Pareto 80/20: de una lista ya ordenada desc, se queda con las
// causas/items necesarios para llegar a ~80% acumulado, con un tope de 3 para
// que el texto siga siendo legible. Devuelve tambien cuanto queda como "resto".
function paretoTop(itemsSortedDesc, valKey, cap=3){
  const total = itemsSortedDesc.reduce((s,i)=>s+i[valKey],0) || 1;
  const picked = []; let acum=0;
  for(const it of itemsSortedDesc){
    if(it[valKey]<=0) break;
    picked.push({...it, pct: it[valKey]/total, acum: (acum+it[valKey])/total});
    acum += it[valKey];
    if(acum/total>=0.8 || picked.length>=cap) break;
  }
  const restPct = Math.max(0, 1 - (picked.reduce((s,i)=>s+i[valKey],0)/total));
  return {picked, restPct};
}

// Metas de referencia (segun guia interna de la planta)
const META_EFICIENCIA = 0.85;
const META_SCRAP = 0.08;
const SHIFT_HOURS = 8; // supuesto para traducir minutos perdidos a kg estimados

function scrapPct(prod, scrap){ return prod ? scrap/prod : 0; }
// Ratio "seguro": si el STD es 0 o el resultado es una eficiencia imposible (>150%),
// se trata como dato no disponible en vez de mostrar un numero absurdo — esto
// generalmente delata un STD faltante en el origen para esa maquina/turno/dia.
function safeEff(num, den){
  if(den==null || den<=0) return (num>0) ? null : 0;
  const r = num/den;
  return r>1.5 ? null : r;
}
function pillClassInv(v, meta){ if(v==null) return 'na'; return v<=meta ? 'ok' : v<=meta*1.4 ? 'warn' : 'bad'; }
// Semaforo simetrico (para sobrepeso: la meta es 0%, se penaliza alejarse hacia cualquier lado)
const META_SOBREPESO = 0;
function pillClassSym(v, tolWarn, tolBad){
  if(v==null) return 'na';
  const a = Math.abs(v);
  return a<=tolWarn ? 'ok' : a<=tolBad ? 'warn' : 'bad';
}
function pillClassSobrepeso(v){ return pillClassSym(v, 0.01, 0.03); }
// kg estimados no producidos por una causa, a partir de minutos perdidos y el STD del alcance
function impactKg(minutos, stdKg){
  if(!minutos || !stdKg) return 0;
  const kgPorMin = stdKg / (SHIFT_HOURS*60);
  return minutos * kgPorMin;
}

// Encargados de nave por turno. Turno 1 y 2: sin asignar aun.
const DEFAULT_ENCARGADOS = {
  'Turno 1': {'Nave 1':'Por definir','Nave 2':'Por definir','Nave 3':'Por definir'},
  'Turno 2': {'Nave 1':'Por definir','Nave 2':'Por definir','Nave 3':'Por definir'},
  'Turno 3': {'Nave 1':'Hanner Carabali','Nave 2':'Hector Pineda','Nave 3':'Por definir'},
};
const JEFES_PLANTA = {'Turno 1':'Ivan Jerez','Turno 2':'Oscar Montero','Turno 3':'Mauricio Flores'};

/* ============================================================
   ALMACENAMIENTO — historico acumulado, nunca se sobrescribe
   ============================================================ */
const STORAGE_KEY = 'kpiExtrusionApp_periodos_macro_v1';
const PIN_KEY = 'kpiExtrusionApp_pin';

function loadStore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const s = JSON.parse(raw); if(!s.lideres) s.lideres={}; return s; }
  }catch(e){}
  return {periods:[], encargados: JSON.parse(JSON.stringify(DEFAULT_ENCARGADOS)), lideres:{}};
}
function normalizeBitacoraStore(store){
  if(!store.bitacoraByMonth) store.bitacoraByMonth={};
  let changed=false;
  const latestByMonth=new Map();
  store.periods.forEach(period=>{
    if(!period.bitacora?.length) return;
    const key=periodMonth(period),previous=latestByMonth.get(key);
    if(!previous||period.hasta>previous.hasta) latestByMonth.set(key,period);
  });
  latestByMonth.forEach((period,key)=>{
    if(!store.bitacoraByMonth[key]) store.bitacoraByMonth[key]=period.bitacora;
  });
  store.periods.forEach(period=>{
    if(period.bitacora?.length){period.bitacora=[];changed=true;}
  });
  return changed;
}
// Registro de lideres por NOMBRE (independiente del periodo, para que la foto
// no se pierda ni se duplique al importar nuevos periodos).
function liderFoto(nombre){
  if(!nombre || /por definir/i.test(nombre)) return null;
  return state.store.lideres?.[nombre]?.foto || null;
}
function setLiderFoto(nombre, dataUrl){
  if(!state.store.lideres) state.store.lideres = {};
  state.store.lideres[nombre] = {...(state.store.lideres[nombre]||{}), foto: dataUrl};
  saveStore(state.store);
}
const META_KEY = 'kpiExtrusionApp_meta';
const GH_KEY = 'kpiExtrusionApp_github';
function getMeta(){ try{ return JSON.parse(localStorage.getItem(META_KEY))||{}; }catch(e){ return {}; } }
function setMeta(m){ try{ localStorage.setItem(META_KEY, JSON.stringify(m)); }catch(e){} }
function ghConfig(){
  let c={}; try{ c=JSON.parse(localStorage.getItem(GH_KEY))||{}; }catch(e){}
  return { owner:c.owner||'mauricioflores1987', repo:c.repo||'kpi-extrusion-turno3', token:c.token||'' };
}
// saveStore: guarda copia local y marca "cambios sin publicar" (salvo opts.clean)
// Copia local (solo en dispositivos de quien edita): comprimida, para no topar con la cuota del navegador.
let __savePending=0, __saveChain=Promise.resolve();
async function gzipB64(str){
  const cs=new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
  const buf=new Uint8Array(await new Response(cs).arrayBuffer()); let bin='';
  for(let i=0;i<buf.length;i+=0x8000) bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
  return btoa(bin);
}
async function gunzipB64(b64){
  const bin=atob(b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
function emptyStore(){ return {periods:[], encargados: JSON.parse(JSON.stringify(DEFAULT_ENCARGADOS)), lideres:{}}; }
async function loadStoreAsync(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){ const txt=raw.startsWith('gz:')?await gunzipB64(raw.slice(3)):raw; const st=JSON.parse(txt); if(!st.lideres) st.lideres={}; return st; }
  }catch(e){ console.error('No se pudo leer la copia local',e); }
  return emptyStore();
}
// Los cortes diarios que vienen del Excel mensual no se guardan: se reconstruyen desde excelRows (filas diarias compactas).
function serializeStore(store){
  const ex=store.excelRows||{}, fechas={};
  Object.keys(ex).forEach(m=>fechas[m]=new Set(ex[m].map(r=>r[0])));
  const covered=p=>p.fuente==='excel-mensual' && fechas[String(p.desde).slice(0,7)]?.has(p.hasta);
  return Object.assign({}, store, {periods: store.periods.filter(p=>!covered(p))});
}
function persistLocal(store){
  let editor=false; try{ editor=isEditorDevice(); }catch(e){}
  if(!editor || window.__NO_LOCAL_WRITE) return;
  __savePending++;
  __saveChain=__saveChain.then(async()=>{
    try{
      const txt=JSON.stringify(serializeStore(store));
      localStorage.setItem(STORAGE_KEY, window.CompressionStream ? 'gz:'+await gzipB64(txt) : txt);
    }catch(e){
      console.error('Copia local fallida',e);
      try{ localStorage.removeItem(STORAGE_KEY); }catch(_){}
      toast('No hay espacio local en este navegador. Publica en GitHub para no perder los cambios.');
    }finally{ __savePending--; }
  });
}
window.addEventListener('beforeunload',e=>{ if(__savePending>0){ e.preventDefault(); e.returnValue=''; } });
// saveStore: marca «cambios sin publicar» (salvo opts.clean) y guarda copia local sin romper nunca el flujo
function saveStore(store, opts){
  if(!(opts && opts.clean)){ const m=getMeta(); m.dirty=true; setMeta(m); }
  persistLocal(store);
  if(typeof updatePubBar==='function') updatePubBar();
}
function getPin(){
  return localStorage.getItem(PIN_KEY) || '1234';
}
function setPin(p){ localStorage.setItem(PIN_KEY, p); }

// upsert: si ya existe un periodo con el mismo id (desde_hasta), lo reemplaza;
// si no, lo agrega al historico. El historico jamas se borra al importar.
function upsertPeriod(store, period){
  const idx = store.periods.findIndex(p=>p.id===period.id);
  if(idx>=0) store.periods[idx]=period; else store.periods.push(period);
  store.periods.sort((a,b)=> a.desde.localeCompare(b.desde));
  return store;
}
function latestPeriod(store){
  return store.periods.length ? store.periods[store.periods.length-1] : null;
}
</script>

uipo antes de partir, se da partida 16:30. Espesores Lado A Lado B.. Ambos 1.5.. Impresión Cumple Atributos Cumple"}, {"fecha": "2026-05-04", "turno": "Turno 1", "maquina": "E 51", "nave": "Nave 2", "observacion": "Partida a las 22:45 hrs. Mantención interviene carro de tiro del lado B (20 min)"}, {"fecha": "2026-05-04", "turno": "Turno 3", "maquina": "E 51", "nave": "Nave 2", "observacion": "Durante el turno se detecta falla en pruebas de impacto en ambas líneas (3/3), lo que obliga al descarte de aproximadamente una hora de producción. Se realizan ajustes en temperatura y carga de material, tras lo cual nuevas pruebas arrojan resultado conforme (0/3), quedando la línea estabilizada."}, {"fecha": "2026-05-04", "turno": "Turno 1", "maquina": "E 60", "nave": "Nave 2", "observacion": "A las 20:30 hrs mantención cambia calefactor del horno (30 min), luego ajuste de controlador del carro de tiro ((10 min)"}, {"fecha": "2026-05-04", "turno": "Turno 3", "maquina": "E 60", "nave": "Nave 2", "observacion": "Se presentan incrustaciones de manera intermitente en la tubería. Se revisa el desgasificador sin encontrar anomalías claras, por lo que la condición queda en observación sin una causa raíz confirmada al cierre del turno."}, {"fecha": "2026-05-04", "turno": "Turno 1", "maquina": "E 70", "nave": "Nave 3", "observacion": "Ajuste de sensor de abocardadora (5 min). Se termina compuesto en sacas y se realiza consumo de 2 sacas de pulverizado 100%"}, {"fecha": "2026-05-04", "turno": "Turno 3", "maquina": "E 70", "nave": "Nave 3", "observacion": "A las 08:46 se detecta inestabilidad en la manga asociada al uso de material pulverizado, generando incrustaciones en la tubería. Se decide detener la máquina para cambio de material a compuesto, logrando normalizar la operación a las 09:05."}, {"fecha": "2026-05-04", "turno": "Turno 2", "maquina": "E 70", "nave": "Nave 3", "observacion": "Se detiene a las 6:15 por cambio de goma en primera batea de enfriamiento se llama a matricería asistiendo a las 6:00 entregando maquina a las 6:20 se inicia partida a las 6:20 nuevamente quedando estable a las 6:35."}, {"fecha": "2026-05-04", "turno": "Turno 1", "maquina": "E 80", "nave": "Nave 3", "observacion": "Partida a las 22:30 hrs, quedando normalizada a las 23:05 hrs."}, {"fecha": "2026-05-04", "turno": "Turno 3", "maquina": "E 80", "nave": "Nave 3", "observacion": "A las 09:00 se corta la línea por falla en el carro de tiro (baja presión). Se ajustan manómetros, retomando operación y normalizando a las 09:30. Posteriormente, a las 13:00, ocurre una nueva detención por falla en la bomba principal de agua de las bateas, lo que provoca pérdida de línea en las primeras tinas. Se detiene con AQ y se realiza purga completa, extendiéndose la recuperación hasta las 14:20."}, {"fecha": "2026-05-04", "turno": "Turno 2", "maquina": "E 80", "nave": "Nave 3", "observacion": "Se recibe detenida, se termina de confeccionar guía, al poner en funcionamiento tina de enfriamiento falla bomba de agua de primera tina, mntto revisa equipo, entregando a las 17:30 hrs , posterior a ello se inicia calentamiento y se da partida , estabilizando maquina a las 18:30 hrs ."}, {"fecha": "2026-05-04", "turno": "Turno 1", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se corta en una oportunidad por quedar tubería atrapada en la sierra."}, {"fecha": "2026-05-04", "turno": "Turno 2", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se descartan tubos desde las 19:10 hasta las 19:25 de procede a cortar línea y se llama a mantención, falla en posición de sensor de arraste. Maquina queda estable a las 19:30"}, {"fecha": "2026-05-04", "turno": "Turno 1", "maquina": "E 100", "nave": "Nave 2", "observacion": "Partida a las 22:30 hrs y se mantiene estable al 90% consumiendo 100% scrap."}, {"fecha": "2026-05-04", "turno": "Turno 3", "maquina": "E 100", "nave": "Nave 2", "observacion": "Bajo rendimiento por consumo de scrap 100%"}, {"fecha": "2026-05-04", "turno": "Turno 2", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se recibe andando al revisar cañería unos metros salía como chupado la cañería se revisa perfiles de temperatura encuentran demasiado altas por eso pasa ese problema de rechupe y pérdida de vacío , cañería baja se trabaja con temperaturas bajas se modifica temperaturas en el tornillo  y cabezal, se retoma producción nuevamente, posterior a ello a las 16:30 hrs se detiene equipo por alarma de convertidor de temperatura, mntto asiste, retomando nuevamente a las 17:20 hrs"}, {"fecha": "2026-05-04", "turno": "Turno 1", "maquina": "E 110", "nave": "Nave 2", "observacion": "se detiene extrusora arrojando alarma por bajo voltaje, se da aviso a mantención, se pone maquina en funcionamiento al minuto quedando normalizada, posteriormente sale tubería picada, mantención realiza cambio de disco (30 min)"}, {"fecha": "2026-05-04", "turno": "Turno 3", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se detecta descarte por presencia de raya exterior negra persistente. Tras ajustes de temperatura sin resultados, se detiene la máquina a las 09:10. Matricería interviene desde las 09:17 realizando desmontaje completo de cabezal y purga de tornillo sin hallazgos concluyentes. Se ejecuta pulido y posterior montaje. Matricería entrega a las 13:30 y mantención realiza conexión de calefactores para su posterior puesta en marcha."}, {"fecha": "2026-05-04", "turno": "Turno 2", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se recibe detenida por limpieza de cabezal por rayas de quemado, se espera que mntto instale calefacción, se inicia calentamiento a las 15:30 hrs, se realiza limpieza de aspersores, se inicia partida a las 17:15 ajuste de espesores, se centra tubería, posterior a ello se realiza ajustes en parámetros de abocardadora, maquina queda estable a las 18:30 hrs."}, {"fecha": "2026-05-04", "turno": "Turno 1", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-04", "turno": "Turno 3", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-04", "turno": "Turno 2", "maquina": "E 120", "nave": "Nave 3", "observacion": "Sin planificación."}, {"fecha": "2026-05-04", "turno": "Turno 1", "maquina": "E 130", "nave": "Nave 3", "observacion": "En proceso de partida se llama a mantención para revisar carro de sierra con falta de avance, encontrando válvula de avance de carro pegada (20 min), posteriormente se detiene con Antiquemante por falla en sierra, mantención interviene y realiza limpieza de pistas y limpieza de material compactado en ruedas de sujeción de planetario (50 min)"}, {"fecha": "2026-05-04", "turno": "Turno 3", "maquina": "E 130", "nave": "Nave 3", "observacion": "Durante el turno la máquina queda sin material, generando corte de línea. Se identifica como causa un cambio en el selector de consumo hacia material reciclado. Se corrige la condición y se retoma operación a las 11:00, quedando estable."}, {"fecha": "2026-05-04", "turno": "Turno 2", "maquina": "E 130", "nave": "Nave 3", "observacion": "PRUEBA DE MATERIAL, compuesto rechazado al 10% , calidad rechaza primera muestra al 20% por falla de impacto, Se hace detención a las 15:20 por problemas en la primera zona del cabezal, mantención atiende problema de calefacción haciendo cambio de termocupla a las 15:30-15:50 se inicia partida alas 16:00 quedando estable a las 16:15"}, {"fecha": "2026-05-04", "turno": "Turno 3", "maquina": "E 140", "nave": "Nave 3", "observacion": "Se recibe operativa. A las 10:10 se detiene por exceso de cera en calibrador. Se realiza limpieza hasta las 10:33, logrando normalizar la operación sin mayores inconvenientes."}, {"fecha": "2026-05-04", "turno": "Turno 1", "maquina": "E 150", "nave": "Nave 1", "observacion": "Al inicio, se limpian calibradores, aspersores y se coloca a temperatura de trabajo, la botonera de desplazamiento de la tina no funcionaba, se llama a mantención a las 21:40 para que intervenga, identifi  00:15 hrs., a las 01:10 problemas con mesa de traslado , mantención revisa y regula presión pero problema persiste , se revisa más a fondo encontrando sensor de traslado fuera de posición , se regula sensor ( micro ) quedando traslado ok a las 01:30 hrs, posteriormente descarte por flujo."}, {"fecha": "2026-05-05", "turno": "Turno 3", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se descartan tubos por campana picada, realizando ajustes que corrigen parcialmente la condición. Posteriormente, se detecta franja negra (raya), lo que obliga a detener la máquina a las 10:00.\nMatricería desmonta cabezal y mantención interviene a las 11:00 para retiro, revisión y limpieza de tornillos. Mantención entrega a las 13:35, matricería termina el armado  del cabezal a las 14:45, quedando pendiente la instalación y revisión de calefactores."}, {"fecha": "2026-05-05", "turno": "Turno 2", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se recibe detenía instala calefactores entrega  a las 15:20 y se pone temperatura de trabajo, se estabiliza a las 17:30 hrs, se hacen mejoras por línea oscura en parte inferior de tubería, se modifican perfiles de temperatura sin resultados positivos, se detiene con AQ.21:30 por beta negra, se hizo mejoras con T°, pero aun persiste la beta negra, se dejan T°apagadas.matriceria interviene 21:35 a desarmar hembra y realizar limpieza y descartar filtración de cera en parte inferior de tubería."}, {"fecha": "2026-05-05", "turno": "Turno 1", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-05", "turno": "Turno 3", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-05", "turno": "Turno 2", "maquina": "E 120", "nave": "Nave 3", "observacion": "Maquina fuera de temporada."}, {"fecha": "2026-05-05", "turno": "Turno 1", "maquina": "E 130", "nave": "Nave 3", "observacion": "A las 01:00 hrs salen campanas buenas y malas, se realizan pruebas y ajustes de temperaturas y ciclos del horno, después se observa mordaza superior del molde suelta se suelta, mantención e interviene 02:10 a 02:30 hrs"}, {"fecha": "2026-05-05", "turno": "Turno 3", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se recibe operativa con presencia de vibrado interior en la tubería. Se trabaja en conjunto con soporte técnico, ajustando temperaturas de extrusora y eliminando uso de material reciclado. Se logra estabilizar la producción a las 13:30.\nCausa identificada: uso de material reciclado afectando estabilidad interna."}, {"fecha": "2026-05-05", "turno": "Turno 2", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se detiene a las 4:30 por trabajos de contratistas en trabajos en vacío de extrusora, asimismo se llama a mantención por sensor de descarga de agua pegado mantención asiste a las 4:40 maquina queda en temperatura de purga, a las 5:10 haciendo cambio de relé, se enciende nuevamente temperatura de trabajo a las 5:30 trabajos de contratistas entregan maquina a las 5;30, al dar partida no se logra estabilizar por baja presión de agua en primera tina, mtto revisa nuevamente, también se limpian filtros de agua, mtto revisa bomba de agua y realiza limpieza de la misma, entregando a las 21:30 hrs , se entrega maquina con temperatura de trabajo."}, {"fecha": "2026-05-05", "turno": "Turno 1", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se mantiene estable a 330 kg/hr., al subir rendimiento se produce ovalamiento, aun teniendo los filtros y aspersores limpios, agua a 19°C, todas las tinas con agua circulando."}, {"fecha": "2026-05-05", "turno": "Turno 3", "maquina": "E 150", "nave": "Nave 1", "observacion": "A las 11:30 se realiza cambio de producto y transición a material scrap. Durante el proceso se generan descartes por bajo espesor debido a variaciones en la carga. Se ajusta operación disminuyendo rendimiento para estabilizar el proceso, logrando mejorar la condición."}, {"fecha": "2026-05-05", "turno": "Turno 2", "maquina": e la tubería se desliza durante el ingreso del macho debido a ausencia de gomas en la mordaza. Adicionalmente, se detecta desgaste generalizado en gomas de tina, provocando filtraciones de agua hacia sierra y abocardado, además de pérdida de nivel por succión de vacío.\nMatricería interviene y entrega a las 13:10. Se reinicia a las 13:50, normalizando a las 14:16. Posteriormente se registra un nuevo corte en línea 4.\nCausa raíz identificada: desgaste y ausencia de componentes críticos (gomas), afectando sujeción y control de proceso. Tendencia a retenerse el material en el herramental."}, {"fecha": "2026-05-05", "turno": "Turno 2", "maquina": "E 160", "nave": "Nave 1", "observacion": "Lado 3 se recibe con raya interna y externa, se procede a realizar mejora sin resultados ya que persistes el problema, maquina se detiene y se llama a matricería a las 15:20 interviniendo hasta las 15:45. Maquina se coloca temperatura de trabajo a las 16:00, se inicia partida a las 16:35 maquina queda estable a las 16:55. Durante las marcha a las 18:30 se cambia de saca a silo, presentando diferencia en el color del tubo los cuales se descartan, se drena material de la tolva y se modifican perfiles de temperatura. Volviendo a la normalidad a las 19:30."}, {"fecha": "2026-05-05", "turno": "Turno 1", "maquina": "E 180", "nave": "Nave 1", "observacion": "Se recibe con compuesto y se realiza cambio a pulverizado 100%, posteriormente descarte de tubería por limpieza de dosificador de pigmento Movacolor."}, {"fecha": "2026-05-05", "turno": "Turno 3", "maquina": "E 180", "nave": "Nave 1", "observacion": "Se generan descartes recurrentes por flujo en cada cambio de saca, condición asociada al uso de 100% pulverizado blanco pigmentado. Además, se presentan problemas de pigmentación por compactación del pigmento en el sistema Movacolor, lo que se corrige mediante limpieza.\nTambién se detecta vibrado, resolviéndose con limpieza de aspersores y filtro de agua, junto con ajustes operacionales.\nCausa: inestabilidad de materia prima (pulverizado) y problemas de dosificación de pigmento."}, {"fecha": "2026-05-05", "turno": "Turno 2", "maquina": "E 180", "nave": "Nave 1", "observacion": "Se trabaja con pulverizado blanco pigmentado en línea."}], "demo": false, "real": true}, {"id": "2026-05-06_2026-05-06", "desde": "2026-05-06", "hasta": "2026-05-06", "importedAt": "2026-05-06T00:00:00.000Z", "turnos": {"Turno 1": {"jefePlanta": "Ivan Jerez", "kilos": 30351.51935, "sobrepeso": 0.0027392143275577602, "scrap": 4623, "std": 38770.0, "eficiencia": 0.7828609582151147, "causas": {"PR": 402, "MP": 294, "MT": 285, "MN": 795, "C": 0, "PROY": 0, "P": 0}, "naves": {"Nave 1": {"encargado": "Por definir", "maquinas": [{"maquina": "E 30", "std": 1980.0000000000002, "prod": 1811.328, "scrap": 556, "sobrepeso": -0.10121192848561932, "causas": {"PR": 46, "MP": 0, "MT": 0, "MN": 0, "C": 0, "PROY": 0, "P": 0}}, {"maquina": "E 40", "std": 2835, "prod": 2079.714, "scrap": 114, "sobrepeso": 0.02282333051563821, "causas": {"PR": 114, "MP": 0, "MT": 0, "MN": 30, "C": 0, "PROY": 0, "P": 0}}, {"maquina": "E 90", "std": 2159.9999999999995, "prod": 2207.17145, "scrap": 114, "sobrepeso": 0.032294976450515475, "causas": {"PR": 0, "MP": 0, "MT": 0, "MN": 0, "C": 0, "PROY": 0, "P": 0}}, {"maquina": "E 150", "std": 2590, "prod": 2257.5, "scrap": 42, "sobrepeso": 0.0613953488372093, "causas": {"PR": 0, "MP": 54, "MT": 0, "MN": 0, "C": 0, "PROY": 0, "P": 0}}, {"maquina": "E 160", "std": 4499.999999999999, "prod": 3375.0714000000003, "scrap": 206, "sobrepeso": -0.07757013180027349, "causas": {"PR": 0, "MP": 0, "MT": 75, "MN": 0, "C": 0, "PROY": 0, "P": 0}}, {"maquina": "E 180", "std": 4050.0000000000005, "prod": 2474.2463199999997, "scrap": 560, "sobrepeso": -0.04718190440042096, "causas": {"PR": 0, "MP": 210, "MT": 0, "MN": 0, "C": 0, "PROY": 0, "P": 0}}], "std": 18115.0, "prod": 14205.03117, "scrap": 1592, "sobrepeso": -0.02143788584637556, "eficiencia": 0.7841584968258349}, "Nave 2": {"encarg falla y se vuelve a iniciar producción a las 20:05 queda estable, se detiene a las 21.40 por problemas en abocardado dejando temperatura en purga mantenimiento trabaja en soluciones de abocardado y horno, nuevamente falla en avance de horno interrumpiendo ciclo abocardadora."}, {"fecha": "2026-05-06", "turno": "Turno 1", "maquina": "E 51", "nave": "Nave 2", "observacion": "Al inicio del turno se recibe con filtración de agua en la tina por manguera dañada y deja de cortar sierra del lado A, mantención interviene y realiza cambio de manguera y entrega a las 22:30 hrs. Luego revisa sierra y encuentra motor del extractor de viruta, VDF quemados, se realiza limpieza de contactor y guarda motor, además cambian 4 relés de estado sólido. se miden motores de corte y avance de sierra , sin daños asociados , equipo queda detenido sin solución. Durante la detención se aprovecha de realizar limpieza a las trampas de las tinas"}, {"fecha": "2026-05-06", "turno": "Turno 3", "maquina": "E 51", "nave": "Nave 2", "observacion": "Se recibe detenida por falla en sierra lado A. Mantención interviene, entregando equipo a las 13:40. Posteriormente se deja en temperatura para retomar operación. No se reportan resultados posteriores dentro del turno."}, {"fecha": "2026-05-06", "turno": "Turno 2", "maquina": "E 51", "nave": "Nave 2", "observacion": "Se recibe detenida en proceso de calentamiento por falla en sierra, se reanuda producción a 1m.15:30, ajuste de espesores y diámetro, posterior a ello corte de línea en 2 ocasiones, tubería choca en guía, lado b, se corrige, se sube rendimiento paulatinamente."}, {"fecha": "2026-05-06", "turno": "Turno 1", "maquina": "E 60", "nave": "Nave 2", "observacion": "Se corta línea en una oportunidad, choque en sierra, se corta línea a las 05:00 hrs, mantención interviene rellenando pozo por baja presión de agua."}, {"fecha": "2026-05-06", "turno": "Turno 3", "maquina": "E 60", "nave": "Nave 2", "observacion": "Se registran descartes por vibrado e incrustaciones durante el turno. A  las 14:20 hrs. Se realiza cambio de producto programado (color y dimensión)"}, {"fecha": "2026-05-06", "turno": "Turno 2", "maquina": "E 60", "nave": "Nave 2", "observacion": "Se detiene  a las 15:20 por raya interna se detiene con AQ y se llama a matricería para desarmar cabeza matricería ya interviene, encontrando trozo de metal alojado en el postizo, matricería entrega a las 15:50 y se llama a mantención para conexión de calefactores, se inicia calentamiento, se reanuda producción 16:30, posterior a ello se detiene maquina a las 18:50 por falla en sensor de macho abocardadora, Se inicia partida a las 19:50 quedando estable a las 20:20"}, {"fecha": "2026-05-06", "turno": "Turno 1", "maquina": "E 70", "nave": "Nave 3", "observacion": "Se recibe detenida en proceso de calentamiento, 22:35 hrs se da inicio de partida, quedando estabilizada a las 22:45 hrs, durante el proceso se llegan a descartar tuberías con variación de largo de campanas realizando ajustes y quedando bien, luego descarte por choque de tubería en la sierra, posteriormente se solicita a mantención realizar cambio de manguera de tina 1 con filtración (25 min)"}, {"fecha": "2026-05-06", "turno": "Turno 3", "maquina": "E 70", "nave": "Nave 3", "observacion": "Se recibe operativa. Se genera corte de línea por tubería torcida en abocardadora. Se realizan ajustes, retomando operación entre 11:50 y 12:15, quedando estable."}, {"fecha": "2026-05-06", "turno": "Turno 2", "maquina": "E 80", "nave": "Nave 3", "observacion": "A las 17:30 se solicita a mtto asistencia por falla en sensor de posicionamiento de tubería en abocardadora, queda pegado se regula proximidad de sensor, posterior a ello bien."}, {"fecha": "2026-05-06", "turno": "Turno 1", "maquina": "E 90", "nave": "Nave 1", "observacion": "Descarte por campanas disparejas."}, {"fecha": "2026-05-06", "turno": "Turno 2", "maquina": "E 90", "nave": "Nave 1", "observacion": "Descarte de tuberías por perdida de ciclo en abocardadora, se retoma nuevamente."}, {"fecha": "2026-05-06", "turno": "Turno 1", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se trabaja con scrap al 50% y máquina estable al 90%, se descartan 3 rollos por quiebre."}, {"fecha": "2026-05-06", "turno": "Turno 3", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se registra una detención por falla en el variador, generando un corte de línea. Posteriormente, se realiza partida (40 min.), recuperando operación. No se detalla causa raíz específica del fallo eléctrico. (No se trabaja al 100% por consumo de scrap)"}, {"fecha": "2026-05-06", "turno": "Turno 2", "maquina": "E 100", "nave": "Nave 2", "observacion": "Al inicio de turno tenemos problema de agua en la torre de la mantención revisa bombas de agua, sin detención de maquina, se trabaja con 100% scrap"}, {"fecha": "2026-05-06", "turno": "Turno 1", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se recibe detenida por matricería y con hembra desmontada, se realiza purga, se realiza limpieza de herramental (22:00 a 22:40 hrs), luego mantención conecta y revisa calefacción (20 min), se pone en temperaturas de trabajo y luego se da partida.  A las 23 : 45 se llama a mantención por problemas en arrastre, realiza ajuste del sensor el cual provocaba señales erróneas, resetean PLC y entrega (45 min), luego falla gira tubo de abocardadora, mantención indica detener para revisar, se detiene con Antiquemante, indica que falla en gira tubo se debe a guarda motor quemado, realizan reemplazo y entregan (35 min) , se ponen temperaturas de trabajo para reanudar producción."}, {"fecha": "2026-05-06", "turno": "Turno 3", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se recibe con flujo inestable y presencia de raya negra. Se detiene a las 07:30 para intervención de matricería, quienes desmontan cabezal y revisan transductor, detectando posición incorrecta (muy arriba). Se corrige condición y se entrega a las 11:30.\nMantención realiza conexión de calefactores, entregando a las 11:50. Se inicia operación a las 13:00, estabilizando a las 13:30. Sin embargo, a las 14:00 se detiene nuevamente debido a persistencia de la raya.\nMatricería, en conjunto con soporte técnico (Nicolás Lavín) revisarán la posición del transductor."}, {"fecha": "2026-05-06", "turno": "Turno 2", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se recibe detenida, con cabezal desacoplado, en proceso de purga con Aq, se observa que beta negra proviene de los tornillos, se realiza limpieza con scrap de Aq, también se coordina con planificación cambio a canaleta café, se solicita a matricería instalación de cabezal para partida, se suben temperaturas de trabajo, se cambia de saca, se realiza prueba con material blanco que queda en tolva , 19:50 se normaliza 20:20,pero línea negra persiste se hará cambio a café quedando estable 21:00, posterior a ello sin novedad, se sugiere una limpieza profunda en tornillos."}, {"fecha": "2026-05-06", "turno": "Turno 1", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-06", "turno": "Turno 3", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-06", "turno": "Turno 2", "maquina": "E 120", "nave": "Nave 3", "observacion": "Sin programa"}, {"fecha": "2026-05-06", "turno": "Turno 1", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se recibe detenida en proceso de calentamiento, luego se da partida. mantención 22:40 tina 2 presenta alta temperatura de agua, mantención cambia relé de válvula de descarga de agua de tina que tenia contactos doblados, queda ok 22:55, se mantiene estable al 90%, A las 05:30 hrs pierde estabilidad por falta de agua de proceso, mantención interviene y rellena pozos. A las 06:00 hrs se estabiliza a las 06:30 hrs."}, {"fecha": "2026-05-06", "turno": "Turno 3", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se recibe operativa con sobrepeso y flujo interior. Se realizan ajustes operacionales, incorporando mezcla de cera y modificador de impacto, logrando estabilizar condición. A las 12:00 se ajusta bisel quedando estable a las 13:00 hrs."}, {"fecha": "2026-05-06", "turno": "Turno 1", "maquina": "E 140", "nave": "Nave 3", "observacion": "Al inicio se realiza limpieza de calibrador"}, {"fecha": "2026-05-06", "turno": "Turno 3", "maquina": "E 140", "nave": "Nave 3", "observacion": "Se recibe operativa. Entre 08:50 y 09:20 se corta línea por exceso de cera en calibrador, además de vibrado asociado a rodón. Se realizan ajustes de curvatura y limpieza, quedando operativa tras la intervención."}, {"fecha": "2026-05-06", "turno": "Turno 1", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se recibe bajo rendimiento (255 k/h) ya que se trabaja con 100% scrap, se observa variación en gravimétrico, se sube rendimiento gradualmente alcanzando buena estabilidad con 300 kg/hr, se realiza limpieza de batí filtros, además se observa el tiempo de succión muy alto (20 se) obstruyendo el material en la entrada del biofiltro, se regula tiempo a 15 segundos quedando normalizada."}, {"fecha": "2026-05-06", "turno": "Turno 3", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se recibe operativa. A las 09:20 se desacopla manguera de succión hacia silo, provocando pérdida de vacío y activación de alarmas. Se intenta operar mediante tolva, pero sin éxito, por lo que se reduce rendimiento.\nPosteriormente se reconecta manguera, pero persiste alarma por anomalía de succión, resolviéndose mediante limpieza de filtros. Se recupera operación y se restablece rendimiento.\nDurante el turno se descartan tubos por bajo diámetro y posteriormente por sobre espesor y marcas de agua, realizándose ajustes hasta estabilizar la línea.\nCausa raíz identificada: obstrucción en sistema de succión (filtros), generando inestabilidad en alimentación."}, {"fecha": "2026-05-06", "turno": "Turno 2", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se trabaja con 100%scrap, a las 17:00 hrs se det table."}, {"fecha": "2026-05-07", "turno": "Turno 2", "maquina": "E 60", "nave": "Nave 2", "observacion": "Se detine maquina a las 17:00hrs. Material con tonalidad verdosa  (material degradado)"}, {"fecha": "2026-05-07", "turno": "Turno 1", "maquina": "E 70", "nave": "Nave 3", "observacion": "Falla arrastre, mantención interviene, revisa y aplica reset (15 min)"}, {"fecha": "2026-05-07", "turno": "Turno 3", "maquina": "E 70", "nave": "Nave 3", "observacion": "Se recibe operativa, pero con problemas en el abocardado asociados al arrastre de tubería. Entre las 08:00 y 08:30 se realiza regulación de oruga de arrastre, corrigiendo la condición y dejando la línea operativa."}, {"fecha": "2026-05-07", "turno": "Turno 2", "maquina": "E 70", "nave": "Nave 3", "observacion": "Se corta línea 4 veces por atascamiento en el carro de arrastre de abocardado, carro de arrastre desalineado respecto a la tubería, el sensor a veces no detecta bien la tubería y se atasca."}, {"fecha": "2026-05-07", "turno": "Turno 3", "maquina": "E 80", "nave": "Nave 3", "observacion": "Se recibe operativa y trabaja sin novedades durante el turno.\nA las 11:30 se realizan pruebas con material hidráulico 2,6 PHR 318P correspondiente a saca fechada 22-04-2026. Hasta el cierre del reporte se trabaja con la segunda de tres sacas disponibles. El material se comporta estable y las pruebas de impacto resultan conformes."}, {"fecha": "2026-05-07", "turno": "Turno 1", "maquina": "E 90", "nave": "Nave 1", "observacion": "Descarte por limpieza de vacío completo."}, {"fecha": "2026-05-07", "turno": "Turno 3", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se recibe operativa. Durante el turno se realizan ajustes por pestaña corta. Posteriormente se corta línea y, durante el Re enhebrado, la línea se descentra y el vacío se tapa. Se realizan ajustes mecánicos y modificación de perfiles de temperatura hasta recuperar centrado y estabilidad.\nDurante el proceso se descartan tubos debido a retención observada en la manga."}, {"fecha": "2026-05-07", "turno": "Turno 3", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se descarta un rollo quebrado por bajo espesor. La variabilidad del espesor se asocia al uso de scrap en el proceso, por lo que se modifica el parámetro de espesor dejándolo más grueso para mejorar estabilidad del producto."}, {"fecha": "2026-05-07", "turno": "Turno 1", "maquina": "E 110", "nave": "Nave 2", "observacion": "A las 23:20 problemas con mesa de traslado, mantención interviene y realiza ajuste del sensor de traslado y cilindro de traslado hasta las 23:40, posteriormente falla puerta de seguridad quedando arriba, mantención revisa (20 min), luego descarte por campanas mal conformadas."}, {"fecha": "2026-05-07", "turno": "Turno 3", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se descarta tubería debido a fallas en los ciclos de la abocardadora. A las 13:00 se solicita apoyo de mantención, detectándose que la oruga no subía correctamente debido a una fuga de aire.\nComo medida operacional provisoria, se desconecta la manguera de aire encargada de bajar el pistón, permitiendo mantener mejor presión y mejorar el funcionamiento de la oruga. La condición queda informada al turno entrante para evaluación de solución definitiva en una futura detención.\nCausa identificada: fuga neumática en sistema de elevación de oruga."}, {"fecha": "2026-05-07", "turno": "Turno 2", "maquina": "E 110", "nave": "Nave 2", "observacion": "Maquina sin material."}, {"fecha": "2026-05-07", "turno": "Turno 2", "maquina": "E 110", "nave": "Nave 2", "observacion": "Al inicio de turno maquina queda sin material  ya que estaba a la espera para cambio de producto a alcantarillado blanco diámetro 75mm x 6mts. Maquina detenida a las 15:40hrs, Matricería realiza cambio, inconvenientes para el ajuste de campana en abocardado, goma sello con fuga al final de la tubería(matricería cambia goma sello), electroválvula de presión exterior con conexión invertida ( mantención soluciona), se decide partir con Alcantarillado gris y probar abocardado para dar continuidad a la producción por contingencias en la planta. Cambio a Alcantarillado blanco pendiente para el turno entrante."}, {"fecha": "2026-05-07", "turno": "Turno 1", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-07", "turno": "Turno 3", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-07", "turno": "Turno 2", "maquina": "E 120", "nave": "Nave 3", "observacion": "Sin programa"}, {"fecha": "2026-05-07", "turno": "Turno 1", "maquina": "E 130", "nave": "Nave 3", "observacion": "Descarte por pérdida de vacío"}, {"fecha": "2026-05-07", "turno": "Turno 3", "maquina": "E 130", "nave": "Nave 3", "observacion": "Se recibe operativa y trabaja sin novedades durante el turno. A las 07:30 se realizan mejoras por flujo interior aplicando mezcla de cera y MODIFICADOR DE IMPACTO, logrando estabilizar condición sin necesidad de detención."}, {"fecha": "2026-05-07", "turno": "Turno 2", "maquina": "E 130", "nave": "Nave 3", "observacion": "Al inicio del turno (15:35hrs) , manguera de descarga de electroválvula de llenado es estrangulada por la rueda de la batea, generando corte en la manguera (favor de ordenar mangueras de batea, están largas). Mantención soluciona(16:00hrs), se inicia partida normalizando , ok.(16:35hrs)."}, {"fecha": "2026-05-07", "turno": "Turno 2", "maquina": "E 140", "nave": "Nave 3", "observacion": "Se recibe maquina detenida por prueba de cabezal Nuevo ( Canaleta Marron). A espera de calentamiento y reapriete de esta, maquina okey se realiza partida , con observaciones en su espesor, rodón con esperar 0,9mm y cuerpo de canaleta en 1,3mm. Consenso de aprobación por parte de calidad a espera de pruebas el día de mañana."}, {"fecha": "2026-05-07", "turno": "Turno 1", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se baja rendimiento en una oportunidad para limpieza del bati filtro. Máquina se mantiene a 307 kg/hr (83%), no se puede subir mas ya que el tornillo se encuentra al 100% (150 RPM) consumiendo 100% scrap. Revisar estándar"}, {"fecha": "2026-05-07", "turno": "Turno 3", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se recibe operativa. Durante el turno se realizan limpiezas de filtro en dos ocasiones debido a alarmas de anomalía de succión provocadas por filtros tapados. Posteriormente la manguera amarilla deja de enviar material hacia la tolva dosificadora.\nAdemás, al intentar cargar material desde tolva hacia silo, caen los automáticos del deshumidificador y sistema de succión, provocando corte de línea a las 10:00.\nMantención interviene detectando chapaleta deformada en tolva dosificadora, impidiendo señal de carga. La condición se corrige a las 11:37. Respecto al sistema de succión del silo, se detecta motor atorado, debiendo ser reemplazado. Mantención entrega a las 12:18.\nPosteriormente se espera tiempo de calentamiento del material en silo y se da partida a las 12:50, aunque el material aún presenta humedad, por lo que se prolonga el calentamiento antes de estabilizar producción.\nCausas identificadas: obstrucción de filtros, deformación de chapaleta y falla de motor de succión del silo."}, {"fecha": "2026-05-07", "turno": "Turno 2", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se recibe maquina detenida , se chequea estado y comienza partida. Material seco después de la purga, se inicia partida pero con defecto, tubería ovalada , se detiene maquina y  se realiza limpieza de aspersores. Se inia partida nuevamente pero con defecto al interior de la tubería , rayas interiores. Matricería desmonta postizos , realiza limpieza , montaje y se inia partida nuevamente quedando ok. Falla intermitente de carga se baja rendimiento para dar continuidad al proceso."}, {"fecha": "2026-05-07", "turno": "Turno 1", "maquina": "E 160", "nave": "Nave 1", "observacion": "Se realiza cambio dimensional, luego descarte por raya de impureza"}, {"fecha": "2026-05-07", "turno": "Turno 3", "maquina": "E 160", "nave": "Nave 1", "observacion": "Se recibe operativa con gran cantidad de tubería con campana corta acumulada en bandeja. Inicialmente se realizan ajustes logrando mejora temporal, pero posteriormente la falla reaparece.\nSe revisan gomas y se determina que las mordazas no aprietan correctamente la tubería. A las 09:00 se detiene la máquina y se solicita intervención de mantención, informando además problemas con sensores de tubo en líneas 3 y 4.\nMantención entrega el abocardado a las 11:55. Posteriormente se configuran perfiles de temperatura y se realizan pruebas antes de partir a las 12:20. Durante la normalización se descarta tubería hasta estabilizar la condición.\nCausa identificada: falla mecánica en mordazas del abocardado y problemas asociados a sensores de línea."}, {"fecha": "2026-05-07", "turno": "Turno 2", "maquina": "E 160", "nave": "Nave 1", "observacion": "Descarte de tubería al inicio de turno por defecto en campanas, mordazas bloquea tubo con defecto (tiene los oring que atrapan la tubería pero no es suficiente , a veces desplaza la tubería). Solución alternativa, luego ok."}, {"fecha": "2026-05-07", "turno": "Turno 1", "maquina": "E 180", "nave": "Nave 1", "observacion": "Se trabaja con compuesto por falta de pulverizado y los pulverizadores están procesando hidráulico, durante el turno pérdida de vacío por las tapas de la tina."}, {"fecha": "2026-05-07", "turno": "Turno 3", "maquina": "E 180", "nave": "Nave 1", "observacion": "Se registran descartes por exceso de flujo en manga. Se realizan mejoras mediante ajustes de temperatura y regulación de agua, logrando estabilizar el proceso. No se reportan nuevas detenciones posteriores a los ajustes."}, {"fecha": "2026-05-07", "turno": "Turno 2", "maquina": "E 180", "nave": "Nave 1", "observacion": "descarte de tubería por flujo intermitente."}], "demo": false, "real": true}, {"id": "2026-05-08_2026-05-08", "desde": "2026-05-08", nicia partida, luego ok"}, {"fecha": "2026-05-08", "turno": "Turno 1", "maquina": "E 51", "nave": "Nave 2", "observacion": "Descarte de tubos por flujo"}, {"fecha": "2026-05-08", "turno": "Turno 2", "maquina": "E 51", "nave": "Nave 2", "observacion": "Descarte de tuberia por vibrado, luego ok"}, {"fecha": "2026-05-08", "turno": "Turno 2", "maquina": "E 60", "nave": "Nave 2", "observacion": "M60 corte de sierra irregular, mejora luego ok"}, {"fecha": "2026-05-08", "turno": "Turno 1", "maquina": "E 70", "nave": "Nave 3", "observacion": "22:00 hrs Se recibe máquina en funcionamiento, pero con la línea cortada ya que se detectó tubería atascada en el carro de arrastre de la abocardadora, luego se normaliza a las 22:20 hrs"}, {"fecha": "2026-05-08", "turno": "Turno 3", "maquina": "E 70", "nave": "Nave 3", "observacion": "La máquina presentó variaciones de espesor al inicio del turno, realizándose ajustes de carro y excentricidad para estabilizar espesores dentro de estándar. Posteriormente se detuvo a las 08:40 hrs por falla en variador del motor de oruga de arrastre. Mantención intervino y la línea quedó normalizada a las 09:20 hrs.\nCausa raíz: Falla eléctrica/electrónica en variador del sistema de arrastre."}, {"fecha": "2026-05-08", "turno": "Turno 2", "maquina": "E 70", "nave": "Nave 3", "observacion": "ok"}, {"fecha": "2026-05-08", "turno": "Turno 2", "maquina": "E 80", "nave": "Nave 3", "observacion": "Falla en abocardadora, mantención diagnostica y busca solucionar. (Se abre pañol por repuesto solicitado por mantención."}, {"fecha": "2026-05-08", "turno": "Turno 1", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se recibe bajo rendimiento, se sube gradualmente, luego descarte por raya de impureza (20 min), después baja temperatura del horno no logrando conformar campanas bien, se da aviso a mantención para revisión del horno."}, {"fecha": "2026-05-08", "turno": "Turno 3", "maquina": "E 90", "nave": "Nave 1", "observacion": "La máquina se recibió detenida por falla en calefactor N°1 del horno. Mantención realizó reemplazo y posteriormente se detectó manguera de aire desconectada en horno de abocardado. La línea partió a las 12:00 hrs y normalizó a las 12:30 hrs. Más tarde se detectó falla en termocupla por cable cortado, quedando en ajuste de pestaña irregular.\nCausa raíz: Fallas eléctricas y neumáticas en sistema de calefacción y control del horno de abocardado."}, {"fecha": "2026-05-08", "turno": "Turno 2", "maquina": "E 90", "nave": "Nave 1", "observacion": "Se pide asistencia a mtto en sierra para nivelación de palpadores, por bisel defectuoso. Mantenimiento entrtega a las 17:30, se coloca maquina en temperatura de trabajo. Normalizando a las 18:30"}, {"fecha": "2026-05-08", "turno": "Turno 3", "maquina": "E 100", "nave": "Nave 2", "observacion": "La línea se detuvo a las 09:50 hrs para intervención de matricería y mantención en extrusora y calefactores. Durante el proceso se realizaron limpiezas de tina, silo y tolva. Posteriormente se detectó falla en correa de contra motor del carro de tiro, siendo corregida por mantención a las 13:30 hrs.\nCausa raíz: Cambio de producto, Falla mecánica en sistema de arrastre del carro de tiro y necesidad de intervención en sistema térmico de extrusora."}, {"fecha": "2026-05-08", "turno": "Turno 2", "maquina": "E 100", "nave": "Nave 2", "observacion": "Se recibe maquina detenida por cambio, se solicita a matricería tejos nuevos para prueba y mallas nuevas. Matricería no tiene tejos y se vuelve a la condición original, se montan mallas en intercambiador, goma de final de batea sobre diámetro, se solicita cambio de estas, transductor de presión de masa con defecto, mantención soluciona. Se inicia partida, normalizando máquina, luego ok"}, {"fecha": "2026-05-08", "turno": "Turno 1", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se recibe detenida y apagada, se realizan ajustes de abocardadora, se realizan pruebas con máquina detenida, logramos conformar campana, pero al momento de ponerla en funcionamiento salen campanas buenas y otras malas, se observa que el tubo queda en distinta posición y cuando queda mas adelante la arruga, después de varios intentos se decide continuar con tubería lisa."}, {"fecha": "2026-05-08", "turno": "Turno 3", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se descartó tubería por rayas de calibrador y rugosidad interna. Se realizaron limpiezas de calibrador y ductos de vacío, además de cambio de block de válvula en abocardadora por parte de mantención. Posteriormente se ejecutó cambio de producto a alcantarillado 75 blanco, normalizando a las 14:28 hrs.\nCausa raíz: Contaminación/residuos en calibrador y ductos de vacío, además de desgaste/falla neumática en válvula de abocardadora."}, {"fecha": "2026-05-08", "turno": "Turno 2", "maquina": "E 110", "nave": "Nave 2", "observacion": "Se recibe maquina con material filtrado en la hembra, marca negra en la zona inferior de la tubería, en consenso con control de calidad queda un máximo aprobado. Bajo rendimiento. Campanas ajustadas, se realiza mejora, luego ok"}, {"fecha": "2026-05-08", "turno": "Turno 1", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-08", "turno": "Turno 3", "maquina": "E 120", "nave": "Nave 3", "observacion": "Fuera de Programa."}, {"fecha": "2026-05-08", "turno": "Turno 2", "maquina": "E 120", "nave": "Nave 3", "observacion": "Sin programa"}, {"fecha": "2026-05-08", "turno": "Turno 1", "maquina": "E 130", "nave": "Nave 3", "observacion": "02:25 se detiene con antiquemante por filtración de aceite hidráulico por fuga de aceite por flexible hidráulico de la mordaza molde, realizan cambio y relleno de aceite, entregan a las 03:15 hrs, se realizan pruebas y se recupera tubería, luego se da nueva partida a las 04:00 hrs quedando normalizada a las 04:30 hrs."}, {"fecha": "2026-05-08", "turno": "Turno 3", "maquina": "E 130", "nave": "Nave 3", "observacion": "La línea presentó reiterados prob bido a detención del abocardado provocada por sensores contaminados con aceite, realizándose limpieza y normalización. La línea continuó operativa en turno especial.\nCausa raíz: Contaminación de sensores del sistema de abocardado."}, {"fecha": "2026-05-09", "turno": "Turno 1", "maquina": "E 140", "nave": "Nave 3", "observacion": "Se recibe detenida en temperatura de purga, se pone en temperatura de trabajo y luego a las 22:25 hrs, matricería  realiza reapriete de pernos y el acople coextrusora (15 min), luego a las 02:30 hrs se detiene con AQ por rodón vibrado, matricería interviene (00:15 hrs a 1:25 hrs) limpieza de 2 primeras placas y  rodón se coloca temperaturas de trabajo para poder dar partida a las 2:30 se vuelve a detener con anti quemante se llama a matricería, desarman y encuentran material quemado en coextrusora, se limpia primera placa entregan máquina a las 3:10 se colocan temperatura de trabajo"}, {"fecha": "2026-05-09", "turno": "Turno 3", "maquina": "E 140", "nave": "Nave 3", "observacion": "La máquina se recibió detenida con temperaturas apagadas. Matricería realizó ajuste de postizo y reparación por quemadura en boquilla, entregando a las 10:44 hrs.\nDurante la partida no se logró estabilizar debido a diferencias de flujo y bajo espesor en canaleta, por lo que matricería realizó nuevo cambio de postizo, pasando de 11.8 a 12.1 mm. Posteriormente mantención intervino calefactores, entregando a las 13:35 hrs. La línea partió nuevamente a las 13:40 hrs y normalizó a las 13:50 hrs, continuando operativa en turno especial.\nCausa raíz: Desgaste de superficie en cuello de la coextrusora, diámetro del postizo y fallas térmicas en sistema de calefacción."}, {"fecha": "2026-05-09", "turno": "Turno 1", "maquina": "E 150", "nave": "Nave 1", "observacion": "Se aumenta gradualmente su rendimiento hasta 300 Kg/h  pero a las 2:50am se corta línea por falta de material en la tolva superior, se vuelve a dar inicio a la producción a las 3:00 am normalizando a las 3:15am llevándola nuevamente a 300 Kg/h, se mantiene en observación para ver el estado del ciclo de succión, ante cualquier problema de succión se interviene bajando el rendimiento a 250 Kg/h."}, {"fecha": "2026-05-09", "turno": "Turno 3", "maquina": "E 150", "nave": "Nave 1", "observacion": "La máquina se recibió operativa y se realizaron ajustes por bajo espesor. Posteriormente trabajó sin novedades relevantes hasta detenerse a las 13:30 hrs, quedando como alternativa mientras Máquina 40 permanecía detenida.\nCausa raíz: Variación de espesor asociada a parámetros de proceso, bajo rendimiento por consumo de scrap 100%"}, {"fecha": "2026-05-09", "turno": "Turno 1", "maquina": "E 160", "nave": "Nave 1", "observacion": "Se recibe en 68% de rendimiento y se sube gradualmente hasta llegar a 82% manteniéndose estable."}, {"fecha": "2026-05-09", "turno": "Turno 3", "maquina": "E 160", "nave": "Nave 1", "observacion": "Durante el turno se realizaron cortes de línea por falta de modificador de impacto y pérdidas de vacío por incrustaciones aparentemente trozos de goma. También se descartó tubería por atascamiento en línea 2 de mesa debido a desalineación de guías superiores, implementándose tubos guía para corregir la condición.\nPosteriormente, a las 18:30 hrs, la máquina se detuvo debido a calibradores tapados y calientes que no lograban limpiarse con aire, provocando cortes reiterados de línea. Matricería intervino y entregó el equipo a las 18:50 hrs.\nCausa raíz: Incrustaciones en calibradores y desalineación mecánica de guías en mesa de transporte."}], "demo": false, "real": true}, {"id": "2026-05-10_2026-05-10", "desde": "2026-05-10", "hasta": "2026-05-10", "importedAt": "2026-05-10T00:00:00.000Z", "turnos": {"Turno 1": {"jefePlanta": "Ivan Jerez", "kilos": 35662.82316, "sobrepeso": 0.015446676151479412, "scrap": 2584, "std": 45105.0, "eficiencia": 0.7906623026272032, "causas": {"PR": 535, "MP": 545, "MT": 0, "MN": 315, "C": 0, "PROY": 0, "P": 0}, "naves": {"Nave 1": {"
